name: UVT
full_name: "UVT: Unified Visuomotor Targets — Supervising VLAs Beyond Physical Actions"
organization: "University of California, Irvine (Department of Computer Science)"
date: "2026-08-04"
paper_url: https://arxiv.org/abs/2608.03563
code_url: null
venue: "IROS (submission; acknowledges IROS reviewers and Area Chair)"
open_source: false
model_type: vla

architecture:
  backbone: "Backbone-agnostic; instantiated on VLA-Adapter (regression head) and pi0.5 (flow-matching action expert)"
  llm: "Inherited from the host VLA (VLA-Adapter VLM backbone / pi0.5 VLM backbone)"
  action_head: >
    Unchanged host policy head, re-targeted to predict a 32-D unified visuomotor target u_t
    instead of raw actions; a trainable MVAE action decoder g_a maps predicted u_t back to an
    executable action chunk. Demonstrated with a regression-style head (L2 on u_t, VLA-Adapter)
    and a flow-matching head that generates u_t in place of a_t (pi0.5).
  action_head_category: regression
  action_space: continuous
  parameters: "No added policy parameters (lightweight MVAE encoders/decoders only); host VLA size unchanged"
  key_innovation: >
    Changes *what* a VLA is supervised to predict rather than *how* it is architected. A frozen
    pretrained Latent Action Model (inverse-dynamics on image pairs v_t, v_{t+k}) yields a discrete
    dynamics code z_t. A lightweight multimodal VAE encodes the action chunk a_t and z_t into two
    diagonal Gaussians in a shared space, fuses them by weighted Product-of-Experts with learnable
    precision weights alpha_a, alpha_z, and takes the fused mean as the unified visuomotor target
    u_t in R^32. MVAE training minimizes L_UVT = L_ACT (L1 action recon) + L_DYN (CE on dynamics code)
    + L_KL. Targets are precomputed once, then the VLA is fine-tuned with
    L_VLA = ||u_hat - u||_2^2 + gamma * ||a_hat - a||_1 (gamma = 0.5), the action decoder kept
    trainable so it adapts to the predicted-UVT distribution. Requires no architectural change,
    no extra data, and no schedule change.

training:
  dataset: "LIBERO and LIBERO-Plus demonstration data; 30 human VR-teleoperated demos per real bimanual task"
  method: >
    Two stages. (1) Train the precision-aware MVAE once on the demonstration dataset to build u_t
    from (a_t, z_t) and precompute u_t for every sample. (2) Fine-tune the VLA on triples
    (x_t, u_t, a_t) with the UVT alignment loss plus the trainable-decoder action loss. Identical
    data splits, batch sizes and optimization schedules as the baselines; results reported at fixed
    step budgets of 10k and 100k.
  compute: "NVIDIA A6000; ~8 GPU hours for the 10k-step budget; 10 GPU hours per real-world task"

