# Paper: Dense to MoE Adaptation for Compact Vision Language Action Policies
# arXiv: 2609.16503

name: AdaDE
full_name: "AdaDE: Dense to MoE Adaptation with Adaptive Dynamic Expert Deactivation for Compact VLA Policies"
organization: "Shanghai Jiao Tong University / Tianji KernalMind Co., Ltd. / Alibaba Group"
date: "2026-09-18"  # arXiv stamp on the PDF (2609.16503v2, 18 Sep 2026); v1 date not stated in the paper
paper_url: https://arxiv.org/abs/2609.16503
code_url: null  # Not stated in the paper
venue: "Not stated in the paper"
open_source: false  # code/weights release not stated in the paper
model_type: "compression method (Dense2MoE reparameterization + adaptive expert deactivation during VLA fine-tuning)"

architecture:
  backbone: "pi0.5: PaliGemma (Gemma-2B) + SigLIP vision encoder; LLM-side FFNs (language model + action expert) converted to width-partitioned MoE layers (10 experts per module; 63 converted modules, dynamic deactivation on 36)"
  llm: "Gemma-2B (PaliGemma) with Gemma-300M action expert"
  action_head: "pi0.5 flow-matching action expert (unchanged interface; its FFNs converted to MoE and partially deactivated)"
  action_head_category: flow_matching
  parameters: "3.618B dense pi0.5 -> 2.841B (40% LLM deactivated) / 2.619B (50%) (Paper Table I(b))"
  key_innovation: "Function-preserving Dense2MoE conversion (contiguous channel slices of gate/up/down projections, zero-initialized router so MoE output equals dense output at init) followed by AdaDE: warmup, EMA-smoothed router-utilization-based layer-wise expert masking with Wanda-protected experts (top 25%), minimum active experts and update budget, auxiliary min-probability routing loss, then mask freeze and physical removal of inactive experts from the checkpoint"

training:
  base_model: "pi0.5 (main); OpenVLA (compression comparison, Table II)"
  method: "Fine-tuning with task loss + auxiliary routing loss; three stages (warmup, dynamic deactivation, final freeze)"
  steps: "40,000 (Table V); mask warmup 1,000, update interval 100 steps, freeze at 15,000"
  optimizer: "AdamW, peak LR 5e-5, 10,000 LR warmup steps"
  hardware: "NVIDIA A100 (simulation); RTX 4090 (real-robot inference)"

