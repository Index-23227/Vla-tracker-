# Paper: GaussVLA: Geometry-Aware Spatial Reasoning for Vision-Language-Action Model
# arXiv: 2608.24959

name: GaussVLA
full_name: "GaussVLA: Geometry-Aware Spatial Reasoning for Vision-Language-Action Model"
organization: "Yeungnam University / Kyungpook National University"
date: "2026-08-25"
paper_url: https://arxiv.org/abs/2608.24959
code_url: null
venue: "BMVC 2026"
open_source: false

architecture:
  backbone: "Frozen SigLIP-SO400M/14 (256 patches) + frozen Depth-Anything-V2 ViT-L + frozen CLIP text encoder; trainable Mamba policy backbone (5 blocks, d_b=512, intermediate 1024)"
  action_head: "Flow-matching action decoder (two cross-attention blocks, 4 heads) predicting 7-DoF chunks of H=10 with 10 Euler steps; action-token states attend to context states and DA-CoT tokens"
  action_head_category: flow_matching
  parameters: "200M total / 179M trainable, excluding frozen SigLIP, Depth-Anything-V2 and CLIP (paper text and Table 4; Table 1 lists '1B' in its parameter column)"
  key_innovation: "Gaussian Spatial Tokenizer (GST) back-projects each SigLIP patch with affine-corrected monocular depth and predicts a residual 3D mean, log-scale and opacity per patch, encodes means with 3D Fourier features, and pools 256 patches into 128 tokens per camera with opacity-biased (log alpha) cross-attention. Depth-Aware Chain-of-Thought (DA-CoT) uses 4 learnable queries that cross-attend to GST tokens under language and flow-time conditioning (non-autoregressive), supervised by an auxiliary velocity-prediction loss. Losses: flow matching + opacity-weighted depth consistency + DA-CoT velocity loss. 12.97 ms/step on an RTX Pro 6000 Blackwell."

training:
  method: "Trained from scratch for GST, DA-CoT, Mamba backbone and action decoder (all encoders frozen); AdamW lr 2.5e-5, wd 1e-4, batch 256, BF16, cosine schedule, flow time ~ Beta(1.5,1.0), lambda_GST 0.05, lambda_CoT 0.10 with 5-epoch warm-up"
  data: "LIBERO, Meta-World, CALVIN ABCD->D 10% subset demos; 50 teleoperated demos per SO-101 real task"

