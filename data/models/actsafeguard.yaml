# Paper: ActSafeGuard: Differentiable and Training-Aligned Constraint Enforcement for Flow-Matching Policies
# arXiv: 2609.11697

name: ActSafeGuard
full_name: "ActSafeGuard: Differentiable and Training-Aligned Constraint Enforcement for Flow-Matching Policies"
organization: "Shanghai Jiao Tong University / Shanghai Innovation Institute"
date: "2026-09-10"
paper_url: https://arxiv.org/abs/2609.11697
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (primary); also instantiated on Fast-WAM (Wan2.2-TI2V-5B video branch + 30-layer action-DiT, ~6.02B)"
  action_head: "pi0.5 flow-matching action expert reparameterized as an N-step discrete flow (N=10), with a parameter-free ray-scaling safety operator applied to every discrete update in both training and inference"
  action_head_category: flow_matching
  parameters: "pi0.5 backbone size; ActSafeGuard adds no learnable parameters"
  key_innovation: "Training-aligned hard-constraint enforcement: each discrete flow step Delta = s * v/N, with s = min(1, alpha) from ray shooting to the nearest facet of a state-dependent convex polytope A(o_t)x <= b(o_t). The operator is differentiable; its Jacobian acts as an oblique projection giving boundary-sliding gradients, so the policy is fine-tuned end-to-end through the safeguard and guarantees 100% step safety rate."

training:
  base_model: "pi0.5 (also Fast-WAM)"
  method: "Full-parameter fine-tuning (VLM + action expert) with discrete-time flow-matching loss computed through the ActSafeGuard operator; pi0.5: 50k steps, batch 32, peak lr 2.5e-5, 4x H100; Fast-WAM: 200k steps, 8x H200"
  data: "RoboTwin 2.0: 300 successful trajectories per task (4 tasks); real robot: 50 teleop demos per task"
  hardware: "4x H100 (pi0.5), 8x H200 (Fast-WAM)"

benchmarks:
  robotwin_v2_constrained_poscons:
    lift_pot: 100
    place_shoe: 90
    hanging_mug: 34
    place_empty_cup: 97
    mean_sr: 80.25
    step_safety_rate: 100
    source: "Paper Table 1, pi0.5 ActSafeGuard row, Static Constraints"
    date_reported: "2026-09-10"
    eval_condition: "RoboTwin 2.0 ALOHA-AgileX, 4-task subset, static joint-position constraints (PosCons) on 12 arm joints, 100 episodes per task"

  robotwin_v2_constrained_posvel:
    lift_pot: 100
    place_shoe: 98
    hanging_mug: 31
    place_empty_cup: 97
    mean_sr: 81.50
    step_safety_rate: 100
    source: "Paper Table 1, pi0.5 ActSafeGuard row, Dynamic Constraints"
    eval_condition: "same 4 tasks, position + state-dependent velocity constraints (PosCons + VelCons)"

  robotwin_v2_constrained_pi05_baselines:
    unconstrained_mean_sr: 75.25
    projection_poscons_mean_sr: 74.75
    truncation_poscons_mean_sr: 77.25
    gaugeflow_poscons_mean_sr: 75.00
    projection_posvel_mean_sr: 76.25
    truncation_posvel_mean_sr: 76.75
    unconstrained_poscons_mean_ssr: 51.42
    unconstrained_posvel_mean_ssr: 48.09
    source: "Paper Tables 1 and 2 (pi0.5 backbone)"
    eval_condition: "baselines: unconstrained pi0.5, inference-time projection, post-hoc truncation, GaugeFlow (PosCons only)"

  robotwin_v2_constrained_fastwam_poscons:
