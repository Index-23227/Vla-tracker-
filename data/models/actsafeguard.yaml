    eval_condition: "Fast-WAM backbone variant, PosCons + VelCons"

  robotwin_v2_constrained_fastwam_baselines:
    unconstrained_mean_sr: 83.25
    projection_poscons_mean_sr: 76.25
    truncation_poscons_mean_sr: 79.50
    gaugeflow_poscons_mean_sr: 77.25
    projection_posvel_mean_sr: 75.50
    truncation_posvel_mean_sr: 81.75
    unconstrained_poscons_mean_ssr: 22.99
