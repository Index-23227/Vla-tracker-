    place_empty_cup_poscons_stop_grad_sr: 95.0
    source: "Paper Table 3"
    eval_condition: "ablation: stop-gradient on the safety scaling factor during training (pi0.5)"

  real_world:
    pick_green_cube_successes_of_5: 5
    guide_the_ball_successes_of_5: 5
    source: "Paper Real-Robot Deployment section text"
    date_reported: "2026-09-10"
    eval_condition: "AgileX ALOHA, pi0.5 fine-tuned on 50 demos per task, 5 rollouts per task; joint-limit box (pick green cube) and non-convex L-shaped EEF corridor (guide the ball)"

  real_world_baseline:
    pick_green_cube_successes_of_5: 5
    guide_the_ball_successes_of_5: 4
    source: "Paper Real-Robot Deployment section text"
