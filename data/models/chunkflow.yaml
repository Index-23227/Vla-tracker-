name: ChunkFlow
full_name: "ChunkFlow: Towards Continuity-Consistent Chunked Policy Learning"
organization: "Xi'an Jiaotong University & Jiangsu Cytoderm Intelligent Technology"
date: "2026-07-14"
paper_url: https://arxiv.org/abs/2607.12992
code_url: https://cytoderm-ai.github.io/chunkflow
venue: null
open_source: false

architecture:
  action_head: "Chunked action head with deterministic parameter-free overlap blending (frozen/editable/future zones)"
  action_head_category: regression
  parameters: "not reported"
  key_innovation: "Seam-aware training-and-execution framework for chunked policies. Partitions each chunk into frozen/editable/future zones, applies deterministic overlap blending at execution, and trains raw predictions with seam plus first- and second-order continuity losses. A structure-preserving AWAC fine-tuning stage adapts the policy while retaining the regularizers, reducing boundary jitter without extra inference-time cost."

benchmarks:
  libero:
    libero_long: 93.4
    source: "Table II (LIBERO-Long SR, fine-tuned)"
  calvin:
    calvin_abc_d_avg_len: 4.30
    source: "Table I (CALVIN ABC-D avg sequence length)"

eval_conditions:
  libero:
    condition: "fine-tuned"
    note: "LIBERO-Long success rate only"
  calvin:
    condition: "fine-tuned"
    note: "ABC-D, 5-step average episode length"

tags: [libero, calvin, action-chunking, continuity, awac]
