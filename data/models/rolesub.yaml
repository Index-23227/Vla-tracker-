training:
  datasets: ["LIBERO RLDS (no-op filtered): Spatial 432, Object 454, Goal 428, LIBERO-10 379 episodes"]
  method: "Frozen OpenVLA-OFT-7B backbone; LoRA (rank 32, scaling 16) + routing heads + latent role estimator trained jointly with the L1 action-chunk loss; AdamW lr 2e-4, effective batch 8, image augmentation"

eval_conditions:
  libero: "fine-tuned (LoRA + router); four LIBERO suites, 10 tasks x 50 trials each, fixed simulator config and seed"

tags: [kv_compression, sub_token_routing, token_pruning, efficient_inference, lora, openvla_oft, libero, regression]
