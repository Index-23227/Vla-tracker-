    libero_object: 96.4
    libero_spatial: 97.8
    source: "Paper Table 1, RoleSub row, visual keep 32/512, K_vis=1 (3.32% visual KV)"
    eval_condition: "OpenVLA-OFT-7B + LoRA and routing trained on no-op-filtered LIBERO RLDS data; 32 of 512 visual tokens retained, 1 of 16 value groups per visual token; language/proprio/action values uncompressed; 50 trials per task"

