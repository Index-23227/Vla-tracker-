name: RoleSub
full_name: "Role-Conditioned Sub-Token Routing for Efficient Vision-Language-Action Policies"
organization: "Futurewei Technologies"
date: "2026-08-19"
paper_url: https://arxiv.org/abs/2608.18410
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "OpenVLA-OFT-7B (Llama-2-7B with fused SigLIP + DINOv2 visual features, two camera views, 512 visual tokens)"
  llm: "Llama-2 7B"
  action_head: "OpenVLA-OFT parallel decoding head with continuous L1-regression action chunks (8-action chunk per control step)"
  action_head_category: regression
  parameters: "7.65B total; ~110.8M trainable LoRA (rank 32, all linear layers) + ~4.20M routing heads + ~0.55M latent role estimator; pretrained backbone frozen"
  key_innovation: "KV compression along the value width of retained tokens instead of removing more tokens. After VLA-ADP-style visual-token pruning, each retained value vector is rotated by a fixed random orthonormal matrix (lossless change of basis), split into S=16 groups of 256 dims, and a router keeps the Top-K groups per token; routing score = token-state head + 0.1 x learned soft latent-role projection (C=6 components) + 0.1 x pooled language-context head, with a role-driven allocator redistributing a per-token-type group budget. Router, role estimator and LoRA adapters are trained jointly with the L1 action loss (straight-through estimator for Top-K). The same routing can compress language values without removing language tokens."

