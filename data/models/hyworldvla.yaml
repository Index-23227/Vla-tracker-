name: HyWorldVLA
version: '1.0'
full_name: "HyWorldVLA: A Vision-Language-Action Model with Hybrid World Modeling for Autonomous Driving"
organization: "Automotive New Technology Research Institute, BYD Company Limited"
date: '2026-07-23'
paper_url: https://arxiv.org/abs/2607.20988
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla
architecture:
  backbone: "Emu3 unified multimodal autoregressive backbone; VQGAN visual tokenizer for discrete visual tokens; text-guided video VAE (VideoVAEPlus, 4-channel) with 8x spatial and 4x temporal compression and Flan-T5 text cross-attention"
  llm: "Emu3 (unified autoregressive multimodal model)"
  action_head: "Action expert coupled to the VLM via joint attention (pi0-style), conditioned on predicted future latent z2, historical waypoints and driving commands; instantiated as flow-matching generative head and as selection-based trajectory-vocabulary scoring head"
  action_head_category: hybrid
  action_space: "continuous future ego waypoints (x, y, theta) over a 4.0 s horizon"
  parameters: null
  key_innovation: "Hybrid world modeling that unifies pixel-level supervision and latent prediction: during pre-training the model jointly predicts VQ visual tokens (pixel grounding) and video-VAE latents via a learnable query token Q, while during co-fine-tuning it predicts only latents that condition the action expert. Pixel reconstruction acts as a structural regularizer preventing latent representation collapse, while latent-only inference gives scene-noise robustness. Language guidance is injected into the video VAE through Flan-T5 text cross-attention."
training:
  vae_stage: "VideoVAEPlus fine-tuned on NuPlan; 8 frames per segment resized to 216x216, scene captions generated by Qwen3.6-plus; 4 PPUs (Alibaba Cloud), per-PPU batch size 1, 100K steps; GAN loss weight 0.5 (enabled after 50K steps), KL loss weight 1e-6"
  pretraining: "OpenScene dataset (>120 hours of driving video, 20.0 s clips); history horizon H = 1.0 s, future horizon T = 4.0 s, chunk duration 1.0 s (N = 6 chunks); batch size 4 across 2 nodes of 16 PPUs each; LR 2.2e-4, 4000 steps; loss weights lambda1 = 0.5 (visual tokens), lambda2 = 0.1 (latent)"
  co_finetuning: "NAVSIM trainval (>100,000 frames with ground-truth ego trajectories); 4000 steps, total batch size 96, LR 5e-5, latent loss weight lambda3 = 0.1"
  tokenizers: "FAST action tokenizer for waypoint chunks; Emu3 tokenizer for driving commands; VQGAN for visual tokens"
  navsim_v1_results: "PDMS 90.59 (NC 98.6, DAC 98.9, TTC 95.1, C. 99.3, EP 84.6), single front-view camera; vs DriveVLA-W0 90.2, ReCogDrive-8B 90.5, CoWorld-VLA 89.8"
  navsim_v2_results: "EPDMS 89.71 (NC 98.8, DAC 98.2, DDC 99.5, TLC 99.9, EP 87.8, TTC 98.1, LK 96.2, HC 98.3, EC 77.4); vs ExploreVLA 88.8, Latent-WAM 87.7, DriveVLA-W0 86.1"
  noise_robustness: "655 rain/fog-corrupted OpenScene test cases: PDMS 86.87 vs DriveLaW 67.49, DriveVLA-W0 61.18, WoTE 60.65; internal ablations Pure WAM 69.95, w/o latent supervision 73.18"
  ablations: "Pure WAM 89.91, Pure LWM 87.50, w/o language guidance in latent 90.35, w/o latent condition in action expert 90.29, w/o latent supervision in co-fine-tuning 90.17, full model 90.59 PDMS"
benchmarks: {}
eval_conditions:
  navsim_v1: "fine-tuned on NAVSIM trainval; closed-loop NAVSIM v1 evaluation, single front-view camera"
  navsim_v2: "fine-tuned on NAVSIM trainval; closed-loop NAVSIM v2 extended-metric evaluation"
  noise_robustness: "655 rain/fog non-uniform-noise cases collected from the OpenScene test split"
tags:
