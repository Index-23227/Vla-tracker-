    task2_subxiphoid_transverse: 46.7
    task3_right_subcostal_oblique: 33.3
    task4_left_kidney_long_axis: 63.3
    task5_left_kidney_transverse: 53.3
    avg: 52.7
    source: "Paper Table 1 (row pi0-base w/o US)"
    date_reported: "2026-08-17"
    eval_condition: "pi0 fine-tuned without ultrasound input, same success-rate protocol"

