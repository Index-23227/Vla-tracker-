    task3_right_subcostal_oblique: 40.0
    task4_left_kidney_long_axis: 66.7
    task5_left_kidney_transverse: 56.7
    avg: 58.0
    source: "Paper Table 1 (row pi0.5 w/o US)"
    date_reported: "2026-08-17"
    eval_condition: "pi0.5 without ultrasound input, same success-rate protocol"

  real_world_baseline_pi05_w_us:
    task1_aorta_sagittal: 86.7
    task2_subxiphoid_transverse: 66.7
    task3_right_subcostal_oblique: 46.7
    task4_left_kidney_long_axis: 83.3
    task5_left_kidney_transverse: 66.7
    avg: 70.0
    source: "Paper Table 1 (row pi0.5 w/ US)"
    date_reported: "2026-08-17"
    eval_condition: "pi0.5 with ultrasound input, same success-rate protocol"

  real_world_ablation_us_plus_usfm:
