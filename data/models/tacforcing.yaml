# Paper: TacForcing: Streaming Action Generation with Execution-Time Tactile Feedback
# arXiv: 2608.25798

name: TacForcing
full_name: "TacForcing: Streaming Action Generation with Execution-Time Tactile Feedback"
organization: "Shanghai Jiao Tong University (SJTU) with SCUT, ECUST, ECNU, PolyU, CCUT, UESTC, HUST"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25798
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (simulation) / GR00T N1.7 (real world) VLM; task context (vision, language, proprioception) encoded once per chunk and reused during streaming generation"
  llm: "pi0.5 VLM (simulation) / GR00T N1.7 VLM (real world)"
  action_head: "Streaming Action Expert replacing the standard flow-matching action expert: block-wise flow scheduling (chunk split into K blocks of B=5 actions, each block with its own flow time, completed blocks dispatched sequentially while unfinished blocks keep intermediate states); tactile tokens from a shared tactile encoder (initialized from FTP-1) refreshed after each executed block; Execution-Aware Tactile Attention (EATA) mask lets the latest tactile tokens condition only the next block to execute"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "not stated (initialized from pi0.5 in simulation and GR00T N1.7 in the real world)"
  key_innovation: "Streams action generation during execution so tactile feedback acquired mid-chunk conditions the remaining actions of the same chunk without a separate high-frequency reactive controller; EATA restricts each tactile update to the block executed next, and training uses block-wise intermediate states with the matching tactile observation and mask."

training:
  datasets: ["UniVTAC simulation: 50 demonstrations per task", "Real world: 100 demonstrations per task (dual RealMan RM75 arms + Sharpa Wave dexterous hands with fingertip tactile sensors, Manus Pro glove teleoperation)"]
  method: "Fine-tune pi0.5 (sim, 15k steps, batch 256, lr 5e-5, H=50, K=10) or GR00T N1.7 (real, 30k steps, batch 256, lr 6e-5, H=40, K=8) with a block-wise flow-matching loss over unfinished actions only, sampling a generation progress p and using the tactile observation and EATA mask of the corresponding execution stage"

