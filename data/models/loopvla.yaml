open_source: false

architecture:
  action_head: "Recurrent refinement: first 4 transformer layers (Perceptual Anchor Layers, PAL) are frozen, then a shared 3-layer Loop Block is applied iteratively (up to 8 iterations) on multimodal tokens. Each iteration produces (a) a candidate action via the action head and (b) a halting probability via the sufficiency head. Remaining Mass Allocation (RMA) converts halting scores into a valid distribution p(n) = s(n)*r(n) over refinement steps. Two-stage training: Stage 1 supervises all intermediates with L1 + entropy/diversity regularization; Stage 2 calibrates halting distribution to action-quality-derived target via KL divergence."
  action_head_category: other
  backbone: "Qwen3VL-2B-Instruction (SigLIP-2 visual encoder + 28-layer transformer decoder)"
  parameters: "LoopOFT*: 1.2B (vs 2.2B Qwen3OFT baseline, -45%); LoopFM: 1.3B (vs 2.3B Qwen3FM, -43%)"
  key_innovation: "LoopVLA proposes a recurrent VLA architecture that jointly learns representation refinement, action prediction, and sufficiency estimation by iteratively applying a shared 3-layer Transformer Loop Block on top of 4 frozen Perceptual Anchor Layers. Each iteration emits both a candidate action and a sufficiency score; Remaining Mass Allocation normalizes these into a valid stopping distribution. Because sufficiency has no direct supervision, a self-supervised distribution-alignment objective trains intermediate confidence scores to match relative action quality across refinement steps. Achieves 45% parameter reduction (2.2B -> 1.2B) and up to 1.7x throughput while matching or surpassing strong baselines on LIBERO (96.0% avg), LIBERO-Plus, and VLA-Arena."

