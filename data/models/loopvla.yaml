# Paper: LoopVLA: Learning Sufficiency in Recurrent Refinement for Vision-Language-Action Models
# arXiv: 2605.09948

name: LoopVLA
full_name: "LoopVLA: Learning Sufficiency in Recurrent Refinement for Vision-Language-Action Models"
organization: "Huazhong University of Science and Technology (HUST), Wuhan United Imaging Surgical Co., Ltd."
