open_source: false

architecture:
  action_head: "Dual-expert flow-matching (frozen Prior Expert + trainable Adaptation Expert) over pi0.5-style VLM (SigLIP + Gemma-2B)"
  action_head_category: flow_matching
  parameters: "Backbone: SigLIP vision encoder + Gemma-2B language model + flow-matching action expert (pi0.5-style); PriorVLA updates ~25% of the parameters that full fine-tuning would update. Absolute trainable count not stated."
  key_innovation: "Prior-preserving adaptation framework. Keeps a frozen Prior Expert as read-only prior source and trains an Adaptation Expert (initialized from identical weights) for downstream specialization. Three learnable Expert Query token groups capture (a) Scene Queries — task-relevant visual priors from the pretrained VLM, (b) Motor Queries — motor priors from the frozen Prior Expert, (c) Action Queries — integrating scene+motor priors inside the Adaptation Expert. Both experts receive identical noisy action chunks during denoising but only Adaptation Expert's output updates the trajectory. Yields strong OOD / few-shot gains by avoiding prior drift typical of full fine-tuning."

