# Paper: SMILE: Smooth Motion for Improved Long-Horizon VLA Execution
# arXiv: 2608.29432

name: SMILE
full_name: "SMILE: Smooth Motion for Improved Long-Horizon VLA Execution"
organization: "Stony Brook University / Salesforce AI Research"
date: "2026-08-29"
paper_url: https://arxiv.org/abs/2608.29432
code_url: null
venue: arXiv
open_source: false
model_type: vla_action_interface

architecture:
  backbone: "Architecture-preserving: retains each base policy's VLA backbone, conditioning pathway and main denoising block unchanged. Instantiated on SmolVLA (0.4B), Evo-1 (0.8B), VPP (1.8B) and DAWN (1.2B)"
  action_head: "B-spline coefficient heads replacing the raw-action input projection and output heads of the base denoising action expert; the expert denoises K=8 cubic (P=3) B-spline coefficients for translation (Kx3), rotation (Kx3) and gripper (Kx1), decoded by a fixed basis into an F-step smooth native action sequence (finite differences for translation, SO(3) relative rotations, clipped absolute gripper)"
  action_head_category: other
  parameters: "Same scale as each base model: SMILE-SmolVLA 0.4B, SMILE-Evo1 0.8B, SMILE-DAWN 1.2B, SMILE-VPP 1.8B"
  key_innovation: >
    Replaces raw per-step action denoising with coefficient-space denoising: targets are least-squares projections of
    cumulative translation/rotation and absolute gripper trajectories onto a fixed B-spline basis, and the base model's
    own flow-matching (velocity) or diffusion (noise) objective is applied to the normalized coefficients with equal
    per-modality weights. Because decoded actions are coupled across time, intra-chunk jitter and outliers are
    suppressed, allowing a longer fixed execution horizon H (more actions per model call) with higher success and
    lower amortized latency per action, without changing model scale.

training:
  method: "Fine-tune each base action expert with its native denoising objective on B-spline coefficient targets (lambda_tr = lambda_rot = lambda_grip = 1); only the action-side input projection and output heads are replaced"
  training_data: "Same expert trajectories as each baseline (LIBERO for SmolVLA/Evo1, CALVIN ABC for VPP/DAWN); real world: 1,000 xArm7 episodes across 12 tasks, each matched pair initialized from the same official pretrained checkpoint with an identical fine-tuning budget"

