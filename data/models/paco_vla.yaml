# Paper: PaCo-VLA: Passivity-Shielded Compliance Prior for Contact-Rich Vision-Language-Action Manipulation
# arXiv: 2606.00515

name: PaCo-VLA
full_name: "PaCo-VLA: Passivity-Shielded Compliance Prior for Contact-Rich Vision-Language-Action Manipulation"
organization: "Southwest Jiaotong University; University of Leeds"
date: "2026-05-30"
paper_url: https://arxiv.org/abs/2606.00515
code_url: null
venue: arXiv preprint
open_source: false

model_type: vla

architecture:
  backbone: "OpenVLA as semantic proposal source (treated as black box; only used for binding/stage/recovery/admittance proposals)"
  action_head: "Compliance prior interface: VLA emits a low-rate (50 Hz) tuple (semantic binding, task stage, recovery cue, diagonal admittance schedule M/D/K, validity quantities) instead of motor commands; a 250 Hz proposal-independent passivity shield projects the proposal into admissible boxes, enforces a sampled diagonal-admittance passivity margin, charges active mass/stiffness increases against an energy tank, and only then drives the Cartesian admittance port"
  action_head_category: other
  action_space: continuous
  parameters: "Underlying OpenVLA backbone (7B class) used as proposal source; shield/runtime contract has no trainable parameters"
  key_innovation: "Reframes the VLA-to-robot interface for contact-rich manipulation: rather than letting the VLA directly emit motor commands, treat its outputs as task-level compliance proposals (semantic binding, task stage, recovery cue, diagonal admittance schedule). A proposal-independent 250 Hz passivity shield then (i) clips into parameter boxes, (ii) enforces a sampled diagonal-admittance passivity margin (2D_i - (M_i - M_{k-1,i})/Δt_k >= 2*d_margin), and (iii) charges only positive M/K jumps to an energy tank with bounded interpolation β_k ∈ [0,1]. Because learned, classical, delayed, random, and recovery proposals all pass through the same shield, the applied-command contract is provably proposal-independent — enabling a sampled storage inequality S_k - S_{k-1} ≤ F_k^T v_k Δt_k + ε_k^num and clean causal attribution of semantic value via paired counterfactuals."

training:
  method: "No additional VLA training; PaCo-VLA wraps a pretrained OpenVLA service with a passivity-shielded compliance interface. The shield itself is parameter-free (governed by box / margin / tank hyperparameters in Table 5 of the paper)."
  compute: "2 x NVIDIA RTX 4090 GPUs for OpenVLA inference (bfloat16); 250 Hz shield, classical controllers, force/torque logging and real-robot servo loop run without GPU acceleration"
  notes: "Default runtime: safety projection/compliance 250 Hz, policy proposals 50 Hz, camera 10 Hz, d_margin=2, E_min=0.5, E_max=20, α=1.2, mass box [0.1,10], damping box [5,500], stiffness box [0,2000], OpenVLA service timeout 0.20 s, stale-proposal threshold 0.30 s. Seed 2026."

inference_hz: 250

