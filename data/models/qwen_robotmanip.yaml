name: Qwen-RobotManip
full_name: "Qwen-RobotManip Technical Report: Alignment Unlocks Scale for Robotic Manipulation Foundation Models"
organization: "Qwen Team, Alibaba Inc."
date: "2026-06-18"
paper_url: https://arxiv.org/abs/2606.17846
code_url: https://github.com/QwenLM/Qwen-RobotManip
venue: null
open_source: true

architecture:
  backbone: "Qwen3.5-4B (vision-language)"
  llm: "Qwen3.5-4B"
  action_head: "Diffusion Transformer (DiT) flow-matching action expert (10 blocks, hidden=768, 12 heads)"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "~4B+"
  key_innovation: >
    Alignment-first VLA foundation model: (1) 80-D canonical cross-embodiment state-action representation
    with per-dimension binary masking, (2) camera-frame delta-pose action representation grounding actions
    in the visual domain via Camera Positional Encoding (CaPE) for cross-embodiment transfer, and (3)
    in-context policy adaptation using intra-episode execution history (observation-action chunks) as an
    implicit embodiment identifier. Dual-stream VLA + VL co-training preserves the VLM backbone's perception
    and reasoning. Decoupled Qwen-VL backbone + flow-matching DiT action expert with alternating
    vision/language cross-attention; trained with flow-matching loss on Beta(1, 1.5) timesteps and 4-step
    Euler integration at inference.

training:
  dataset: >
    ~38,100 hours of manipulation data: robot demonstrations (OXE, RoboMIND, DROID, RH20T,
    AgibotWorld-Beta, RoboCOIN, RDT-1B, InternData-A1, Galaxea Open-World ~11,420h), egocentric human
    videos (EgoDex, VITRA, EgoVerse ~1,933h), and human-to-robot synthesized data rendered across 15
    bimanual robot platforms (~24,808h). Five-stage signal curation (sudden change, trend alignment,
    extreme values, FK consistency, base/orientation alignment) plus three cross-modal checks
    (instruction consistency, video-state consistency, video quality). Co-trained with ~28M vision-language
    samples including embodied chain-of-thought (ECoT), egocentric video understanding, and 2D trajectory
    prediction.
  method: "Multi-source cross-embodiment pretraining with dual-stream VLA + VL co-training, flow-matching action head, in-context policy adaptation"

benchmarks:
