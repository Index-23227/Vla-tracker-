  parameters: "TODO: not stated in abstract"
  key_innovation: "Cross-paradigm post-training study for VLA models that brings Direct Preference Optimisation (DPO) to continuous-action flow-matching backbones via a surrogate flow-matching log-probability estimator (avoiding probability-flow ODE integration). Compares LoRA vs DoRA as the PEFT layer for VLA DPO and provides an inference-time anatomy showing the denoise loop dominates 78.6% of sample_actions latency, with prefix-K/V caching capped at ~21% acceleration."

