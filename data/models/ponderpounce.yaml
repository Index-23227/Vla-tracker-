# Paper: PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control
# arXiv: 2608.24115

name: PonderPounce
full_name: "PonderPounce: A Pretrained MLLM as an Episode Context Engine for Robot Control"
organization: "MAUM.AI, Seoul National University, Georgia Institute of Technology"
date: "2026-08-25"
paper_url: https://arxiv.org/abs/2608.24115
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "Asynchronous dual system. Ponder (System 2) = Qwen3.5-9B MLLM with append-only causal context over instruction, demonstrations and full execution history, emitting K=1 continuous cognition carrier; Pounce (System 1) = pi0.5 action model (3.6B, RoboMME / real robot) or GR00T N1.5 action model (3B, RoboCasa-DC) conditioned on newest cognition + its age"
  llm: "Qwen3.5-9B (Ponder); PaliGemma (inside pi0.5 Pounce)"
  action_head: "Flow-matching action head of pi0.5 / GR00T N1.5 with projected cognition + sinusoidal age-encoding prefix; 20-step (RoboMME) / 16-step (RoboCasa-DC) / 30-step (real) action chunks"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "Qwen3.5-9B Ponder + 3.6B pi0.5 Pounce (RoboMME) or 3B GR00T N1.5 Pounce (RoboCasa-DC)"
  key_innovation: "Reuses a pretrained MLLM's native causal context (KV-cached, 16K tokens) as episode memory instead of a purpose-built memory module; Ponder and Pounce run on independent clocks and are jointly trained end to end (action flow-matching + optional LM-head grounding of transitions, subgoal text and demonstration reasoning) without bridge pretraining; action gradients into Ponder scaled by 0.5."

training:
  method: "Joint end-to-end fine-tuning of Ponder and Pounce from pretrained checkpoints; L = w1 * L_fm + w2 * L_ground ((1, 0.1) on RoboMME, (1, 0) on RoboCasa-DC); SigLIP frozen, PaliGemma LM and action expert trainable; Ponder fully fine-tuned (no LoRA) on RoboCasa-DC"
  data: "RoboMME 1,587 episodes (base) or 14,400 episodes (9x); RoboCasa-DC 1,900 cross-embodiment demo-execution pairs; 710 teleoperated ALOHA episodes (real)"

