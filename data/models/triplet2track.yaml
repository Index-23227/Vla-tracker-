# Paper: Triplet2Track: A Hierarchical System with Object-Centric Representations for Reliable Long-Horizon Manipulation
# arXiv: 2608.22800

name: Triplet2Track
full_name: "Triplet2Track: A Hierarchical System with Object-Centric Representations for Reliable Long-Horizon Manipulation"
organization: "Shanghai Jiao Tong University; University of Sussex"
date: "2026-08-24"
paper_url: https://arxiv.org/abs/2608.22800
code_url: null
venue: null
open_source: false
model_type: hierarchical
inference_hz: 15

architecture:
  backbone: "Grounding-DINO + SAM2 instance perception; ATM-style multimodal masked track predictor; Transformer action policy"
  llm: "InternVL2.5 (LoRA-tuned relation verifier) + zero-shot GPT-4o next-triplet generator"
  action_head: >
    Three-layer Triplet-to-Track System (TTS). Task Planner: a lightweight 4-layer Transformer
    relation predictor (LTP) over SAM2 instance tokens plus an event-triggered LoRA-tuned InternVL2.5
    verifier extract instance-grounded (subject, relation, object) triplets; a zero-shot VLM picks the
    next triplet restricted by a temporal graph mined from human videos. Track Predictor: triplet-
    transition-conditioned masked track prediction (pretrained on action-free human videos) produces
    entity-aligned point tracks. Action Policy: Transformer backbone with a learnable action token,
    fused with the track prior and decoded by an MLP action head trained with L2 action regression
    (7-D end-effector pose + gripper width).
  action_head_category: regression
  action_space: "7-D end-effector pose + scalar gripper width"
  parameters: "Not stated"
  key_innovation: >
    Instance-grounded, visually verifiable triplets as the planning-control interface, compiled into
    continuous point-track priors for a track-guided BC policy; temporal-graph masking of VLM
    proposals to suppress planning hallucination; closed-loop guard checking and replanning.

training:
  data: "Per task: 30 robot demonstrations + 50 human demonstrations; 5 annotated sequences per task for relation predictor / VLM"
  compute: "2x NVIDIA A100"

