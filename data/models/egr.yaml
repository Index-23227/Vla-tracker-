# Paper: Sensing Which Modality Matters: Evidence-Gated Regularization for Robust VLA Policies
# arXiv: 2609.03142

name: EGR
full_name: "Sensing Which Modality Matters: Evidence-Gated Regularization for Robust VLA Policies"
organization: "University of North Carolina at Chapel Hill / Mitsubishi Electric Research Laboratories (MERL)"
date: "2026-09-02"
paper_url: https://arxiv.org/abs/2609.03142
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (PaliGemma 2B VLM + 300M Gemma action expert), architecture unchanged"
  action_head: "pi0.5 flow-matching action expert (unchanged; action horizon 32)"
  action_head_category: flow_matching
  parameters: "~2.3B (pi0.5); only LoRA adapters trained"
  key_innovation: "Evidence-Gated Regularization: a per-frame, per-sensor task-relevance evidence score E_{t,m} (camera = visible focal/interaction-object area from segmentation; tactile = contact indicator or task-feature similarity) gates two consistency losses on the flow-matching velocity: invariance to corruption of low-evidence sensors (L_inv, hinge below tau_low=0.2) and single-sensor sufficiency for high-evidence sensors (L_suff, hinge above tau_high=0.5). L = L_flow + 0.2*L_inv + 0.1*L_suff, with an unbiased importance-sampled estimator (2 extra forward passes per step). Training-only, zero inference overhead."

training:
  base_model: "pi0.5 checkpoint from OpenPI Comet (BEHAVIOR Challenge 2025 2nd place), pre-trained on 12 BEHAVIOR-1K tasks"
  method: "LoRA fine-tuning (gemma_2b_lora + gemma_300m_lora) with flow-matching loss plus evidence-gated invariance and sufficiency losses; random-erasing corruption operator during training"
  data: "BEHAVIOR-1K demonstrations (11 usable challenge tasks); real-robot demos on bi-manual Kinova and MELFA ASSISTA + GelSight platforms"
  hardware: "2x NVIDIA B200 (FSDP), batch 288, 50k steps, peak LR 2.5e-5"

benchmarks:
  behavior1k_man_full:
    sr: 16.39
    ec: 50.00
    ee_min_dist_m: 0.257
    source: "Paper Table 2 / Table 11, EGR row, MAN Full"
    date_reported: "2026-09-02"
    eval_condition: "BEHAVIOR-1K modality-entanglement benchmark, 36 MAN segments x 20 rollouts, all sensors clean"

  behavior1k_man_nouseless:
