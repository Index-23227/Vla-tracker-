    ec: 53.89
    ee_min_dist_m: 0.246
    source: "Paper Table 2 / Table 11, EGR row, MAN NoUseless"
    eval_condition: "36 MAN segments x 20 rollouts, useless wrist camera corrupted (center erasure)"

  behavior1k_man_usefulonly:
    sr: 6.11
    ec: 30.14
    ee_min_dist_m: 0.366
    source: "Paper Table 2 / Table 11, EGR row, MAN UsefulOnly"
