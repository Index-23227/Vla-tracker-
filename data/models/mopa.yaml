# Paper: MoPA: Coordinated Mobile Manipulation via Subsystem-Specific Perception Alignment
# arXiv: 2609.12081

name: MoPA
full_name: "MoPA: Coordinated Mobile Manipulation via Subsystem-Specific Perception Alignment"
organization: "THU / Xspark AI / HKUST (GZ) / HKU"
date: "2026-09-14"
paper_url: https://arxiv.org/abs/2609.12081
code_url: "https://MoPA-policy.github.io"
venue: arXiv
model_type: vla

architecture:
  backbone: "Qwen3-VL (model size not stated in the paper) encoding head- and wrist-camera RGB + language; two mutually masked learned query banks (Manip Query, Mobile Query; 8 queries per bank) appended to the VLM token sequence"
  action_head: "Joint action head: structured Mixture-of-Transformers decoder with separate Manipulation and Mobility expert streams; each query bank attends only to its matched action stream while the two action streams exchange information every layer; coupled conditional flow matching jointly generates both action chunks (4 Euler steps)"
  action_head_category: flow_matching
  parameters: "Not stated in the paper"
  key_innovation: "Dual Perceptual Streams (subsystem-specific perception extracted from a shared vision-language context via isolated query banks) + Perception2Action Adaptation (query states updated jointly with their matched action tokens in every MoT layer) + coupled, branch-normalized conditional flow matching for synchronous base/arm action generation"

training:
  base_model: "Qwen3-VL"
  method: "End-to-end training of VLM backbone, query banks and joint action head with branch-normalized coupled flow matching; AdamW, cosine decay, batch 64, 100k steps (simulation) / 50k steps (real, single multi-task policy)"
  data: "ManiSkill-HAB: 1,000 successful demonstrations per skill, one policy per suite; real world: 200 demonstrations per task (4 tasks)"
  hardware: "Not stated in the paper"

benchmarks:
  maniskill_hab_settable:
    pick_apple: 84.3
    pick_bowl: 89.0
    place_apple: 72.7
    place_bowl: 83.7
    open_fridge: 98.3
    open_drawer: 94.0
    close_drawer: 96.3
    mean: 88.3
    source: "Paper Table I, MoPA (Ours) row"
    date_reported: "2026-09-14"
    eval_condition: "ManiSkill-HAB SetTable, Fetch mobile manipulator, head+wrist RGB; 3 runs x 100 held-out episodes per skill, max 200 steps; mean = macro-average of 7 skill success rates; H=4 chunk, 11-D whole-body action"

  maniskill_hab_tidyhouse:
    pick: 73.9
    place: 70.4
    mean: 72.2
    source: "Paper Table II, MoPA (Ours) row"
    date_reported: "2026-09-14"
