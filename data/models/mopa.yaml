    date_reported: "2026-09-14"
    eval_condition: "HexFellow Trigger-A3 omnidirectional base + IOTA lift + two AgileX PiPER-X arms, 3 RGB-D cameras; single multi-task policy, 200 demos per task, 20 trials per task, full-task success; 17-D whole-body action. Paper states avg exceeds strongest baseline pi0.5 by 12.5 points; baseline per-task values are shown only in the figure"

