# Paper: Continuous Actions from Discrete Minds: Latent-Aligned Planning for End-to-End Autonomous Driving
# arXiv: 2609.04070

name: LaPla
full_name: "Continuous Actions from Discrete Minds: Latent-Aligned Planning for End-to-End Autonomous Driving"
organization: "The Hong Kong University of Science and Technology (Guangzhou) / Huawei Central Media Technology Institute"
date: "2026-09-03"
paper_url: https://arxiv.org/abs/2609.04070
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "Emu3-8B causal transformer (LoRA-adapted), Emu3 visual tokenizer for 4 camera views (front, front-left, front-right, back)"
  llm: "Emu3-8B"
  action_head: "Learnable action queries processed in one forward pass; shared MLP projects hidden states into the continuous latent space of a frozen pretrained residual VQ-VAE (4 layers, codebooks {64,64,128,128}); frozen decoder outputs displacement/heading, cumulatively summed into waypoints; supervised by Smooth-L1 (Best-of-N with learned perturbation bases)"
  action_head_category: regression
  parameters: "~8B (Emu3-8B) + LoRA adapters, projection heads, frozen RVQ-VAE"
  key_innovation: "Latent-aligned planning: instead of discrete action-token lookup (quantization error) or diffusion heads (latency), the VLA regresses continuous latents directly into the input space of a frozen, kinematically pretrained residual VQ-VAE decoder, which acts as a kinematic gradient preconditioner. Asymmetric action representation: history actions are quantized via the frozen RVQ encoder, future actions predicted as continuous latents. Auxiliary multi-round VQA loss."

training:
  method: "Stage 1: pretrain residual VQ-VAE on trajectory data (reconstruction + commitment, EMA codebooks), then freeze. Stage 2: LoRA fine-tuning of Emu3 with L = L_plan (Best-of-N Smooth-L1) + lambda * L_vqa; trainable = LoRA, action queries, history projector, perturbation bases/scales, future latent projection head"
  data: "nuScenes (~30K frames, split following AutoVLA) with OmniDrive VQA annotations; 20K AlpaSim frames for additional closed-loop fine-tuning"
  hardware: "Huawei Ascend 910B3 NPUs (training); 4x RTX 4090 for AlpaSim"

