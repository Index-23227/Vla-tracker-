eval_conditions:
  libero: "Evaluated on LIBERO-Plus (harder variant emphasizing OOD generalization), NOT the original LIBERO suite. Standard LIBERO numbers not reported."
  real_world: "Cross-platform evaluation on ALOHA AgileX (Platform A) and PSI-Bot RealMan RM63 (Platform B); in-domain 75.8% vs 55.8% baseline; scene generalization 67.5% vs 44.2%; lighting generalization 79.2% vs 57.5%"
  ablation: "Per-suite head dominance: object head best on Object/Long, skill head best on Goal, depth head best on Spatial — complementary specialization."

