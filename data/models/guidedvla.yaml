# Paper: GuidedVLA: Specifying Task-Relevant Factors via Plug-and-Play Action Attention Specialization
# arXiv: 2605.12369

name: GuidedVLA
full_name: "GuidedVLA: Specifying Task-Relevant Factors via Plug-and-Play Action Attention Specialization"
organization: "Institute of Trustworthy Embodied AI (TEAI), Fudan University / Shanghai Key Laboratory of Multimodal Embodied AI / Shanghai Jiao Tong University / OpenDriveLab, The University of Hong Kong"
date: "2026-05-12"
paper_url: https://arxiv.org/abs/2605.12369
code_url: https://guidedvla.github.io/project_page/
venue: "RSS 2026"
open_source: false

architecture:
  action_head: "pi0 flow-matching action expert with ControlNet-style residual adapter (zero-initialized projection) that injects factor-specific biases over a frozen pretrained backbone, then assigns specific attention heads to three task-relevant factors: object grounding (Object Head), 3D geometry (Depth Head), and temporal skill logic (Skill Head)."
  action_head_category: flow_matching
  parameters: "Built on pi0 backbone (~3B params); GuidedVLA adapter adds attention specialization without changing total scale"
  backbone: "pi0 (SigLIP vision encoder + flow-matching action expert)"
  key_innovation: "Treats the action decoder as an assembly of functional components rather than a monolithic learner, and explicitly supervises individual attention heads with auxiliary signals to capture distinct task-relevant factors. Object head: supervised by Grounded-SAM masks via negative log object-mass loss to concentrate attention on target objects. Skill head: supervised by KL divergence against soft temporal sub-skill labels (task class + null/background). Depth head: constrained to attend only to keys/values from a frozen DepthAnything-v3 (DA3) depth encoder for implicit geometric awareness. Annotation pipeline is ~92% automatic (4 min vs 43.5 min manual per 50 episodes). Plug-and-play: zero-init ControlNet-style residual preserves pretrained behavior."

