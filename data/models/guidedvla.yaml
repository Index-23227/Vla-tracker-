  key_innovation: "GuidedVLA treats the action decoder as an assembly of functional components rather than a monolithic learner, and supervises individual attention heads with manually defined auxiliary signals to capture distinct task-relevant factors. The initial instantiation uses three specialized heads for object grounding, spatial geometry, and temporal skill logic, yielding decoupled high-quality features. This explicit guidance mitigates overfitting to spurious correlations (visual shortcuts, environmental noise) and improves in-domain and out-of-domain generalization."

