# Paper: UniMPA: A Unified Memory-Prediction-Action Model via Action-Grounded Transition Modeling
# arXiv: 2609.11875

name: UniMPA
full_name: "UniMPA: A Unified Memory-Prediction-Action Model via Action-Grounded Transition Modeling"
organization: "Harbin Institute of Technology (Shenzhen) / Nanyang Technological University (S-Lab)"
date: "2026-09-10"
paper_url: https://arxiv.org/abs/2609.11875
code_url: "https://JiuTian-VL.github.io/UniMPA-page/"
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (PaliGemma-2B VLM + 311M Gemma action expert) extended with an 18-layer World Expert (hidden 1024, 16 zero-initialized transition queries) into a three-stream transformer"
  llm: "PaliGemma-2B"
  action_head: "Flow-matching action expert (10 Euler steps) whose Gaussian source is shifted by a retrieved action prototype (Prototype-Biased Flow), conditioned on World-Expert transition tokens"
  action_head_category: flow_matching
  parameters: "~2B VLM + 311M action expert + World Expert + memory encoders"
  key_innovation: "Anticipate-ground-refine process on an action-grounded transition interface: (1) Persistent-Selective Future Prediction (persistent V-JEPA 2 latent targets + Trigger-Gated pixel decoding) shapes World-Expert transition tokens; (2) bidirectional Visual-Action / Action-Visual Memory Banks (stateful Mamba temporal values, retrieval-simulation pretraining, coarse-to-fine temporal retrieval); (3) Prototype-Biased Flow shifts the flow source toward the retrieved action manifold."

training:
  base_model: "pi0.5"
  method: "Stage 1: memory-bank pretraining (future reconstruction + retrieval simulation + cross-modal pairing, 10 epochs). Stage 2: memory frozen, policy fine-tuned with L_act + lambda_lat L_lat + lambda_pix L_pix (AdamW lr 5e-5, 20-30k steps) using 25-50% of pi0.5 training epochs"
  data: "LIBERO, RoboTwin 2.0 (clean), VLABench, real-world demos on GALAXEA R1 Lite and AgileX Cobot Magic (50-100 episodes per task)"
  hardware: "4-16 NVIDIA Pro6000 GPUs"

