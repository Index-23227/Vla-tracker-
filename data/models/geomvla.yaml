# Paper: GeomVLA: Unifying Scene, Motion, and Action in 3D
# arXiv: 2609.13812

name: GeomVLA
full_name: "GeomVLA: Unifying Scene, Motion, and Action in 3D"
organization: "Carnegie Mellon University / NVIDIA"
date: "2026-09-15"  # arXiv stamp on the PDF (2609.13812v2, 15 Sep 2026); v1 date not stated in the paper
paper_url: https://arxiv.org/abs/2609.13812
code_url: null  # code release not stated in the paper; project page: ziyin-xiong.github.io/geomvla.io
venue: "Not stated in the paper"
open_source: false  # weights/code release not stated in the paper
model_type: vla

architecture:
  backbone: "Florence-2 VLM (public initialization) encoding multi-view RGB + language; patch tokens lifted to 3D robot-base-frame positions via depth and camera calibration"
  llm: "Florence-2 (encoder-decoder VLM)"
  action_head: "3D Action Denoiser: geometry-aware transformer (3D RoPE) over spatial action tokens, rectified-flow velocities for end-effector translation/rotation + BCE gripper-open head; optional Joint Angle Denoiser (GeomVLA-JA) with the same rectified-flow objective"
  action_head_category: flow_matching
  parameters: "1.2B (GeomVLA); 1.3B (GeomVLA-JA)"
  key_innovation: "3D Scene Trajectory Denoiser (flow-matching decoder over a 20x20 grid of 3D anchors, 15 future steps) trained on SpatialTrackerV2 pseudo-labels; one velocity-field evaluation at the initial noise state gives intermediate motion tokens that are fused into 3D scene tokens by geometry-aware cross-attention (zero-initialized residual) before action denoising, so scene, future motion and actions share one metric robot-centric 3D frame"

training:
  base_model: "Florence-2 (no robot-action pretraining)"
  method: "Stage 1: train 3D Scene Trajectory Denoiser on SpatialTrackerV2 point-track pseudo-labels with VLM frozen. Stage 2: jointly fine-tune action denoiser, trajectory denoiser and VLM using only the action loss"
  data: "Benchmark demonstrations only (CALVIN, LIBERO, RoboTwin2.0: 50 clean + 500 randomized demos per task, 27,500 total); real world: 50 or 20 teleop demos per task on ALOHA2"
  hardware: "Stage-2 training ~15 h on 4x L40S (CALVIN), ~25 h on 8x A100-40GB (LIBERO), ~48 h on 8x A100-40GB (RoboTwin2.0 five-task ablation)"

benchmarks:
  calvin:
    calvin_abc_d_avg_len: 4.624
    source: "Paper Table 1, GeomVLA row (CALVIN ABC->D)"
    date_reported: "2026-09-15"
    eval_condition: "CALVIN ABC->D, mean number of consecutive completed tasks in 5-instruction chains; trained on benchmark demos only"

  libero:
    libero_spatial: 98.6
    libero_object: 99.8
    libero_goal: 97.6
    libero_long: 97.6
    libero_avg: 98.4
    source: "Paper Table 1, GeomVLA row"
    date_reported: "2026-09-15"
    eval_condition: "Standard four LIBERO suites; no robot-action pretraining"

  robotwin_v2:
    robotwin_v2_easy: 78.6
    robotwin_v2_hard: 76.2
    source: "Paper Appendix Table 5 (50 RoboTwin2.0 tasks, average row)"
    date_reported: "2026-09-15"
    eval_condition: "One multi-task policy on all 50 RoboTwin2.0 tasks, official Easy/Hard protocol, 50 rollouts per setting; paper reports no combined Easy/Hard average"

  robotwin_v2_baseline_pi05_50task:
    pi05_easy: 75.9
    pi05_hard: 75.7
    source: "Paper Appendix Table 5"
    eval_condition: "baseline: pi0.5 fully fine-tuned from public base checkpoint on the same 50-task data"

