    source: "Paper Section IV-D text"
    eval_condition: "RTX 4090, server-side policy sampling over first 15 replans of matched successful LIBERO-Long rollouts"

training:
  datasets: ["LIBERO (4 suites)", "RoboTwin 2.0 (12 tasks, 50 clean + 500 randomized demos each)", "AgiBot A3 real-robot demos (280 per task)"]
  method: "Fine-tune pi0.5 with an added temporal module; L = L_action (flow matching) + 1.0 * L_temp (masked Huber on robot-surface flow for t-8 and t-15 intervals). 8x H100, per-GPU batch 32; ~20% extra training wall-clock vs baseline."

eval_conditions:
  libero: "fine-tuned, mean over 3 seeds"
  robotwin_v2_12tasks: "12-task subset of RoboTwin 2.0, Clean and Randomized"
  real_world: "AgiBot A3, two three-stage tasks, 45 trials each"

