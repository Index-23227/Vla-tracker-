name: TemporalFlow-VLA
full_name: "TemporalFlow-VLA: Learning Physically Grounded Execution History for Long-Horizon Robot Manipulation"
organization: "HKUST (Guangzhou); Zhejiang University; Simon Fraser University; AgiBot"
date: "2026-08-27"
paper_url: https://arxiv.org/abs/2608.26821
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "pi0.5 (VLM prefix + action expert) with a parallel temporal pathway over head-camera frames at t-15, t-8, t"
  action_head: "pi0.5 flow-matching action expert (16-step chunks); historical information enters only through two flow-supervised temporal query tokens Q8 and Q15 via joint masked self-attention (action tokens cannot see historical patches)"
  action_head_category: flow_matching
  parameters: "pi0.5 scale (not stated) + temporal queries, frame-identity embeddings and two training-only FiLM+MLP flow decoders"
  key_innovation: "Kinematics-grounded robot-surface temporal flow: recorded joint states, URDF geometry and camera calibration render a dense 16x16x2 robot-surface flow target (offline, training only) that supervises two hierarchical, chunk-aligned temporal queries (Q8 recent half-chunk, Q15 full previous chunk, Q8 -> Q15). Loss = L_action + 1.0 * L_temp (masked Huber). No flow estimation or geometry at deployment; asynchronous historical-feature cache keeps latency at single-frame level."

