# Paper: Geo-VLA: Geometry-Aware Vision-Language-Action Planning via Internalization of Map Semantics
# arXiv: 2608.21440

name: Geo-VLA
full_name: "Geo-VLA: Geometry-Aware Vision-Language-Action Planning via Internalization of Map Semantics"
organization: "University of Science and Technology Beijing"
date: "2026-08-18"
paper_url: https://arxiv.org/abs/2608.21440
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "Vision-language backbone of the host VLA planner (DynVLA or ReCogDrive), adapted with rank-16 LoRA adapters in the vision encoder and LLM during geometry-aware pretraining; single front-view camera input"
  action_head: "Host planner's original action decoder, kept unchanged in design and re-fine-tuned on NAVSIM navtrain with the planner's original imitation objective on top of the frozen geometry-adapted backbone (headline result uses the DynVLA decoder)"
  action_head_category: other
  action_space: continuous
  key_innovation: "Plug-and-play training framework that internalizes map semantics into the VLA backbone: Geo-QA (3,000 GPT-5.4-generated QA pairs from NAVSIM front-view frames + offline map annotations; 5 categories: lane structure, road geometry, intersection structure, drivable boundary, road topology) supervises the backbone via symmetric image-text InfoNCE + QA instruction tuning. No HD map, map text or map encoder at inference; static road-structure QA beats equal-scale dynamic-object QA."

training:
  dataset: "Geo-QA (3,000 samples) for backbone pretraining; NAVSIM v1 navtrain for planning fine-tuning"
  method: "Stage 1: geometry-aware pretraining (L_con + lambda * L_qa) optimizing LoRA adapters and projection heads with the action decoder fixed; Stage 2: planning fine-tuning of only the action decoder with the adapted backbone frozen, following each baseline's original protocol"

