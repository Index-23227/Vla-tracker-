# Paper: CASD: Chunk-Aligned Semantic Distillation for Multi-Stage Robot Manipulation
# arXiv: 2609.08638

name: CASD
full_name: "CASD: Chunk-Aligned Semantic Distillation for Multi-Stage Robot Manipulation"
organization: "Ant Group"
date: "2026-09-08"
paper_url: https://arxiv.org/abs/2609.08638
code_url: null
venue: arXiv
open_source: false
model_type: world_action_model

architecture:
  backbone: "Fast-WAM (Wan2.2-TI2V-5B video-action world action model; Uncond / Joint / IDM variants); cross-backbone integration into DreamZero (Wan2.1-I2V-14B)"
  action_head: "Fast-WAM action expert trained with action flow matching (unchanged objective L_dyn + L_act), conditioned on 4 predicted CASD semantic tokens through zero-initialized rank-192 cross-attention adapters in every video and action block"
  action_head_category: flow_matching
  parameters: "~5B (Wan2.2-TI2V-5B based Fast-WAM) + small CASD generator (hidden width 128) + rank-192 adapters"
  key_innovation: "Chunk-aligned semantic teacher: an offline VLM (GPT-5.4) segments demonstrations into free-form stages; each stage's UMT5 slot embeddings are mixed by their occupancy within the H=32 future action chunk (including boundary-crossing chunks) and randomly projected to 4x128 tokens. A CASD generator is distilled (Stage A, direct regression + hardest-negative ranking) to predict this target from current frame, robot state and instruction, then frozen and used to condition the WAM policy during Stage-B training and deployment - no online VLM calls or reasoning-trace decoding."

training:
  base_model: "Fast-WAM (Uncond / Joint / IDM); DreamZero for MolmoSpaces"
  method: "Stage A: train CASD generator only (10k steps, batch 128, lr 1e-4, cosine) against fixed occupancy-weighted teacher; Stage B: freeze generator, train WAM policy + adapters with original video-dynamics + action flow-matching losses"
  data: "LIBERO training demonstrations (1,712 annotated episodes, 9,507 phase-start queries); RoboTwin 2.0; DROID for DreamZero integration"

