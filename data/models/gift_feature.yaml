training:
  datasets: ["LIBERO (4 suites)", "RoboCasa GR1 Tabletop (24 tasks, 1,000 demos/task)", "Real-world: 400 teleoperated demos (4 tasks x 100) on xArm7 and ARX X5"]
  method: "Benchmark-specific post-training (no extra pre-training) with L_native + 1.0*L_geo + 0.5*L_aff + 1.0*L_goal. Geometry targets from frozen VGGT, affordance targets from simulator poses (real: Grounding DINO + SAM2 + Orient Anything V2), goal masks from simulator segmentation. WAM variants: AdamW lr 1e-4, 64 GPUs; GIFT-VLA: 32 GPUs, 60k steps."

eval_conditions:
  libero: "trained on LIBERO; LIBERO-Plus zero-shot"
  robocasa: "fine-tuned (GR1 Tabletop 24 tasks)"
  real_world: "xArm7 + ARX X5, 10 trials/task"

