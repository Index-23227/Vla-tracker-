name: GIFT-Feature
full_name: "GIFT: Guided Intermediate Feature Training via Action-Oriented Structural Supervision for Robotic Manipulation"
organization: "Institute of Automation, Chinese Academy of Sciences; University of Chinese Academy of Sciences; Tsinghua University; Fudan University; National University of Singapore"
date: "2026-09-03"
paper_url: https://arxiv.org/abs/2609.04193
code_url: https://openphoenix-team.github.io/GIFT-pages
venue: null
open_source: false
model_type: vla

architecture:
  backbone: "Headline entry = GIFT-WAM-IDM: Fast-WAM-IDM world-action model (pretrained video diffusion transformer + action diffusion transformer, Mixture-of-Transformers). Paper also instantiates GIFT-VLA (StarVLA-OFT, Qwen3-VL-4B-Instruct) and GIFT-WAM-Fast (Fast-WAM)."
  llm: "None for the headline WAM variant (GIFT-VLA variant uses Qwen3-VL-4B-Instruct)"
  action_head: "Inverse-dynamics action diffusion expert: first denoises a future visual trajectory (2 steps), then denoises a 32-step action chunk (2 steps) with frozen future-video features as key-value context; trained with flow matching"
  action_head_category: flow_matching
  parameters: "6B (GIFT-WAM-IDM / GIFT-WAM-Fast); 4B (GIFT-VLA)"
  key_innovation: "Training-time structured supervision of intermediate visual tokens with three complementary objectives: geometry alignment to a frozen VGGT teacher (angular + log-scale loss on shallow layer 6), object-centric 20-D affordance prediction (entity role, anchor-relative object pose, object-relative end-effector pose, closure), and instruction-conditioned goal-region mask reconstruction (BCE + Dice). Default no-injection design: auxiliary predictions are not fed to the action generator; teacher and heads are dropped at inference."

