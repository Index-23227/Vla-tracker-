training:
  base_model: "pi0.5 (also SmolVLA, LingBot-VLA)"
  method: "Multi-buffer joint fine-tuning: all N buffer configurations for one observation packed into a single sample with attention masks isolating buffers; standard flow-matching loss summed over configurations"
  hardware: "8x NVIDIA H200"
  libero_schedule: "LR 1e-4 cosine, 1K warm-up, 50K steps, per-GPU batch 32"
  robotwin_schedule: "LR 5e-5 cosine, global batch 256, 100K steps"

eval_conditions:
  libero: "fine-tuned, 4 suites, LeRobot evaluation script, replan every 5 actions, averaged over 5 runs"
  robotwin_v2: "50-task multitask, clean and randomized, 16-action execution horizon"
  real_world: "Franka, 3 tasks x 15 trials, 3-point rubric"

tags: [flow-matching, streaming-decoding, asynchronous-inference, efficient-inference, diffusion-forcing, pi0_5, libero, robotwin, real-world, fine-tuned]
