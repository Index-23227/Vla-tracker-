# Paper: FlashVLA: Streaming Action Decoding for Fast and Asynchronous VLA Inference
# arXiv: 2608.27384
# NOTE: distinct from Realtime-VLA-FLASH (arXiv 2605.13778, speculative inference) already in data/models.

name: FlashVLA
full_name: "FlashVLA: Streaming Action Decoding for Fast and Asynchronous VLA Inference"
organization: "UC San Diego; MIT"
date: "2026-08-27"
paper_url: https://arxiv.org/abs/2608.27384
code_url: https://github.com/z-lab/flashvla
venue: arXiv
open_source: true

architecture:
  backbone: "pi0.5 (PaliGemma VLM + flow-matching action expert); also applied to SmolVLA and LingBot-VLA (4B)"
  llm: "PaliGemma (pi0.5 backbone)"
  action_head: "streaming flow-matching action expert: buffer of N action chunks at staggered noise levels denoised jointly under chunk-wise causal attention (noisier chunks attend to cleaner ones); FiLM multi-level timestep conditioning; one executable chunk emitted per forward pass"
  action_head_category: flow_matching
  parameters: "pi0.5 weights (no extra parameters stated for pi0.5; lightweight time-MLP + FiLM added only for SmolVLA)"
  key_innovation: "Transfers streaming chunk-wise diffusion (diffusion forcing style) from long-video generation to VLA action decoding. Each forward pass advances every chunk in the buffer by one denoising step, amortizing the 10-step flow-matching loop across time (up to 20x lower per-step action-decoding latency), and chunk-wise causal attention gives future chunks implicit conditioning on the trajectory in flight, recovering asynchronous continuity without a future-state predictor. Pretrained VLAs are adapted by multi-buffer joint fine-tuning that packs all N cold-start buffer configurations into one sample with isolating attention masks."

