  bench2drive_results: "CLEAR (InternVL3-1B): DS 86.8, SR 69.5%, Efficiency 275.4, Comfort 25.7; Multi-Ability mean 69.8% (Merging 57.5, Overtaking 66.7, E-Brake 85.0, Give Way 70.0, T.Sign 69.8) vs SimLingo DS 85.1 / SR 67.3%"
