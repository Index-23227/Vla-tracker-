architecture:
  backbone: "InternVL3-1B (InternViT-300M-448px vision encoder), SimLingo-style driving VLA; also an InternVL2-1B variant"
  llm: "Qwen2.5-0.5B (inside InternVL3-1B); LoRA fine-tuned during pretraining, frozen during RL"
  action_head: "MLP waypoint decoders (path + speed waypoints) from action queries; RL stage adds a residual waypoint policy head: MLP over [driving feature, base waypoint plan] samples clipped residual lateral offsets at m=4 longitudinal anchors plus a speed residual, converted to low-level CARLA control by a deterministic controller"
  action_head_category: regression
  action_space: continuous
  parameters: "1B"
  key_innovation: >-
    System for closed-loop RL finetuning of VLA driving policies at scale.
    (1) Residual waypoint policy: instead of direct low-level control, PPO
    learns bounded residual corrections around the waypoint prior of an
    IL-pretrained VLA, preserving pretrained knowledge (waypoint space beats
    direct control 39.89 vs 33.91 DS). (2) Heterogeneous pipeline: CARLA
    simulators run on 32 V100 GPUs (2 per GPU, 64 parallel envs) while the
    VLA learner sits on 8 H100s, connected via autossh tunnels, resolving
    resource contention and enabling scaling to 100M samples with DD-PPO
    (total/mini-batch 16384/4096). Sets SotA on CARLA longest6 v2
    (DS 39.89, SR 25%, vs 0% SR for all IL baselines) and Bench2Drive
    (DS 86.8, SR 69.5%).
training:
  dataset: "SimLingo-curated CARLA expert dataset, ~3.1M samples at 4 fps (open-loop IL pretraining); procedurally generated CARLA routes from CaRL for closed-loop RL"
  method: "Stage 1: open-loop IL pretraining (smooth L1 on path/speed waypoints + VQA language supervision), 14 epochs on 8x H100, global batch 96, AdamW lr 3e-5 cosine, LoRA on LLM. Stage 2: closed-loop PPO (DD-PPO) on residual waypoint policy with vision encoder and LLM frozen, language head disabled; reward = discounted route completion with soft/hard infraction penalties (from CaRL); 100M samples, total-batch/mini-batch 16384/4096, ~6 days"
  algorithm: "PPO (DD-PPO)"
  hardware: "8x NVIDIA H100 (learner) + 32x Tesla V100 32GB (64 parallel CARLA servers)"
