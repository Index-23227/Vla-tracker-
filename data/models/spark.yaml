paper_url: https://arxiv.org/abs/2606.30613
code_url: null
venue: null
open_source: true
model_type: neurosymbolic-agent

architecture:
  backbone: "Training-free modular pipeline: SAM3 open-vocabulary detection/segmentation (perception) + Gemini planner (Gemini 3.1 Pro in simulation, Gemini 3.5 Flash on hardware, temperature 0.3) + Pyroki constrained IK / Robosuite OSC controller (execution)"
  llm: "Gemini 3.1 Pro (simulation) / Gemini 3.5 Flash (physical), single BT-generation call per trial"
  action_head: "No learned action head: one Gemini call emits a typed YAML behavior tree over a grammar of 5 base primitives (move_to_keypoint, move_relative, grasp, release, wait) composing into 30+ typed skills; keypoint labels resolve to live SAM3 3D detections at execution time, and an IK/OSC controller executes each primitive under boolean post-condition checks"
  action_head_category: other
  action_space: continuous
  parameters: "training-free (no trained parameters; off-the-shelf SAM3 checkpoint + Gemini API)"
  key_innovation: >-
    Training-free neurosymbolic manipulation that reallocates test-time compute
    from plan regeneration to perception. A single Gemini call commits a typed
    behavior tree whose spatial arguments are keypoint LABELS resolved against
    live SAM3 detections at act time, so position/language perturbations change
    only perception, not the plan. Adaptive perception self-consistency (a
    second Gemini call proposes 3 alternative SAM3 text prompts per object;
    the most confidently detected prompt is kept) adds +27.7 points on the
    LIBERO-PRO spatial suite and +10.0 on the object suite. A 3-tier recovery
    layer (wiggle/grasp-perturb, retract + re-detect + retry same plan, replan)
    handles failures with no new LLM call in tiers 1-2 (+~5 points). Reaches
    43.7% on six LIBERO-PRO position-and-task cells (vs CaP-Agent0 18.2%,
    MolmoAct2 18.6%, pi0.5 12.8%; matching RATS 43.8% without its offline play
    phase) at ~$0.048/trial (~20x cheaper than CaP-Agent0), and runs unchanged
    on three robot families. Every trial logs a labeled BT trace usable as
    teleoperation-free training data.

training:
  dataset: "None (training-free; no demonstrations, no fine-tuning). Successful BTs are passively cached as optional in-context examples"
  method: "No training. Per-trial LLM calls only: 2 Gemini calls in simulation (prompt synthesis + BT generation), 1 on hardware"
  hardware: "n/a (inference: Gemini API + public SAM3 checkpoint)"

