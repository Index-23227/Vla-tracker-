# Paper: FIRE-VLA: Failure-Informed Self-Evolution for Vision-Language-Action Models in Autonomous Driving
# arXiv: 2608.13395

name: FIRE-VLA
full_name: "FIRE-VLA: Failure-Informed Self-Evolution for Vision-Language-Action Models in Autonomous Driving"
organization: "Harbin Institute of Technology"
date: "2026-08-13"
paper_url: https://arxiv.org/abs/2608.13395
code_url: https://github.com/forever-free1/FIRE-VLA
open_source: true
model_type: vla

architecture:
  backbone: "Qwen2.5-VL-3B-Instruct vision encoder (front-view camera image, at most 196,608 pixels; vision tower trainable)"
  llm: "Qwen2.5-VL-3B-Instruct"
  action_head: "Autoregressive text decoding: given the front-view image and an ego-history description, the policy emits reasoning followed by six ego-frame BEV waypoints at 0.5 s intervals inside an <answer> span (384-token response limit)"
  action_head_category: autoregressive
  parameters: "3B"
  key_innovation: "Failure-informed self-evolution for RL post-training. GRPO stays active for every rollout group, but groups that are simultaneously low-reward and low-diversity (reward mean and population std both at or below the batch 30th percentile, with valid fraction >= 0.5) are flagged as 'unresolved failure groups' and additionally routed to privileged self-distillation (PSD). The PSD teacher is a frozen copy of the same round-start policy with identical parameter scale; its only advantage is that its context contains the hidden ground-truth future trajectory inside <priv> tags. Both branches condition on the same student-generated on-policy prefix, and supervision is applied only to trajectory-answer tokens via a capped Jensen-Shannon divergence over the teacher's top-16 tokens plus one residual-tail bucket (beta = 0.5, per-token cap 0.05), with gradients flowing only through the student. The total actor loss is L = L_GRPO + 0.1 * L_PSD. At each round boundary the updated student is promoted to initialize both the student and the frozen teacher of the next round, so the unresolved-failure distribution that determines where privileged supervision lands co-evolves with the policy without any larger external teacher."

training:
  method: "Common SFT checkpoint -> RL post-training. FIRE-VLA runs K=2 evolution rounds of 75 policy updates each (GRPO for all groups + routed PSD); the standard-GRPO control runs 150 continuous updates from the same SFT checkpoint."
  dataset: "nuScenes front-view driving. Frozen 1,200-prompt RL set sampled without replacement (seed 42), split by position into two disjoint 600-prompt subsets for Rounds 1 and 2; standard GRPO uses the same 1,200 prompts in a separate seeded shuffle. Four responses per prompt, 4,800 on-policy student rollouts per method."
  reward: "Trajectory-only bounded reciprocal reward r = (1 + (1/6) * sum_t ||p_t - p*_t||_2^2)^-1 over the six future waypoints; invalid responses receive zero reward. No GRPO KL penalty, no auxiliary reward terms."
  routing_incidence: "The online unresolved-failure gate routed 56 prompt groups (224 responses) in Round 1 and 58 groups (232 responses) in Round 2."
  compute: "Full-parameter BF16 FSDP on 4 x RTX 3090 GPUs; global actor batch size 8 (one micro-example per device), prompt/response limits 3,072/384 tokens, learning rate 5e-7, weight decay 1e-2, warm-up ratio 0.05, gradient-norm cap 1.0, LoRA disabled."
  note: "Not an equal-compute comparison: FIRE-VLA adds frozen-teacher forward passes and restarts optimizer/scheduler state between rounds. Matched across methods are initialization, unique-prompt set, rollout count and policy-update count, but not minibatch order."

