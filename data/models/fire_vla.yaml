eval_conditions:
  nuscenes_planning: "Open-loop nuScenes front-camera trajectory prediction; 6,019 fixed samples from 150 held-out scenes with no scene overlap with RL or SFT training and no image overlap with SFT training; six future waypoints at 0.5 s intervals; L2 in metres, lower is better"
  sampling: "Single-sample low-temperature (n=1, temperature 0.2, still sampled via vLLM so not strictly deterministic) and G=4 stochastic (temperature 0.8, identical sampling settings for all checkpoints)"
  statistics: "All GRPO-FIRE comparisons paired by sample; 10,000 bootstrap replicates with scene as the resampling cluster; single training seed per method"
  limitations: "Open-loop only, so closed-loop safety, traffic compliance, comfort and compounding state shift are not measured; the end-to-end comparison does not isolate failure routing, privileged distillation and teacher promotion; not equal-compute"

