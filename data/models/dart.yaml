architecture:
  backbone: "Inherited from base VLA (openpi models): primary experiments on pi0.5, generality check on pi0-FAST; no architectural modification"
  llm: "PaliGemma-based VLM (inherited from pi0.5 / pi0-FAST)"
  action_head: "Inherits base VLA action head (pi0.5 flow matching; pi0-FAST autoregressive FAST tokens). DART itself is an architecture-agnostic weight-space adaptation: it fine-tunes one-shot source/target update-vectors, extracts a domain vector via analogy subtraction with SVD subspace filtering and scaling, and adds it to the base policy (theta* = theta0 + alpha * domain_vector, alpha=0.8)."
  action_head_category: flow_matching
  parameters: null
  key_innovation: "Analogy-based one-shot VLA adaptation via weight arithmetic (Domain ARiThmetic). Observes that one-shot fine-tuned update-vectors decompose additively into task-specific and domain-specific directions. Extracts a reusable domain vector by subtracting the source-domain update-vector from the target-domain update-vector (same task, one demo each), with (1) subspace filtering that keeps only source SVD basis vectors whose overlap energy with the target subspace passes a dynamic cutoff based on the subspace alignment score gamma, and (2) subspace scaling that down-weights the domain vector by gamma per layer. Adapting pi0.5 with a single target demo yields LIBERO novel-viewpoint avg 79.1% vs zero-shot 54.5%, FLA 74.3%, RETAIN 69.6%; also works for cross-embodiment (Panda to UR5e on MimicGen) and real-world UR10e viewpoint shift (81.7% vs zero-shot 43.3%)."

training:
  dataset: "One-shot: a single target-domain demonstration per environment (LIBERO: 1 demo from 1 task per scene x 5 scenes; MimicGen: 1 Stack demo per robot; real-world: 1 Stack Cube demo) + the corresponding same-task source-domain demonstration"
  method: "One-shot BC fine-tuning of source/target update-vectors for 1,000 steps (AdamW, peak LR 5e-5, batch 64, openpi JAX codebase), then training-free weight arithmetic; full-SVD variant takes ~15m35s on CPU, randomized SVD ~6m33s with comparable accuracy"

