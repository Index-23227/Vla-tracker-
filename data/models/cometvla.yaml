# Paper: CometVLA: Co-Training on an Embodied Data Pyramid towards Physical Understanding
# arXiv: 2608.30289

name: CometVLA
full_name: "CometVLA: Co-Training on an Embodied Data Pyramid towards Physical Understanding"
organization: "JD Explore Academy / The Chinese University of Hong Kong, Shenzhen / Shenzhen Institute of Artificial Intelligence and Robotics for Society / South China University of Technology / Sun Yat-sen University"
date: "2026-08-31"
paper_url: https://arxiv.org/abs/2608.30289
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "Qwen3-VL-4B-Instruct vision-language backbone (2560-d), jointly trained autoregressively on language and discrete FAST action tokens"
  llm: "Qwen3-VL-4B"
  action_head: "DiT-B flow-matching action expert (Beta-sampled timesteps, velocity regression) conditioned on VLM embeddings, a single learnable 1024-d Global Action Prior (GAP) token and robot state tokens; stop-gradient barrier (knowledge insulation) keeps L_fm from updating the backbone"
  action_head_category: flow_matching
  action_space: "Bimanual format, action space padded to 32 dimensions"
  key_innovation: >
    (1) CometData / CometBench: ~1M embodied physical-commonsense VQA pairs (>1.8M images; 5 domains, 16 generator
    categories) harvested from the same robot data used for policy training (teleoperation, simulation, egocentric),
    via a physics middleware that selects keyframes by Hamiltonian jump, gripper step and power anomaly scores; a
    2,000-question held-out CometBench judged by an LLM. (2) Global Action Prior (GAP) token: a globally shared
    learnable token inserted in the backbone sequence that is the sole communication interface to the diffusion
    action expert, crossing the stop-gradient boundary in attention only. (3) Single-stage co-pre-training over the
    embodied data pyramid (VQA, egocentric video, simulation, teleoperation).

training:
  method: "Two stages. Co-pre-training: L_total = L_AR + L_fast + L_fm with knowledge insulation, VLA loss weight 1.0 / VLM 0.1, 100k steps, lr 3e-5 cosine, 5k warmup, AdamW. Post-training: full fine-tuning (no frozen modules) on RoboTwin or task-specific real-robot data"
  batch_size: "pre-training per-device 4 (VLM data) + 8 (VLA data); post-training per-device 16"
  compute: "4 nodes x 8 H200 GPUs"
  training_data: "AgiBot-World-Beta, InternData-A1, EgoLive, EgoDex, general VQA (Cambrian) and CometData; post-training on RoboTwin 2.0 or AgiBot G1 teleoperation data"

