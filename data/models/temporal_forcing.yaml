# Paper: Temporal Forcing: 4D Representation Alignment for Vision-Language-Action Models
# arXiv: 2608.30643

name: Temporal Forcing
full_name: "Temporal Forcing: 4D Representation Alignment for Vision-Language-Action Models"
organization: "Nanjing University / Institute of Automation, Chinese Academy of Sciences / University of Chinese Academy of Sciences"
date: "2026-08-31"
paper_url: https://arxiv.org/abs/2608.30643
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "StarVLA QwenOFT base model: Qwen3-VL-4B vision-language backbone"
  llm: "Qwen3-VL-4B"
  action_head: "MLP action head regressing an action chunk with L1 loss (OFT recipe); LIBERO 7-dim x 8 steps, RoboTwin 14-dim x 16 steps"
  action_head_category: regression
  history_module: "History Pathway: K=7 strictly past frames per camera encoded by frozen DINOv2 ViT-L/14 + Q-Former into 2 gist tokens each, two-layer causal temporal transformer, 16 learned output queries, injected via one zero-initialized tanh-gated cross-attention block at the first decoder layer"
  key_innovation: >
    Extends framewise 3D representation alignment (Spatial Forcing) to 4D. A lightweight history pathway summarizes a
    bounded observation history into temporally aware latents, which are aligned with Causal Geometric Features from a
    pretrained 4D foundation model (StreamVGGT, processing a long causal context) via state, change and readout cosine
    terms (L_temp), while current-frame backbone features (VLA layer 24) are aligned to temporally contextualized Dense
    Geometric Features (StreamVGGT layer 21, L_cur). StreamVGGT and all alignment heads are training-only; inference
    keeps only the base VLA plus the history pathway (45 ms vs 58 ms per chunk on RTX 5090).

training:
  method: "L = L_act (L1) + 0.5 L_cur + 0.5 L_temp, with L_temp = (L_state + 4 L_change + L_read)/6; 4D targets precomputed offline at stride-4 anchors"
  optimizer: "lr 1e-5 backbone, 1e-4 action head and new modules, 2.5e-5 remaining; grad clip 1.0"
  budget: "LIBERO main: 50k steps, global batch 128, 8x A100 (single model trained jointly on four suites). RoboTwin: 10k steps, batch 64, 4x A800. Real robot: 8k steps, batch 48"
  training_data: "LIBERO four suites (primary + wrist); RoboTwin 2.0 50 clean demos per task for 12 tasks (head camera only for history/alignment); 100 real-robot demonstrations on UR3"

