# Paper: Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models
# arXiv: 2608.04765 (v1, 5 Aug 2026)
# NOTE: The paper does not assign an official method name; it refers to the system as
# "pi0.5 + language memory". The tracker name below is descriptive.

name: Explicit-Language-Memory-VLA
full_name: "Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models"
organization: "Fudan University"
date: "2026-08-05"
paper_url: https://arxiv.org/abs/2608.04765
code_url: null
venue: null
open_source: false
model_type: vla

architecture:
  backbone: "Hierarchical two-branch system. High level: PaliGemma VLM (same VLM family as the pi0.5 baseline) reading global instruction + current observation + previous language memory. Low level: pi0.5-style VLA conditioned on the current observation and the predicted subtask."
  llm: "PaliGemma (high-level semantic branch); Gemma-based VLM backbone in the low-level VLA"
  action_head: "Flow-matching action expert (300M parameters, following the pi0.5 action expert), predicting a continuous action chunk of horizon H = 30"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "300M expert"
  key_innovation: >-
    Replaces frame-concatenated visual history with an explicit, recursively
    updated natural-language memory. At each decision step the high-level VLM
    consumes (global instruction, current observation, previous memory) and emits
    an updated memory plus a concise subtask; the low-level VLA turns that subtask
    into a continuous action chunk. Memory follows a rolling-compression rule:
    before a milestone completes it keeps identifying detail (category, color,
    location); after completion the detail collapses into a short past-tense
    statement plus the next intent, so context stays bounded over long horizons.
    Supervision is generated automatically by prompting a general-purpose VLM with
    each frame plus the episode's skill annotations to emit an aligned
    (subtask, memory) pair. The two branches are trained independently, avoiding a
    hand-tuned balance between semantic-generation and continuous-control losses.
    Because memory and subtask are plain text, the loop yields an interpretable
    progress log that separates high-level semantic errors from low-level motor
    failures, and lets a recorded grasp failure condition the next prediction
    (in-context recovery) with no separate recovery controller.

training:
  dataset: >-
    Expert episodes with skill-level annotations (skill names, descriptions,
    start/end timestamps) from BEHAVIOR-1K, Genie Sim 3.0, and a real XLeRobot
    platform. Frame-aligned (memory, subtask) targets are auto-annotated by a
    general-purpose VLM; two annotation routes are reported: a hosted
    Gemini 3.5 Flash API and a locally deployed Qwen3.5-9B model.
    The real-robot dataset contains 25 manually collected trajectories.
  method: >-
    Independent training of the two branches. High level: autoregressive
    cross-entropy on the updated memory and the subtask. Low level: flow-matching
    action objective following the pi0.5 action expert. The high-level PaliGemma
    and the low-level VLM backbone are adapted with LoRA; the 300M Gemma action
    expert is fully fine-tuned. AdamW with warmup + cosine decay,
    peak learning rate 2.5e-5, batch size 64, 50,000 steps.
  num_trajectories: 25
  compute: "4x NVIDIA A100 for training/fine-tuning; inference on 1x NVIDIA RTX 5880 Ada Generation"

benchmarks:
