    pick_up: 30.0
    press_on: 10.0
    place_on: 20.0
    behavior_1k_avg: 40.0
    source: "Paper Table 1, row 'pi0.5 + language memory' (BEHAVIOR-1K turning-on-radio, stage-wise success rate %)"
    date_reported: "2026-08-05"
    eval_condition: "fine-tuned; 4 scored stages (MoveTo, PickUp, PressOn, PlaceOn)"

  behavior_1k_baseline_pi05:
    move_to: 100.0
    pick_up: 10.0
    press_on: 0.0
    place_on: 10.0
    behavior_1k_avg: 30.0
    source: "Paper Table 1, baseline row 'pi0.5' (native pi0.5, no language memory)"
    date_reported: "2026-08-05"
    eval_condition: "baseline comparison, not this model"

  genie_sim:
    follow: 100.0
    pick_up_1: 100.0
    inside_1: 83.3
    upright: 50.0
    pick_up_2: 25.0
    inside_2: 25.0
    genie_sim_avg: 63.9
    source: "Paper Table 2, single-package sorting, row 'pi0.5 + language memory' (Genie Sim 3.0, stage-wise success rate %)"
    date_reported: "2026-08-05"
    eval_condition: "fine-tuned; single-package sorting task, 6 scored stages"

  genie_sim_baseline_pi05:
    follow: 50.0
    pick_up_1: 50.0
    inside_1: 50.0
    upright: 50.0
    pick_up_2: 25.0
    inside_2: 25.0
    genie_sim_avg: 41.7
    source: "Paper Table 2, single-package sorting, baseline row 'pi0.5'"
    date_reported: "2026-08-05"
    eval_condition: "baseline comparison, not this model"

  genie_sim_continuous:
    upright_1: 100.0
    upright_2: 37.5
    upright_3: 37.5
    upright_4: 12.5
    genie_sim_continuous_avg: 46.9
    source: "Paper Table 2, continuous sorting, row 'pi0.5 + language memory' (four differently colored packages, any order)"
    date_reported: "2026-08-05"
    eval_condition: "fine-tuned; continuous four-package sorting variant"

  genie_sim_continuous_baseline_pi05:
    upright_1: 100.0
    upright_2: 25.0
    upright_3: 0.0
    upright_4: 0.0
    genie_sim_continuous_avg: 31.3
    source: "Paper Table 2, continuous sorting, baseline row 'pi0.5'"
    date_reported: "2026-08-05"
    eval_condition: "baseline comparison, not this model"

  real_world:
    follow: 100.0
    pick_up: 55.0
    move_to: 55.0
    place: 55.0
    real_world_avg: 66.3
    source: "Paper Table 3, row 'pi0.5 + language memory' (real XLeRobot pick-and-place, 20 trials, stage-wise success rate %)"
    date_reported: "2026-08-05"
    eval_condition: "fine-tuned on 25 teleoperated trajectories; 20 evaluation trials"

  real_world_baseline_pi05:
    follow: 100.0
    pick_up: 50.0
    move_to: 50.0
    place: 50.0
    real_world_avg: 62.5
    source: "Paper Table 3, baseline row 'pi0.5'"
    date_reported: "2026-08-05"
    eval_condition: "baseline comparison, not this model"

eval_conditions:
  behavior_1k: "BEHAVIOR-1K turning-on-radio task; instruction 'Turn on the radio receiver that is on the table in the living room'; stage-wise success rate averaged over 4 stages"
  genie_sim: "Genie Sim 3.0 (Isaac Sim humanoid manipulation platform); single-package sorting, 6 scored stages (Follow, PickUp, Inside-1, Upright, PickUp, Inside-2)"
  genie_sim_continuous: "Genie Sim 3.0 continuous variant; four colored packages sorted in any order, each scored when placed barcode-up in the scanning area"
  real_world: "XLeRobot: two SO-ARM 101 arms, LeKiwi mobile base, 1 RGB head camera + hand cameras; pick a block from a table and place it on a plate; scored at Follow, PickUp, MoveTo, Place over 20 trials"

