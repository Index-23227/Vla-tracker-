# Paper: Drop-Then-Recovery: How Redundant Are Vision-Language-Action Models?
# arXiv: 2606.27755

name: Drop-Then-Recovery
full_name: "Drop-Then-Recovery: How Redundant Are Vision-Language-Action Models?"
organization: University of Maryland / Cisco Research
date: "2026-06-26"
paper_url: https://arxiv.org/abs/2606.27755
code_url: https://github.com/s1ghhh/VLADrop
venue: null
open_source: true
model_type: efficiency-method

architecture:
  backbone: OpenVLA-OFT (headline config; also applied to pi-0.5, Lingbot-VLA, GigaBrain-0)
  llm: Llama-2-7B (16/32 blocks after Drop Half)
  action_head: base model's action head unchanged (OpenVLA-OFT MLPResNet); DTR drops LLM transformer blocks then recovery fine-tunes
  action_head_category: regression
  parameters: 55.5% of OpenVLA-OFT (Drop Half language)
  key_innovation: >-
    Drop-Then-Recovery (DTR) is a compress-then-recover protocol that physically removes
    transformer blocks from a pretrained VLA and fine-tunes the smaller dense model, paired
    with GateProbe, a one-shot virtual-gate sensitivity metric (inner product of downstream
    gradient and block residual) for selecting recoverable blocks. Language backbones prove
    highly redundant: dropping half the LLM blocks improves OpenVLA-OFT on LIBERO from
    95.0% to 98.3%, and keeping only 2 language blocks still matches baseline, while vision
    and action pathways compress poorly. Yields 1.64x hardware-agnostic task speedup and
    42% memory reduction (DTR-16), validated on real-robot warehouse parcel sorting.

benchmarks:
  libero:
    libero_spatial: 99.0
    libero_object: 100.0
    libero_goal: 97.8
    libero_long: 96.4
    source: "Table 1, DTR Drop Half Language on OpenVLA-OFT"

eval_conditions:
  libero: "fine-tuned (DTR: drop 16/32 LLM blocks of OpenVLA-OFT, then recovery fine-tuning; same training budget as baseline)"

tags: [libero, efficient, compression, layer-dropping, open-source, analysis]
