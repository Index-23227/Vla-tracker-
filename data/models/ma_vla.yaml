# Paper: MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization
# arXiv: 2608.25864

name: MA-VLA
full_name: "MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization"
organization: "Dalian University of Technology / University of Oxford / Sun Yat-sen University / Shanghai Jiao Tong University / USTC / CUHK-Shenzhen / Beihang University"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25864
code_url: https://github.com/zhangzaibin/future-robots
venue: arXiv
open_source: true
model_type: multi-arm-vla

architecture:
  backbone: "pi0 (initialized from official pi0_base checkpoint) as the VLA executor; GPT-4.1 as a frozen (not fine-tuned) VLM planner that emits per-arm atomic prompts"
  action_head: "pi0-style flow-matching action expert jointly predicting all arms' actions in one forward pass, plus a multi-head projection layer that splits the shared latent into arm-specific action heads"
  action_head_category: flow_matching
  parameters: "pi0 backbone (size not restated in paper)"
  key_innovation: "Hierarchical multi-arm VLA: a GPT-4.1 planner decomposes a high-level instruction into stage-wise per-arm atomic prompts drawn from a finite template set; the fine-tuned pi0 executor receives the concatenated 'Arm0: p0, Arm1: p1, ...' string plus global/wrist views and all arm states. Two training-only augmentations target multi-arm compositional generalization: Arm Shuffle randomly permutes (state, wrist view, atomic prompt, action) tuples across arms (p_shuffle up to 1.0) to break arm-identity binding, and View Dropout zero-masks camera views (p_drop 0.2-0.4)."

training:
  base_model: "pi0 (pi0_base)"
  method: "Behavioral cloning (flow matching) fine-tuning of pi0 on per-arm atomic-prompt-labelled demonstrations; atomic labels produced by a rule-based parser over state predicates; 'Regularized' configuration adds Arm Shuffle + View Dropout"
  data: "150 expert demos per simulation task (RoboFactory, RoboTwin 2.0); 50 LeRobot teleoperated demos per SO101 real task"
  steps: "RoboFactory 10k steps (2-arm) / 15k steps (3-4 arm); RoboTwin 2.0 Hard 30k steps; SO101 15k steps; batch size 32, horizon 50"
  hardware: "2x NVIDIA A800"

