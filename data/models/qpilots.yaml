    eval_condition: 'OGBench [Park et al. ICLR 2025] single-task: 10 domains (5 navigation, 5 manipulation),
      5 tasks/domain, 50 tasks total. 1e6 offline + 5e5 online gradient steps. End-of-training mean SR
      over 8 seeds with 95% bootstrap CIs.'
