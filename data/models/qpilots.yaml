name: QPILOTS
full_name: 'QPILOTS: Q-guided Posterior Inference for Learning Off-Policy and Test-Time Steering'
organization: University of Toronto; Vector Institute; LG Electronics
date: '2026-06-11'
paper_url: https://arxiv.org/abs/2606.14801
code_url:
venue: arXiv preprint
open_source: false
model_type: vla
architecture:
  backbone: Inference-time Q-steering wrapper applied on top of a frozen flow-matching VLA. For VLA experiments,
    the base flow is the public pi0.5-LIBERO checkpoint of Black et al. (3B params, PaliGemma-class VLM
    + flow-matching action expert, finetuned on LIBERO-40). For from-scratch OGBench experiments, a flow-matching
    policy with critic ensemble is co-trained.
  llm: Inherits base policy's VLM (pi0.5 = PaliGemma-class for the VLA setting; not modified)
  action_head: 'Inference-time Q-steered flow matching. The base velocity field v_theta(x_t, t, s) is
    left unchanged; at every Euler step the integrator is augmented with a critic-gradient drift v_steered
    = v_theta + alpha * g_t where g_t = (||v_theta|| / (||grad V_t|| + eps)) * grad V_t(x_t; s), and V_t
    is the log-tilt potential of the KL-regularized target pi* propto pi_beta * exp(tau * Qbar). Two variants:
    QPILOTS-U evaluates the critic gradient at the Tweedie-denoised endpoint x_hat_1 = x_t + (1-t) v_theta
    (single forward-backward pass through critic, no extra training); QPILOTS-M draws N=4 differentiable
    posterior samples from a learned Meta Flow Map X_hat_{0,1}(eps; t, x_t, s) and uses an MFM-G log-sum-exp
    Monte Carlo estimator of the posterior-tilt gradient.'
  action_head_category: other
  action_space: continuous
  parameters: 3B (frozen pi0.5 base in LIBERO setting); QPILOTS adds zero parameters for U variant and
    a transformer-style MFM (auxiliary network matching pi0.5's action expert depth/heads, init from pi0.5
    weights) for the M variant; no updates to base flow weights
  key_innovation: 'Recasts policy extraction for flow/diffusion VLAs as flow-time tilted sampling. Rather
    than (a) backpropagating the critic gradient through the multi-step denoising chain (BPTT — numerically
    unstable), (b) distilling the flow into a one-step actor (sacrifices expressivity), or (c) repeatedly
    retraining the policy when the critic changes (couples policy and critic), QPILOTS leaves the base
    flow completely frozen and injects a noiseless-action Q-gradient into the Euler integrator at every
    denoising step. The key technical insight is to never evaluate the critic on noisy intermediate latents
    x_t (where critic predictions are uncalibrated): QPILOTS-U projects x_t to the Tweedie denoised endpoint
    x_hat_1 before computing the critic gradient; QPILOTS-M instead draws differentiable posterior samples
    from a Meta Flow Map and uses a log-sum-exp Monte Carlo estimator of the posterior-tilt gradient.
    The KL-regularized target pi* propto pi_beta * exp(tau * Qbar) is realized via the steered probability-flow
    ODE x_dot* = v_theta + (sigma_t^2 / 2) * grad V_t with sigma_t^2 = 2(1-t)/t. Provides finite-step
    W2 and KL bounds C(1/sqrt(K) + 1/sqrt(N)) under the idealized exact-posterior sampler. Inherits SARSA-based
    online critic learning to avoid prohibitive pi0.5 sampling inside Bellman targets. Magnitude rescaling
    g_t = (||v_theta||/(||grad V_t||+eps)) * grad V_t avoids the t-singular sigma_t^2/2 schedule.

    '
training:
  method: 'Two regimes. (1) From-scratch (OGBench): the base flow v_theta, the J=10 critic ensemble Qbar
    with pessimism rho, and (for M) the MFM are co-trained on offline data via standard conditional flow
    matching (Eq. 3), MFM diagonal+consistency losses (Eqs. 9-10), and TD learning against a pessimistic
    target ensemble with next-actions drawn from the steered policy. 1e6 offline gradient steps + 5e5
    online interaction steps (1 update per env step). (2) Frozen base (LIBERO): the pi0.5-LIBERO checkpoint
    is fully frozen; only a task-specific SARSA critic is learned online for 5e5 steps. QPILOTS-M additionally
    distills an MFM offline on the public LIBERO-90 demos (4e4 gradient steps, batch size 256, ~2 days
    on a single H100) via the GLASS reparameterization of Potaptchik et al., with the frozen pi0.5-LIBERO
    base flow as the conditional teacher; MFM transformer initialized from pi0.5-LIBERO. SARSA is chosen
    over IQL/MC/FQL after a value-learning ablation on LIBERO-90 task 64 (Fig. 3) — SARSA reaches 90%
    SR at 5e5 steps where IQL/FQL exhibit high variance under non-stationary replay and MC is dominated
    by early negative returns.

    '
  compute: 'OGBench: TPU v4-8; 8h (U) / 12h (M) per task per 4 seeds for 1.5e6 total steps. LIBERO: 6h
    (U) / 8h (M) per task per seed for 5e5 online steps. MFM distillation: ~2 days on 1x NVIDIA H100 (3B
    teacher in every batch). Latency analysis on RTX PRO 6000.'
  notes: 'Hyperparameters: tau=1 fixed, K Euler flow steps as in base policy, N=4 MFM posterior samples
    per Euler step for QPILOTS-M, ensemble size J=10, pessimism rho=0.5 (rho=0 on humanoid-maze), action-chunking
    horizon H=10 matching pi0.5 on LIBERO (H=1 navigation, H=5 manipulation on OGBench), gamma=0.99 (0.995
    on giant/humanoid mazes). Steering coefficient alpha tuned per-domain (OGBench: alpha in {0.1,0.2,0.3,0.5,1.0,2.0},
    picked from 4-seed sweep on 2 tuning tasks; LIBERO: alpha in {0.1,0.2,0.3} per task, see Table 4).'
