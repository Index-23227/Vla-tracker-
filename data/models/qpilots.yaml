      aggregate online 90% across 50 tasks beats QAM-E (85%), FQL (82%), FBRAC (64%), DSRL (60%), IFQL
      (49%), FEdit (79%), CGQL/CGQL-M/CGQL-L (67/64/58), and ReBRAC Gaussian (64%).
