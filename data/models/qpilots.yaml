    date_reported: '2026-06-11'
  libero_90:
    task_26_put_wine_bottle_in_bottom_drawer: 43.0
    task_31_put_black_bowl_on_top_of_cabinet: 55.0
    task_38_put_right_moka_pot_on_stove: 91.0
    task_59_pick_tomato_sauce_into_tray: 82.0
    task_60_pick_black_bowl_left_into_tray: 99.0
    task_64_stack_right_bowl_on_left_into_tray: 89.0
    libero_90_6task_mean: 76.5
    variant: QPILOTS-U
    source: 'Paper Table 3 (LIBERO end-of-training success rate, mean over 5 seeds at 5e5 steps, EMA-smoothed).
      QPILOTS-U mean across the 6 evaluated LIBERO-90 tasks is 76.5%; QPILOTS-M is 72.0%. Baselines on
      same 6 tasks: pi0.5 zero-shot 26%, DSRL 58%, BoN(N=5) 40%, EXPO 39%, CGQL-LinEx 31%.'
    date_reported: '2026-06-11'
    eval_condition: Frozen pi0.5-LIBERO base flow + per-task SARSA critic learned online (5e5 steps, 5
      seeds) + QPILOTS-U/M inference-time steering. 6 LIBERO-90 tasks where pi0.5 zero-shot SR is 5-50%.
      Action chunking H=10, gamma=0.99, rho=0.5. alpha per Table 4.
    notes: Not evaluated on the standard LIBERO-4 suite (Spatial/Object/Goal/Long); evaluated on 6 hand-picked
      LIBERO-90 tasks selected to have pi0.5 zero-shot SR in [5%, 50%]. libero_avg not computed for standard
      suite.
eval_conditions:
  libero: 'LIBERO-90 subset (6 tasks: 26/31/38/59/60/64). Frozen pi0.5-LIBERO base; SARSA online critic;
    5 seeds; EMA time-weighted alpha=0.99 smoothing along training axis before averaging across seeds.'
  ogbench: OGBench single-task; 1e6 offline + 5e5 online steps; 8 seeds; per-domain (H, gamma, rho) follows
    Li & Levine 2026.
  steering_coef_sensitivity: Most OGBench domains peak at alpha in {0.1, 0.2, 0.3, 0.5} and degrade gracefully;
    puzzle-4x4-play-sparse requires alpha=2.0 (only domain with sharp peak).
  value_learning_ablation: On LIBERO-90 task 64, SARSA reaches 90% SR at 5e5 steps, outperforming IQL/FQL
    (unstable under non-stationary replay) and Monte-Carlo (dominated by early-training negative returns).
  theoretical_guarantee: Idealized QPILOTS-M with exact posterior samples and unrescaled sigma_t^2/2 drift
    satisfies W2(p_hat_1, pi*) <= C(1/sqrt(K) + 1/sqrt(N)) and KL <= C(1/K + 1/N) under standard regularity
    on v_theta, Qbar, the exact posterior sampler, and sigma_t (Appendix B). QPILOTS-U has no formal guarantee
    — Bayes-optimal only when pi_beta is Gaussian.
