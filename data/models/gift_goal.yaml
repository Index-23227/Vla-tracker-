# Paper: GIFT: Goal-Injected Fine-Tuning for Efficient Manipulation Policy Adaptation
# arXiv: 2609.07006
# Named GIFT-Goal to distinguish from GIFT-Feature (arXiv 2609.04193).

name: GIFT-Goal
full_name: "GIFT: Goal-Injected Fine-Tuning for Efficient Manipulation Policy Adaptation"
organization: "Nanjing University of Aeronautics and Astronautics"
date: "2026-09-07"
paper_url: https://arxiv.org/abs/2609.07006
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "Plug-in fine-tuning over pretrained VLAs: OpenVLA, CogACT (Prismatic VLM), SpatialVLA (PaliGemma2), pi0.5 (real robot). Headline SIMPLER entry = CogACT+GIFT (7B + 72M); LIBERO entry = OpenVLA+GIFT (7B + 72M)"
  action_head: "Base model's own action head (CogACT diffusion head / OpenVLA autoregressive tokens / SpatialVLA / pi0.5 flow expert), fine-tuned; goal image from a LoRA-tuned FLUX.1-Fill-dev editor is encoded, contrasted with the observation (F_goal - F_obs), projected and added to observation tokens through a zero-initialized convolution"
  action_head_category: other
  parameters: "Base + 10M to 72M extra (e.g., CogACT 7B+72M, 150M trainable; OpenVLA 7B+72M, 200M trainable)"
  key_innovation: "ControlNet-style zero-conv goal injection: goal-observation semantic contrast F_delta = F_g - F_t is added to observation embeddings via ZeroConv, so the pretrained policy is undisturbed at init; only goal projector, zero conv and action head are trained for one epoch. Goal image produced once per episode by an in-context side-by-side editing prompt on FLUX.1-Fill-dev with observation-structure latent injection (alpha 0.5, first 25% of 20 denoising steps). action_head_category=other because results span heads of different families."

training:
  method: "Single-epoch fine-tuning of goal projector + zero conv + action head (rest frozen), batch 256, lr 1e-5, FSDP; real robot: pi0.5 LoRA fine-tune (30k steps) then GIFT stage one epoch"
  data: "Fractal (Google Robot), BridgeData V2 (WidowX), LIBERO; real: 2 tasks x 30 demos on Synria Alicia-D"
  hardware: "4x NVIDIA L20 (sim); 1x L20 (real)"

