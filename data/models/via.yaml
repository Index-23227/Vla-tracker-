name: VIA
full_name: 'VIA: Visual Interface Agent for Robot Control'
version: '1.0'
organization: Stanford University
paper_url: https://arxiv.org/abs/2607.11119
date: '2026-07-13'
architecture:
  backbone: Off-the-shelf frontier agents (Claude Code, Codex); no robot-specific fine-tuning
  llm: Frontier FMs (Opus 4.8, Fable 5, GPT-5.5, GPT-5.6-Sol)
  action_head: agentic MCP tool-use (waypoint via visual 3D interface)
  action_space: 6-DoF end-effector waypoints + binary gripper
  action_head_category: other
model_type: agentic framework
