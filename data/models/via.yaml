    eval_condition: zero-shot (no fine-tuning)
eval_conditions:
  libero: 'zero-shot; off-the-shelf agent (Claude Code + Fable 5); minimal prompt; 3 LIBERO-Goal tasks in robosuite; 10 seeds each'
