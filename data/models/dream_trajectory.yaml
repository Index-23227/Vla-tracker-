    gru_xyz_ade_m: 0.028
    gru_xyz_fde_m: 0.035
    gru_angular_ade_deg: 6.2
    gru_geodesic_ade: 0.014
    analytical_fk_xyz_ade_m: 0.241
    diffusion_xyz_ade_m: 0.061
    one_shot_transformer_xyz_ade_m: 0.036
    cross_attention_xyz_ade_m: 0.033
    source: 'DreamTrajectory paper Table 5 (world model architecture comparison; lower is better)'
    date_reported: '2026-08-02'
    eval_condition: 'evaluated on 4,096 trajectories at horizon H=16; predicted quaternions unit-normalized and
      sign-aligned with ground truth; GRU selected for DT'
