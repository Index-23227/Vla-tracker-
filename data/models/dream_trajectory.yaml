name: DreamTrajectory
full_name: 'DreamTrajectory: Trajectory-Guided Action Generation with World Model Alignment for Mobile Manipulation'
organization: Hong Kong University of Science and Technology (Guangzhou) / Ola Dimensions
date: '2026-08-02'
paper_url: https://arxiv.org/abs/2608.01381
code_url: null
venue: arXiv preprint 2026
open_source: false
model_type: vla
architecture:
  backbone: 'pi0.5 VLM backbone (dual-view egocentric head camera + wrist camera, proprioceptive state, language instruction)'
  llm: 'inherited from the pretrained pi0.5 vision-language backbone'
  action_head: 'dual-stream flow-matching action expert that jointly denoises a 7D end-effector trajectory stream and a
    whole-body action chunk stream under a group-causal attention mask; plus a GRU-based action-conditioned trajectory
    world model used only at test time'
  action_space: continuous
  parameters: '3.5B pi0.5 VLA; trajectory head adds 0.017M (<0.01%), trajectory world model adds 49.02M (1.40%),
    complete DT adds 49.04M'
  action_head_category: flow_matching
  key_innovation: 'DreamTrajectory (DT) attacks two failure modes of whole-body mobile-manipulation VLAs. (i) Instead of
    mapping observations directly to whole-body action chunks, a single action expert jointly generates an intention-level
    end-effector trajectory tau_{t:t+H-1} (each waypoint a 7D pose = 3D position + quaternion, expressed in a chunk-local
    frame B_t anchored at the current base pose) and the whole-body action chunk. Both streams are interpolated with
    independently sampled Gaussian noise but a SHARED flow time sigma ~ U(0,1) so they denoise synchronously, and a
    group-causal attention mask makes action tokens attend to the complete trajectory stream while trajectory tokens
    cannot see action tokens — the plan guides the actions without leakage back. (ii) A lightweight action-conditioned
    trajectory world model W_phi(o_t, s_t, a_{t:t+H-1}) predicts the trajectory a candidate chunk would actually induce,
    learned from recorded interaction outcomes (successes and failures) rather than derived analytically, so it captures
    contact, self-collision and low-level tracking error. At test time a search-predict-score loop samples N=30 candidates
    around the initial chunk (per-dimension AR(1) Gaussian perturbations, marginal sigma=0.05, lag-one rho=0.9), scores
    them in parallel by lambda*S_traj + (1-lambda)*eta*S_smooth (lambda=0.5, eta=1e-3), and executes the best. Because
    scoring happens in compact trajectory space rather than pixel space, the refiner is a plug-in stage requiring no
    policy retraining.'
training:
  dataset: 'MS-HAB (ManiSkill-HAB) set_table reinforcement-learning demonstrations with a Fetch mobile manipulator
    (six subtasks); real-world teleoperated demonstrations on an ARX LIFT mobile manipulator (fruit pick-and-place with
    apple/orange/pear/mangosteen, drawer opening, drawer closing). World model trained on an additional interaction
    dataset containing both successful and failed trials, densely sampled with sliding windows.'
  method: 'Two separately optimized stages. Stage I: initialize from pretrained pi0.5 weights and fine-tune with a joint
    conditional flow-matching objective L_VLA = E[lambda_tau*||v_tau - u_tau||^2 + lambda_a*||v_a - u_a||^2] over the
    trajectory and action velocity fields. Stage II: supervised training of the GRU trajectory world model on
    (I_head, I_wrist, s_t, a_{t:t+H-1}, tau_exec) samples, with action and trajectory dimensions independently
    standardized; language is omitted because execution outcomes are task-agnostic. The two components are combined only
    at deployment through test-time refinement.'
  compute: 'inference latency measured on a single RTX 4090 in BF16; DT adds 11.75ms per replanning step
    (trajectory head 3.65ms + trajectory world model 8.10ms)'
