    pick_bowl: 35.0
    open_fridge: 51.0
    close_fridge: 33.0
    open_counter: 91.0
    close_counter: 80.0
    source: 'DreamTrajectory paper Table 2 (success rate %, DT (ours), MS-HAB set_table suite)'
    date_reported: '2026-08-02'
    eval_condition: 'Fetch mobile manipulator, 100 episodes per subtask (600 episodes total), full DT with 30-candidate
      test-time refinement'
  ms_hab_ablation:
    dt_wo_trajectory_guidance_avg: 32.3
    dt_wo_refiner_avg: 47.5
    dt_full_avg: 54.8
    open_fridge_wo_guidance: 5.0
    open_fridge_wo_refiner: 44.0
    open_fridge_full: 51.0
    close_counter_wo_guidance: 38.0
    close_counter_wo_refiner: 72.0
    close_counter_full: 80.0
    source: 'DreamTrajectory paper Table 3 (ablation on MS-HAB, 100 episodes per task)'
    date_reported: '2026-08-02'
    eval_condition: '22.5-point total gain over the action-only pi0.5 baseline = 15.2 points from trajectory guidance
      plus 7.3 points from world-model refinement'
  ms_hab_baselines:
    act_avg: 28.0
    diffusion_policy_avg: 27.7
    rdt_1b_avg: 8.7
    groot_n1_avg: 21.2
    pi0_5_avg: 32.3
    source: 'DreamTrajectory paper Table 2 (baseline success rates %, reproduced by the authors on MS-HAB set_table)'
    date_reported: '2026-08-02'
    eval_condition: '100 episodes per task, same demonstrations, inputs, action representation and evaluation protocol as DT'
  real_world:
    real_world_avg: 90.0
    fruit_pick_and_place: 80.0
    open_drawer: 90.0
    close_drawer: 100.0
    dt_wo_refiner_avg: 81.7
    pi0_5_baseline_avg: 63.3
    source: 'DreamTrajectory paper Table 4 (real-world success rate %)'
    date_reported: '2026-08-02'
    eval_condition: 'ARX LIFT mobile manipulator, 20 episodes per task, three tasks; all tasks require base adjustment
      during manipulation'
