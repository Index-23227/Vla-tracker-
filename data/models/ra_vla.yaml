    unit: "success rate as fraction (0-1), as reported"
    source: "Paper Table 1, RA-VLA row (action-aware retriever)"
    eval_condition: "leave-one-suite-out: trained on three LIBERO suites, evaluated on the fully unseen fourth suite with 3 expert demos per held-out task in the buffer; 50 trials per task; NOT the standard LIBERO protocol"

  libero_novel_task_icl_baselines:
