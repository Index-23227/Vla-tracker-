name: RA-VLA
full_name: "RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation"
organization: "POSTECH (Department of Computer Science and Engineering; Graduate School of Artificial Intelligence)"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25585
code_url: null
venue: ICML 2026
open_source: false

architecture:
  backbone: "GR00T N1.5 (frozen Eagle 2 VLM backbone for observation/segment encoding)"
  action_head: "GR00T N1.5 flow-matching Diffusion Transformer action head with pairwise grounding: each of 8 cross-attention layers attends to current observation features concatenated with one retrieved expert segment (most relevant segments assigned to highest layers); initial noisy action chunk initialized with the mean action chunk of retrieved segments; horizon 16, 4 denoising steps"
  action_head_category: flow_matching
  parameters: "GR00T N1.5 scale (not stated) + 2-layer Transformer retrieval encoder (hidden 512, 8 heads, intermediate 1024)"
  key_innovation: "In-context imitation learning VLA: (1) action-aware retriever trained with a contrastive behavioral alignment loss on DTW-aligned segment pairs, so retrieval matches behavior instead of visual appearance; (2) policy fine-tuned with a contextual adherence loss (margin between MSE with irrelevant vs. retrieved context) to break behavioral inertia; (3) each retrieved segment is pre-encoded and cached independently, keeping latency near-constant in the number of segments. Unseen tasks are handled at test time without weight updates."

