training:
  datasets: ["LIBERO (three of four suites per fold)", "UR5e GELLO teleoperation demos (30 per task, 4 tasks)"]
  method: "Train the retrieval encoder with a behavioral-alignment contrastive loss (DTW positives, tau=0.01), and fine-tune the GR00T N1.5 policy with L_rel + 0.1 * L_adhere (margin m=0.01); VLM backbone frozen and segment features cached offline. Single NVIDIA A100 for training and inference."

eval_conditions:
  libero_novel_task_icl: "test-time adaptation to an entirely unseen LIBERO suite via retrieved in-context demos; not comparable to standard LIBERO fine-tuned scores"
  real_world_ur5e_novel_task: "UR5e, 4 daily tasks, leave-one-out, 12 trials per held-out task"

tags: [in_context_imitation_learning, retrieval_augmented, test_time_adaptation, gr00t_n1_5, flow_matching, contrastive_learning, libero, real_robot, ur5e]
