    spl_sweep: 66.7
    step_count_penalty_plugin: 56.7
    distance_potential_plugin: 63.3
    spl_plugin: 70.0
    source: "Paper Table 2 (Unseen SR, mean over 3 seeds, pi0.5)"
    eval_condition: "ablation: SPL vs alternative progress-aware rewards"

