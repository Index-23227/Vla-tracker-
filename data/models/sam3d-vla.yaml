# Paper: SAM3D-Guided Object-Centric Representation Alignment for Vision-Language-Action Models
# arXiv: 2607.25912

name: SAM3D-VLA
full_name: "SAM3D-Guided Object-Centric Representation Alignment for Vision-Language-Action Models"
organization: "University of Hong Kong / Shenzhen Institutes of Advanced Technology, CAS / Huazhong University of Science and Technology / Beihang University / Infiforce"
date: "2026-07-28"
paper_url: https://arxiv.org/abs/2607.25912
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "pi0 VLM backbone: SigLIP vision encoder + Gemma language model in a Mixture-of-Transformers layout; multi-view RGB images, language instruction and proprioceptive state are tokenized into a shared embedding space"
  llm: "Gemma (pi0 VLM backbone)"
  action_head: "Continuous action expert trained with conditional flow matching; action chunk of horizon H generated by integrating the learned velocity field from tau=0 to tau=1"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "~4B"
  key_innovation: "Object-centric 3D representation alignment: a frozen SAM3D teacher extracts dense object-level 3D features from (image, mask) pairs, the teacher token grid is bilinearly resampled to the pi0 visual-token resolution, and intermediate Gemma visual features are projected into the SAM3D feature space and supervised with a masked, l2-normalized MSE alignment loss (L = L_action + alpha * L_align) restricted to target-object tokens. High-level instructions are decomposed into subtasks by an LLM (GPT-4o) so each stage receives its own target-object mask via Grounding DINO / YOLO + SAM2. All teacher-side modules are training-time only: inference keeps the original pi0 RGB-language-to-action pipeline with no depth, point clouds, masks, SAM3D or extra 3D modules. A frozen-representation probing adapter (two-layer MLP on frozen VLA features) verifies that SAM3D priors become more recoverable after alignment."

training:
  dataset: "LIBERO (4 suites, 500 demos x 10 tasks each), CALVIN ABC->D, and real-world Piper-X (AgileX PiperX) dual-arm demonstrations across cooking, flower arrangement and block stacking"
  method: "SFT of pi0 with conditional flow-matching action loss plus SAM3D-guided masked normalized representation alignment loss; subtask-aware data processing pipeline (LLM subtask decomposition -> Grounding DINO/YOLO detection -> SAM2 mask -> frozen SAM3D feature extraction)"
  compute: "8 x NVIDIA H100 GPUs"

benchmarks:
  libero:
    libero_spatial: 99.2
    libero_object: 99.7
    libero_goal: 99.1
    libero_long: 98.4
    libero_avg: 99.1
    source: "Table 1, SAM3D-VLA paper (arXiv:2607.25912)"
    date_reported: "2026-07-28"
    eval_condition: "fine-tuned, standard LIBERO success-rate protocol per suite"
  calvin:
    calvin_abc_d_1: 96.2
    calvin_abc_d_2: 89.1
    calvin_abc_d_3: 80.5
    calvin_abc_d_4: 73.6
    calvin_abc_d_5: 71.6
    calvin_abc_d_avg_len: 4.11
    source: "Table 2, SAM3D-VLA paper (arXiv:2607.25912), CALVIN ABC->D over 500 rollouts"
    date_reported: "2026-07-28"
    eval_condition: "trained on environments A,B,C; evaluated on held-out environment D; 5-subtask long-horizon chains"

eval_conditions:
  libero: "fine-tuned on each LIBERO suite; RGB + language inference only (no masks/depth/SAM3D at test time)"
  calvin: "ABC->D generalization, 500 rollouts, average completed length over 5 sequential subtasks"

