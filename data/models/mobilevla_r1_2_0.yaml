# Paper: MobileVLA-R1 2.0: RL-Enhanced Reasoning for Mobile Robot Control
# arXiv: 2609.06251
# Journal extension of MobileVLA-R1 (ECCV 2026); tracked as a separate model.

name: MobileVLA-R1 2.0
full_name: "MobileVLA-R1 2.0: RL-Enhanced Reasoning for Mobile Robot Control"
organization: "Peking University / South China University of Technology / National University of Singapore"
date: "2026-09-05"
paper_url: https://arxiv.org/abs/2609.06251
code_url: https://github.com/AIGeeksGroup/MobileVLA-R1-2.0
venue: "Submitted to IEEE TPAMI"
open_source: true
model_type: navigation

architecture:
  backbone: "LLaVA-style VLA initialized from NaVILA (LLaMA3-8B); RGB encoder + DepthAnything V2 depth encoder + Point Transformer V3 point-cloud encoder (frozen)"
  llm: "LLaMA3-8B (NaVILA)"
  action_head: "Reasoning-conditioned action decoder: two learnable queries (locomotion, behavior) cross-attend (1 layer, 8 heads, d=4096) over observation + generated CoT hidden states; regression head for (Vx, Vy, omega) and softmax head over discrete behavior primitives alpha; executed by robot-specific low-level controllers"
  action_head_category: regression
  parameters: "~8B"
  key_innovation: "System-2 -> System-1 -> System-0 interface: the VLA generates <think>/<answer> CoT, and a learnable reasoning-conditioned decoder maps observation + reasoning hidden states to task-level locomotion/behavior targets (replacing the deterministic text parsing of MobileVLA-R1). Training = multi-granularity CoT SFT (episode/step/navigation, 134K samples from MobileVLA-CoT) followed by offline GRPO with movement (cosine), behavior (exact match) and format rewards, decoder frozen during GRPO."

training:
  base_model: "NaVILA"
  method: "SFT with LoRA (r=16, alpha=32) + joint decoder training, then offline GRPO (N=8 samples, 1K steps, lr 1e-6, KL beta 0.04)"
  data: "MobileVLA-CoT (18K episode / 78K step / 38K nav CoT samples) built from R2R, RxR and QUARD with Gemini-2.5-Flash; no Unitree G1 data"
  hardware: "SFT 4x H20; GRPO 1x H20"

