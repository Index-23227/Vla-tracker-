training:
  datasets: ["DROID (world-model pre-training)", "MimicGen D0 tasks (300 demos/task)", "Real-world Galaxea R1 Lite teleoperation (100 demos/task)"]
  method: "Per-task SFT of pi0/pi0.5, then WISE post-training: scheduler-selected contexts, M candidate chunks per context, bounded world-model rollouts (each imagined twice), reward R = G - 0.2 B + 2.0 T, reliability filter (reward separation >= 0.02, ranking consistency >= 0.5, WM variation <= 0.2), group-normalized advantages; 256 rollouts per update; world model and VLA backbone frozen, action head trained."

eval_conditions:
  mimicgen: "task-specific SFT + WISE post-training, 96 episodes/task"
  real_world: "Galaxea R1 Lite, 20 trials per task"

tags: [flow_matching, pi0.5, pi0, reinforcement_learning, grpo, world_model, imagination, post_training, reward_model, mimicgen, real_world]
