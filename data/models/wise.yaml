name: WISE
full_name: "WISE: World-model-guided Imagination Scheduling for Efficient Post-training of Vision-Language-Action Models"
organization: "Tsinghua University; Beijing Academy of Artificial Intelligence (BAAI)"
date: "2026-09-03"
paper_url: https://arxiv.org/abs/2609.03681
code_url: null
venue: null
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (headline) and pi0, task-specifically fine-tuned then post-trained with WISE; VLA backbone frozen during WISE"
  llm: "PaliGemma (pi0 / pi0.5 VLM backbone)"
  action_head: "pi0/pi0.5 flow-matching action expert; only action-head parameters are updated by WISE (advantage-weighted flow-matching loss plus reference regularizer)"
  action_head_category: flow_matching
  parameters: "not reported (pi0 / pi0.5 base)"
  key_innovation: "World-model-guided RL post-training that schedules imagination: a DINOv2-based scheduler selects interaction-relevant states; at those states M candidate action chunks are rolled out for a bounded number of chunks in a frozen action-conditioned multi-view Open-Sora-based world model (DROID-pretrained, task-adapted); a DINOv2 reward model scores imagined futures via progress, confidence and completion; reliability-filtered groups give GRPO-style relative advantages applied only to the real-context first action chunk. ~80% fewer imagined states / ~77% less GPU time than full imagination."

