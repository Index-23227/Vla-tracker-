    t2_bp5_9_pick: 90
    t2_bp5_9_place: 70
    t2_bp5_3_pick: 40
    t2_bp5_3_place: 20
    source: "Paper Table 1 left (T1 ID and T2 OOD box/cube positions)"
  real_world_robot_config:
