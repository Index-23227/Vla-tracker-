    orange_ood_place: 60
    source: "Paper Table 1 right (T4 ID colors, T5 OOD orange)"
  real_world_color_prompt:
    green_correct_color: 70
    green_place: 100
    gray_correct_color: 20
    gray_place: 90
    inverted_green_correct_color: 70
    inverted_green_place: 100
    inverted_gray_correct_color: 30
    inverted_gray_place: 90
    source: "Paper Table 2 (T7)"
  real_world_ood_box:
    black_pick: 100
