# Paper: ROS2SmolVLA: Enabling Small Vision-Language-Action Models for Integration into Industrial-Grade Lightweight Robots
# arXiv: 2608.23320

name: ROS2SmolVLA
full_name: "ROS2SmolVLA: Enabling Small Vision-Language-Action Models for Integration into Industrial-Grade Lightweight Robots"
organization: "University of Augsburg (Chair of Mechatronics)"
date: "2026-08-24"
paper_url: https://arxiv.org/abs/2608.23320
code_url: https://github.com/una-auxme/ros2smolvla_docker
venue: "8th International Conference on Industry of the Future and Smart Manufacturing (Procedia Computer Science)"
open_source: true
model_type: "SmolVLA fine-tuned on UR10e teleoperation data, deployed via a ROS 2 interface"

architecture:
  backbone: "SmolVLA (SmolVLM-2 VLM, 64 visual tokens per frame, layer skipping, interleaved self/cross-attention)"
  llm: "SmolVLM-2 (inherited from SmolVLA)"
  action_head: "SmolVLA flow-matching action expert; outputs Cartesian delta end-effector commands published as TwistStamped to a Cartesian Motion Controller"
  action_head_category: flow_matching
  parameters: "450M (SmolVLA)"
  key_innovation: >
    Open-source ROS 2 bridge (lerobot-ros, lerobot-roscam camera interface, Docker container,
    Gazebo virtual twin) that lets LeRobot/SmolVLA run on an industrial Universal Robots UR10e with a
    Robotiq Hand-E gripper and edge/consumer-grade compute; SmolVLA fully fine-tuned
    (train_expert_only=False) on 349 self-recorded UR10e pick-and-place episodes with recovery episodes.

training:
  dataset: "349 teleoperated UR10e episodes (5x5 cube-position grid x 5 box positions, multi-color cube episodes, error-recovery episodes); 3 cameras + joint states + Cartesian EE pose; released on Hugging Face"
  method: "Fine-tune pretrained SmolVLA base via LeRobot with train_expert_only=False, compile_model=True, otherwise defaults; 200,000 steps"
  compute: "NVIDIA L40S, ~25 h for 200k steps; inference on RTX 4080 16GB workstation, camera aggregation on Jetson AGX Orin"

inference_hz: null

benchmarks:
  real_world:
    pick_success_all: 77.72
    place_success_all: 63.59
    place_after_successful_pick_all: 81.69
    source: "Paper Sec. 4.2 overall scores (among all test cases)"
    date_reported: "2026-08-24"
    eval_condition: "UR10e cube-into-box pick-and-place, all test cases T1-T9 pooled"
  real_world_id:
    pick_success: 78.33
    place_success: 72.50
    place_after_successful_pick: 92.47
    source: "Paper Sec. 4.2 overall scores, ID cases (T1, T3, T4)"
    eval_condition: "in-distribution cube/box positions, robot configurations, cube colors"
  real_world_ood:
    pick_success: 76.56
    place_success: 46.88
    place_after_successful_pick: 61.22
    source: "Paper Sec. 4.2 overall scores, OOD cases (T2, T5, T8, T9)"
    eval_condition: "OOD cube positions, cube color, box colors and shapes"
  real_world_box_position:
    t1_bp1_pick: 90
