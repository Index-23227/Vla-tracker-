# Paper: HOIST: Humanoid Optimization with Imitation and Sample-efficient Tuning for Manipulating Suspended Loads
# arXiv: 2606.00252

name: HOIST
full_name: "HOIST: Humanoid Optimization with Imitation and Sample-efficient Tuning for Manipulating Suspended Loads"
organization: "University of Florida"
date: "2026-05-29"
paper_url: https://arxiv.org/abs/2606.00252
code_url: null
venue: arXiv preprint
open_source: false

model_type: vla

architecture:
  backbone: "GR00T N1.6 (modified) — multimodal VLM + flow-matching action expert; ego RGB + ego depth + side-view RGB + proprioceptive state + language + previous navigation command"
  llm: "GR00T N1.6 VLM (final 4 layers fine-tuned; remaining VLM layers frozen)"
  action_head: "Flow-matching diffusion-transformer action expert that outputs short-horizon planner-command-increment chunks ΔU_t = (Δu_t, ..., Δu_{t+H-1}); each Δu_τ = (Δy^head, Δy^L, Δy^R, Δc^nav, Δh^base); commands are accumulated and executed by a fixed GR00T Whole-Body Controller (πwbc). RL refinement keeps the VLA frozen and trains an actor-critic noise-steering module that predicts the initial flow-matching noise vector deterministically; VLM features cached for efficiency."
  action_head_category: flow_matching
  action_space: "high-level planner commands (head target, bimanual hand targets, navigation command, base height); NOT joint torques"
  parameters: "not specified (GR00T N1.6 backbone; only final 4 VLM layers + action expert + new modality encoders + noise-steering actor-critic are trained)"
  key_innovation: >
    Three-stage pipeline for humanoid hoisting of externally suspended, underactuated payloads:
    (1) VR teleoperation (PICO headset) provides safe approach/push/stop demonstrations;
    (2) supervised finetuning of a GR00T N1.6 VLA policy with newly added depth and navigation-command
    modalities (final 4 VLM layers + flow-matching action expert + new encoders trained);
    (3) iterative batched flow-matching-steering RL refinement that freezes the VLA and trains a
    deterministic noise-steering actor-critic on small batches of autonomous rollouts with a simple
    weighted reward over translational and raw angular placement errors. The whole-body controller
    is fixed throughout, isolating task adaptation to the high-level command policy and the noise
    steering module.

training:
  dataset: "VR-teleoperation demonstrations on humanoid hoisting (50 or 80 demonstrations per domain); up to 30 autonomous VLA rollouts per domain for RL refinement"
  method: "Supervised VLA finetuning on action-chunk targets ΔU_t^demo, followed by iterative batched flow-matching-steering RL (offline actor-critic update of an initial-noise steering module; VLA policy frozen). Reward = weighted combination of translational placement errors and raw angular error."
  optimizer: "not specified"
  steps: "VLA-50 (50 demos), VLA-80 (80 demos); HOIST = VLA-50 + up to 30 RL rollouts"
  hardware: "Real humanoid platform (GR00T Whole-Body Control deployment stack); PICO VR headset + controllers for teleoperation"

