name: XS-VLA
full_name: "XS-VLA: Coupling Coarse-grained Spatial Distillation with Latent Flow Matching for Lightweight Robotic Control"
organization: "Tsinghua University; Beihang University; Wuxi Dexteroushands Robotic Technology"
date: "2026-07-05"
paper_url: https://arxiv.org/abs/2607.04171
code_url: null
venue: arXiv preprint
open_source: false

model_type: vla

architecture:
  backbone: "SmolVLM2-0.25B (SigLIP vision encoder + SmolLM text decoder), spatially distilled from Qwen3-VL-4B teacher into SmolVLM2-PD-0.25B, truncated to 16 layers for the VLA"
  llm: "SmolLM (0.25B-scale, via SmolVLM2)"
  action_head: "Latent Flow Matching: CVAE (BERT-like Transformer encoder, d_model 256) extracts a latent style variable z; conditional flow matching Transformer action expert (SmolVLA-style interleaved cross-/self-attention) regresses the velocity field with Huber loss; KL warmup over first 10k steps; flow time from Beta distribution"
  action_head_category: flow_matching
  action_space: continuous
  parameters: 0.25B
  key_innovation: >
    Two-stage "distill-then-control" framework for sub-0.5B VLAs. Stage 1:
    Qwen3-VL-4B teacher auto-annotates LIBERO scene images with two grasp
    keypoints and coarse-grained spatial descriptions over nine discrete
    directional regions (top/top-left/.../bottom-right); the 0.25B SmolVLM2
    student is fine-tuned on these tuples via autoregressive CE loss, curing
    "spatial blindness" without human annotation. Stage 2: the grounded
    backbone conditions a Latent Flow Matching policy that couples an ACT-style
    CVAE (latent intent z capturing multimodal demonstration styles) with a
    flow matching action expert. Achieves 90.0% LIBERO average at 0.25B - new
    SOTA among <0.5B models - beating Vanilla SmolVLA 2.25B (88.8%) and
    OpenVLA 7B (76.5%), with 86.0% on LIBERO-Long (+23.0pp over the 0.25B
    SmolVLA baseline) and 58 s/epoch execution (3.2x speedup vs SmolVLA-PD;
    only ~1.6 GB GPU memory at inference).

training:
  dataset: "Stage 1: synthetic coarse-grained spatial description tuples auto-generated by Qwen3-VL-4B on LIBERO images; Stage 2: Lerobot-Libero dataset (same as SmolVLA), 160,000 steps; real-world: 100 teleoperated bimanual demos by 3 expert operators (XLerobot), XS-VLA trained 20,000 steps"
  method: "Two-stage: (1) spatial instruction tuning of SmolVLM2-0.25B on teacher-distilled direction-oriented discrete prediction data (cross-entropy); (2) end-to-end joint training of vision encoder, language backbone, CVAE and flow matching action expert; total loss = lambda_FM * Huber flow matching loss + lambda_KL * KL, with linear KL warmup over 10k steps; no VLA action-trajectory pretraining"
  notes: "At inference the CVAE encoder is bypassed (z = 0 or sampled from N(0,I)). Also deployed on OpenARM and PiPER hardware."

