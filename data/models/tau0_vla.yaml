# Paper: τ0-VLA: a Hierarchical Robot Foundation Model with World-Model-Guided Test-Time Computation
# arXiv: 2608.16885

name: τ0-VLA
full_name: "τ0-VLA: a Hierarchical Robot Foundation Model with World-Model-Guided Test-Time Computation"
organization: "Agibot Finch / Shanghai Innovation Institute / The Chinese University of Hong Kong"
date: "2026-08-17"
paper_url: https://arxiv.org/abs/2608.16885
code_url: null
venue: arXiv preprint
open_source: false
model_type: hierarchical_vla

architecture:
  backbone: "Low-level policy: Qwen3.5-2B vision-language backbone + Mixture-of-Transformers (MoT) action expert; high-level policy: proposal / value / reflective models each fine-tuned from a robot-pretrained Qwen3.5-9B VLM, plus a world model initialized from Step1X-Edit"
  llm: "Qwen3.5-2B (low-level), Qwen3.5-9B (high-level)"
  action_head: "MoT action expert (separately parameterized Transformer streams with joint attention to backbone tokens at each full-attention layer) trained with masked conditional flow matching over a unified 40-D state/action space; action horizon H=30, ten uniform Euler steps; runs at ~30 Hz control rate while the high-level policy refreshes the subtask about every 1 s"
  action_head_category: flow_matching
  parameters: "Low-level ~2B-scale (Qwen3.5-2B + MoT expert); high-level VLMs 9B-scale; exact totals not reported"
  key_innovation: "Formulates high-level subtask generation as compute-scalable inference: a memory-augmented proposal model generates the next subtask, and when token confidence is low it triggers world-model-guided beam search (propose with VLM, imagine terminal head-camera image with a world model, score with a VQA-style value model, keep top-B to depth D), after which a reflective model commits to the final subtask (not restricted to the candidate set). Execution memory is trained to self-correct via perturbed (lagging / running-ahead / misrepresenting) memories. The low-level generalist VLA is trained on 40,115 hours of heterogeneous real-world robot data with multimodal co-training in three stages (knowledge-isolated co-training, end-to-end co-training, task-specific adaptation)."

