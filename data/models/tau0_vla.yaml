training:
  datasets: ["40,115 hours of heterogeneous real-world robot data: ~23.4K h internal (21.9K h AGIBOT G1, 585 h AGIBOT G2, 578 h ARX AC One, 347 h Franka) + ~16.7K h public (incl. 9.25K h open-source UMI data)", "multimodal vision-language co-training data", "automatically constructed high-level VQA data with memory-perturbed instances (40.4M clean samples retained)"]
  method: "Low-level: three stages - knowledge-isolated co-training, end-to-end co-training, task-specific fine-tuning. High-level: proposal, value and reflective models independently fine-tuned from a robot-pretrained Qwen3.5-9B; world model fine-tuned from Step1X-Edit on subtask start/end head-camera frame pairs; value and reflective models trained on offline proposal+world-model rollouts"

eval_conditions:
  real_world: "Task-specific fine-tuned; AGIBOT G1 long-horizon tasks (Clean Room, Prepare Ingredients, Tomato and Egg Stir Fry, Make Milk Tea), 10 physical trials per task, success rate and milestone progress"

