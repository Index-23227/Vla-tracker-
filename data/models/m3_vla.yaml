# Paper: Robust Bimanual Vision-Language-Action Models via Embarrassingly Simple Modality Masking
# arXiv: 2608.22419

name: M3-VLA
full_name: "Robust Bimanual Vision-Language-Action Models via Embarrassingly Simple Modality Masking (Modality Masking Mechanism, M3)"
organization: "Southeast University / Shanghai Innovation Institute / Wuhan University / Zhejiang University / USTC / SJTU / CityU Hong Kong"
date: "2026-08-23"
paper_url: https://arxiv.org/abs/2608.22419
code_url: null
project_url: https://m3vla.github.io
venue: arXiv
open_source: false
model_type: "Query-based VLA (VLA-Adapter style) trained with structured modality masking"

architecture:
  backbone: "Prismatic VLM with hybrid DINOv2 + SigLIP vision encoder"
  llm: "Qwen2.5-0.5B"
  action_head: "VLA-Adapter-style action expert: learnable action queries with per-layer bridge attention, MLP decodes an action chunk in one forward pass under L1 regression (chunk size 25)"
  action_head_category: regression
  parameters: "~0.5B (VLA-Adapter scale); no added parameters"
  key_innovation: >
    Modality Masking Mechanism (M3), a training-only strategy: additive attention masks stochastically hide
    (1) both wrist views jointly (egocentric view always kept as spatial anchor), (2) the whole language
    modality, and (3) a random subset of action queries (at least one kept, remaining queries rescaled by
    1/(1-p_q)). Masked tokens neither attend nor are attended. No architectural or inference-time change;
    also transferred to OpenVLA-OFT.

training:
  dataset: "RoboTwin 2.0, 10 bimanual tasks x 50 clean demos each; real world 3 long-horizon Agilex Cobot tasks x 50 demos"
  method: "Task-specific fine-tuning with LoRA rank 64, AdamW lr 2e-4, 10k steps, x0.1 decay at 5k; best query-mask ratio 0.1"
  compute: null

inference_hz: null

