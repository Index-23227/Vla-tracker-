name: PointACT
full_name: "PointACT: Vision-Language-Action Models with Multi-Scale Point-Action Interaction"
organization: Inria / ENS / CNRS / PSL Research University
date: '2026-05-20'
paper_url: https://arxiv.org/abs/2605.21414
code_url: https://cshizhe.github.io/projects/pointact.html
venue: RSS 2026
open_source: true
architecture:
  backbone: Qwen2.5-VL-3B (frozen) + Point Transformer v3 (PTv3-Large)
  llm: Qwen2.5-VL-3B
  action_head: regression / classification head with multi-scale point-action interaction via bottleneck window self-attention
  action_head_category: regression
  parameters: ~3B VLM (frozen) + ~300M trainable action expert
  key_innovation: >-
    PointACT tightly couples a hierarchical 3D point cloud encoder (PTv3) with a
    frozen 2D VLM backbone (Qwen2.5-VL-3B), letting action tokens act as
    bottleneck queries that densely attend to multi-scale point features through
    window self-attention. This multi-scale point-action interaction grounds
    actions in both local geometric detail and global scene structure while
    keeping the VLM weights intact.
training:
  dataset: LIBERO (4 suites, 10 tasks each) + RLBench (10 tasks) + real-world (SO-100, UR5)
  steps: 20K-50K gradient steps
  hardware: 2x NVIDIA H100 GPUs
  optimizer: AdamW (lr 5e-5, cosine decay), batch size 128
  point_cloud: 1cm voxelization, max 4096 points, gravity-axis rotation aug
benchmarks:
  libero:
    libero_spatial: 97.4
    libero_object: 99.6
    libero_goal: 96.2
    libero_long: 90.6
    libero_avg: 96.0
    source: Table (LIBERO), PointACT paper
    date_reported: '2026-05-20'
    eval_condition: fine-tuned
  rlbench:
    close_box: 91
    close_laptop_lid: 99
    toilet_seat_down: 96
    sweep_to_dustpan: 59
    close_fridge: 81
    phone_on_base: 99
    umbrella_out: 99
    frame_off_hanger: 69
    wine_at_rack: 90
    water_plants: 40
    rlbench_avg: 82.3
    source: Table (RLBench 10 Tasks), PointACT paper
    date_reported: '2026-05-20'
    eval_condition: fine-tuned
eval_conditions:
  libero: fine-tuned
  rlbench: fine-tuned
tags:
