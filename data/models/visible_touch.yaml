# Paper: Visible Touch: Rendering Contact for Visuomotor Policies
# arXiv: 2609.14156

name: Visible Touch
full_name: "Visible Touch: Rendering Contact for Visuomotor Policies"
organization: "University of California, Los Angeles"
date: "2026-09-12"  # arXiv stamp on the PDF (2609.14156v1, 12 Sep 2026)
paper_url: https://arxiv.org/abs/2609.14156
code_url: null  # policy code release not stated in the paper; project website: https://visibletouch.github.io/
venue: "Not stated in the paper"
open_source: false  # the magnetic contact sensor hardware is stated as open-sourced; policy code/weights release not stated in the paper
model_type: vla

architecture:
  backbone: "Policy-agnostic input augmentation applied to three policy families: LIBERO BC-Transformer (ResNet-18, trained from scratch), miniVLA (Qwen2.5-0.5B + DINOv2/SigLIP 224px, fully unfrozen), and pi0.5 (pi05_droid, SigLIP-So400m + Gemma-2B, ~2.3B, LoRA)"
  llm: "Qwen2.5-0.5B (miniVLA); Gemma-2B from PaliGemma (pi0.5); none (BC-Transformer)"
  action_head: "Unchanged from each base policy: GMM head (BC-Transformer), VQ action tokens via extra vocabulary (miniVLA), 311M Gemma flow-matching action expert with 10-step chunks (pi0.5, real-world headline)"
  action_head_category: other
  parameters: "~2.3B for the pi0.5 real-world policy (LoRA r=16 backbone / r=32 action expert); miniVLA 0.5B LLM; BC-Transformer small (not totalled in the paper)"
  key_innovation: "Contact is rendered as an image-space overlay composited onto the policy's existing RGB views: each taxel's 3-axis reading is drawn as an arrow projected via forward kinematics and camera extrinsics (variants Multi-arrows / Avg. Arrow / Binbars), so any image-conditioned policy or VLA becomes contact-aware with no architectural change and no force calibration. Paired with an open-source 3x3 magnetic contact sensor (4 mm, <$5 in elastomer+magnet parts) built via a parametric CAD-to-mold pipeline"

training:
  base_model: "BC-Transformer (from scratch); miniVLA (pretrained from scratch on LIBERO_90 with overlays, and fine-tuned from released checkpoint); pi0.5 pi05_droid (LoRA)"
  method: "Supervised imitation with overlay-augmented RGB inputs; pi0.5 LoRA fine-tuning (batch 8, peak lr 1e-4, up to 20k steps with early stopping)"
  data: "LIBERO demonstrations with MuJoCo gripper-finger contact forces rendered as overlays; real world: 100 TeleDex teleop demos per task (397 accepted) on a UFactory xArm7 with custom magnetic sensors"
  hardware: "miniVLA pretraining on 4x L40S (200k steps); pi0.5 runs on 4x H200 each"

