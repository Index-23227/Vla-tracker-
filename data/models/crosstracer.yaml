name: CrossTracer
full_name: "CrossTracer: Cross-Embodiment Navigation via VLA Model Reasoning and Trace Residuals Adapting"
organization: "Peng Cheng Laboratory / Southern University of Science and Technology / Innovation Investment Research Institute / Soochow University"
date: "2026-08-07"
paper_url: https://arxiv.org/abs/2608.06688
code_url: null
venue: null
open_source: true
model_type: navigation
inference_hz: null

architecture:
  backbone: "VL-Tracer: OmniVLA visual/goal encoder (LoRA fine-tuned). CE-Adapter: pretrained ResNet visual branch with FiLM modulation + Transformer fusion."
  llm: "Llama 7B (OmniVLA language backbone, frozen; LoRA adapters trained)"
  action_head: "Trace prediction head: MLP over LLM hidden states with tanh, emitting N=8 normalized 2D image-plane waypoints in [-1,1]^2. CE-Adapter adds a Trace Residual Head (delta_max * tanh(MLP)) producing residual waypoint offsets, plus auxiliary Traversability Reconstruction Head and Embodiment Sensitivity Head."
  action_head_category: regression
  parameters: "8B (reported as CrossTracer-8B in Table I)"
  key_innovation: "Two-stage hierarchical design that uses a normalized pixel-space trace as the interface between embodiment-agnostic semantic reasoning and embodiment-aware physical grounding. VL-Tracer (LoRA-tuned from OmniVLA) proposes an initial trace from an egocentric RGB image plus flexible goals (language, target pixel pose, or both, with p_drop=0.3 modality dropout). CE-Adapter then predicts residual corrections conditioned on a learned robot embedding via FiLM layers and trace-to-visual cross-attention. Supervision comes from CE-RRT*, an automated labeling pipeline that turns Mask2Former (ResNet-50) panoptic segmentation into robot-conditioned traversability cost maps and runs RRT* (p_goal=0.15, step 25 px, radius 60 px, N_max=10,000) in the image plane to synthesize cost-minimizing reference traces. Segmentation and cost maps are training-only; inference needs just RGB, goal, and embodiment ID."

training:
  dataset: "VL-Tracer: navigation trace data from VAMOS. CE-Adapter: 62k egocentric navigation images auto-annotated by CE-RRT*."
  method: "Two-stage. Stage 1: VL-Tracer LoRA fine-tuning (backbone frozen; LoRA params + trace head optimized) with waypoint L2 loss + smoothness term (lambda_smooth=0.01). Stage 2: VL-Tracer frozen, CE-Adapter trained with composite loss L_trace + lambda_trav*L_trav + lambda_cost*L_cost + lambda_smooth*L_smooth, weights (1.0, 1.0, 1.0, 0.05), Adam lr 1e-4, batch size 64, 64x64 input resolution, N=8 waypoints. No gradients flow back into VL-Tracer."
  compute: "VL-Tracer: 8x NVIDIA A100, ~48 hours. CE-Adapter: 1x NVIDIA RTX 4090, ~3 hours."

