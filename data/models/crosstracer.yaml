eval_conditions:
  navitrace: "Official NaviTrace protocol; egocentric RGB + language instruction + embodiment type; model outputs 8 normalized 2D pixel-space waypoints. Language-only goal setting."
  navitrace_goal_pose: "Adds a target pixel coordinate on top of the language instruction and embodiment type; not directly comparable to the language-only setting."
  real_world: "Wheeled and legged platforms, egocentric RGB camera, NVIDIA Jetson Orin onboard with remote RTX 4090 workstation inference over WiFi. Four tasks (two indoor semantic targets, one elevated-platform target, one outdoor turning task), 5 trials each per platform per method. Identical low-level controller across methods; reference path length and time taken from human expert paths."

