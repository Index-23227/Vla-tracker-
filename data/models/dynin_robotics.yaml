# Paper: Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model
# arXiv: 2609.13053

name: Dynin-Robotics
full_name: "Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model"
organization: "AIDAS Lab, Seoul National University"
date: "2026-09-11"
paper_url: https://arxiv.org/abs/2609.13053
code_url: https://github.com/AIDASLab/Dynin-Robotics
venue: arXiv
open_source: true
model_type: vla

architecture:
  backbone: "Dynin-Omni omnimodal masked-diffusion model (single bidirectional Transformer, shared token embeddings, unified categorical head); frozen text tokenizer and MAGViT-v2 image/video tokenizer"
  llm: "Dynin-Omni (masked diffusion language model backbone)"
  action_head: "Shared masked-diffusion prediction head over uniformly binned discrete action tokens (per-dimension uniform bins, 7D EEF interface); block-wise parallel denoising of action chunks; optional goal-state guidance and joint action/next-state denoising"
  action_head_category: discrete_diffusion
  parameters: "Not stated in the paper"
  key_innovation: "One masked-diffusion model trained on four objective-conditioned queries (Policy, action-conditioned World Modeling, Goal-State Prediction, Task Understanding) over a shared trajectory token sequence; inference compositions (goal-guided policy, joint action/next-state denoising, world-model candidate reranking) for test-time scaling; dInfer block-parallel decoding up to 29.2x faster model-side action decoding"

training:
  method: "Stage 1: continual pretraining from Dynin-Omni on 48 OXE datasets with four objectives (27.6k optimizer updates / 220.8k micro-steps, AdamW peak LR 2e-5). Stage 2: per-domain SFT (Policy-only or four-objective mixture). Optional online PPO stage trains only a lightweight remasking controller with the backbone frozen"
  data: "Open X-Embodiment 48-dataset mixture (1,332,985 trajectories, 65,217,081 transitions); Stage 2 on LIBERO, VLABench SelectFruit/InsertFlower, real-world Franka data"
  hardware: "Stage 1 reported as a 32-rank run; profiling on NVIDIA B200"

