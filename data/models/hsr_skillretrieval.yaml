# Paper: Hierarchical Skill Retrieval for Data-Efficient Adaptation of Vision-Language-Action Models
# arXiv: 2608.24042

name: HSR-SkillRetrieval
full_name: "HSR: Hierarchical Skill Retrieval for Data-Efficient Adaptation of Vision-Language-Action Models"
organization: "Carnegie Mellon University (Robotics Institute)"
date: "2026-08-25"
paper_url: https://arxiv.org/abs/2608.24042
project_url: https://hoar012.github.io/HSR-Project
venue: arXiv preprint
open_source: true
model_type: vla

architecture:
  backbone: "SmolVLA-450M (pretrained); only the action expert (~100M params) is updated during adaptation"
  llm: "SmolVLA VLM backbone (frozen); Qwen3-VL-4B used offline as LLM task planner for retrieval; BERT text embeddings for retrieval; VAE behavior encoder for reranking"
  action_head: "SmolVLA flow-matching action expert"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "450M total (SmolVLA), ~100M trainable"
  key_innovation: "Training-time data retrieval for few-shot VLA adaptation: prior-dataset instructions are clustered into K=10 skills, skill reliability is scored by held-out BC loss and trajectory length (Skill Confidence Score), an LLM planner proposes 10 decompositions ranked by semantic score x product of skill confidences, subtasks drive language retrieval followed by VAE behavior-feature frame reranking, then two-stage adaptation (pretrain on language-retrieved skills, finetune on target + reranked data)."

training:
  method: "Two-stage adaptation of the SmolVLA action expert: stage 1 pretraining on language-retrieved episodes from the prior dataset; stage 2 finetuning on target demos + feature-reranked frames (real world: target demos only)"
  data: "LIBERO: 5 target demos per LIBERO-10 task, LIBERO-90 as prior (top 10% episodes, then top 30% frames, ~3% of prior frames). Real world: 20 target demos per task on xArm, 10k DROID trajectories as prior"

benchmarks:
  libero_long_5shot:
    success_avg: 43.5
    soup_s: 18.0
    cheese_b: 32.0
    book: 90.7
    soup_c: 12.7
    moka_m: 15.3
    mug_mug: 18.0
    mug_p: 26.0
    stove_m: 73.3
    bowl_c: 81.3
    mug_m: 67.3
    source: "Paper Table I (row HSR, mean over 3 seeds x 50 episodes)"
    date_reported: "2026-08-25"
    eval_condition: "LIBERO-10 (Long) with only 5 target demos per task, LIBERO-90 as retrieval prior, SmolVLA-450M; NOT the standard full-data LIBERO protocol"

  libero_long_5shot_baselines:
    bc_avg: 22.7
    random_avg: 26.0
    all_data_avg: 29.0
    language_retrieval_avg: 31.5
    flow_retrieval_avg: 28.3
    strap_avg: 31.9
    behavior_retrieval_avg: 33.2
    iwr_avg: 32.5
    source: "Paper Table I (baseline rows)"
    date_reported: "2026-08-25"

  libero_long_5shot_decomposition_ablation:
    llm_only_avg: 37.1
    llm_plus_skill_set_avg: 37.7
    hsr_avg: 43.5
    human_plans_avg: 44.9
    source: "Paper Table III"
    date_reported: "2026-08-25"

  real_world:
    drawer: "18/20"
    trashcan: "8/20"
    cup_drawer: "13/20"
    cup_tea: "9/20"
    overall: "48/80"
    source: "Paper Table II (row HSR)"
    date_reported: "2026-08-25"
    eval_condition: "7-DoF xArm, 4 long-horizon tasks (1-4 subtasks), 20 target demos per task, 20 trials per task"

  real_world_baselines:
    bc_overall: "27/80"
    behavior_retrieval_overall: "27/80"
    iwr_overall: "31/80"
    source: "Paper Table II (baseline rows)"
    date_reported: "2026-08-25"

eval_conditions:
  libero_long_5shot: "LIBERO-10, 5 demos per task, LIBERO-90 prior, 3 seeds x 50 episodes"
  real_world: "xArm 7-DoF, 20 demos per task, DROID prior, 20 trials per task"

tags:
  - flow_matching
  - smolvla
  - data-retrieval
  - few-shot-adaptation
  - llm-task-decomposition
  - libero
  - real-world
