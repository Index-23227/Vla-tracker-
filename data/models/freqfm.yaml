# Paper: Frequency-Conditioned Flow Matching for Vision-Language-Action Models
# arXiv: 2609.10405

name: FreqFM
full_name: "Frequency-Conditioned Flow Matching for Vision-Language-Action Models"
organization: "AGIBOT / Xi'an Jiaotong University"
date: "2026-09-09"
paper_url: https://arxiv.org/abs/2609.10405
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (primary); also instantiated on pi0 (LeRobot codebase)"
  llm: "PaliGemma (Gemma-2B) as in pi0 / pi0.5"
  action_head: "Unmodified flow-matching action expert operating on DCT-II coefficients of the action chunk along the horizon (inverse DCT after ODE integration)"
  action_head_category: flow_matching
  parameters: "same as pi0.5 / pi0 plus per-(frequency, dof) learnable log-scales"
  key_innovation: "Frequency as an explicit conditioning dimension across the whole flow-matching pipeline: (1) spectrum-matched source N(0, diag(P_k,d)) from training-action power spectra, (2) PSD-normalized (rho=0.25) likelihood-based adaptive multi-task weighting per frequency, (3) Spectral Transport-Budgeted CFG that radially clips the CFG residual per frequency into a ball scaled by the reference transport scale (E[u^2] = 2P)."

training:
  base_model: "pi0.5 (and pi0)"
  method: "Fine-tuning with frequency-domain flow matching, 20k steps, global batch 64, condition dropout 0.05 for CFG"
  data: "LIBERO; VLA-Arena; AgiBot Expedition A2 real-robot demonstrations (6 tasks)"
  hardware: "2x NVIDIA A800"

