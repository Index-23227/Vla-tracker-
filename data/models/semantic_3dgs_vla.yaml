eval_conditions:
  platform: "Unitree Go2 Edu quadruped with an Alicia-D 6-DoF arm and gripper-mounted RGB camera; arm joint targets streamed at 30 Hz over ROS; quasi-static household manipulation, not fast dynamic interaction"
  protocol: "Unless otherwise noted 30 real-robot trials per setting with randomized initial object poses; the long-horizon and cluttered banana-to-bowl evaluations are expanded to 50 trials per method with success counts, time standard deviations and 95% Wilson confidence intervals"
  success_definition: "A trial counts as successful only when the complete instruction is finished within the time budget (60 s for local multi-task manipulation, 180 s for the long-horizon task) without unsafe behavior"
  fair_baseline_adaptation: "All baselines use the same embodiment and the same 10 teleoperated demonstrations per task, with train/test split, wrist-camera setup, action interface, navigation waypoints, base-control assistance, initial scene distributions and evaluation budgets held fixed; each method keeps its native perception representation"
  scope: "Open-vocabulary target grounding with few-shot embodiment-specific manipulation, not zero-shot acquisition of arbitrary robot skills; the local Semantic-3DGS is built before manipulation and refreshed on grounding failure rather than updated inside the servo loop"
  limitations: "Semantic-3DGS construction and VLA inference run on an off-board RTX 4090; no simulation-benchmark numbers (LIBERO, CALVIN, SimplerEnv, RoboTwin) are reported; per-task few-shot success rates and the block-sensitivity trend appear only in figures"

