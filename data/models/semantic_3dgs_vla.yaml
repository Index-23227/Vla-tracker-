# Paper: Embodied Multimodal Grounding for Open-Vocabulary Mobile Manipulation via Semantic 3D Gaussian Splatting
# arXiv: 2608.10756

name: Semantic-3DGS-VLA
full_name: "Embodied Multimodal Grounding for Open-Vocabulary Mobile Manipulation via Semantic 3D Gaussian Splatting"
organization: "The Hong Kong University of Science and Technology (Guangzhou); Midea Group"
date: "2026-08-11"
paper_url: https://arxiv.org/abs/2608.10756
code_url: null
venue: "ACM MM 2026"
open_source: false
model_type: vla

architecture:
  backbone: "DexVLA-style policy with a Qwen2-VL vision-language backbone; four actively acquired wrist-camera RGB views feed a local Semantic-3DGS field whose geometry is initialized by a pretrained VGGT model and whose per-Gaussian semantics are distilled from CLIP and DINOv2 with SAM mask-aware pooling"
  llm: "Qwen2-VL"
  action_head: >
    ScaleDP diffusion action expert (DexVLA plug-in diffusion expert). Semantic-3DGS cues are fused
    into a single conditioning vector and injected only into the final five diffusion blocks
    B = {L-4, L-3, L-2, L-1, L} via zero-initialized projections and lightweight MLP adapters
    (h_l <- h_l + A_l(Proj(z_sem))). The cue set is a language-conditioned target heatmap H_t, an
    obstacle-aware occupancy cue O_t, a three-channel PCA rendering P_t of the distilled per-Gaussian
    semantic field, and a target-relative pose vector r_t = [p_obj^B, h_t] in R^4; the image cues are
    concatenated with the RGB observation and encoded to z_img in R^128, the pose cue to z_pose in
    R^128, and their sum is z_sem. The VLM backbone and all pretrained diffusion blocks stay frozen;
    only the semantic encoder, projection layers, late-block adapters and the embodiment-specific
    action head are trained. Action chunk length 15, two recent observation frames, arm joint targets
    (including gripper) streamed at 30 Hz over ROS.
  action_head_category: diffusion
  action_space: "continuous 6-DoF arm joint targets plus gripper, streamed at 30 Hz"
  parameters: null
  key_innovation: >
    A single target-conditioned local Semantic-3DGS field is reused as a shared perception-to-action
    interface across five stages instead of being a one-off perception output: (1) active view
    acquisition, where candidate IK-feasible wrist poses are scored by
    J(v) = lambda_cov*C_sem(v) + lambda_par*C_par(v) - lambda_move*C_move(v) and the argmax view is
    visited until four images are collected (the base stays fixed and no VLA policy is used for view
    planning); (2) open-vocabulary Gaussian-level language localization, where a frozen CLIP text
    encoder plus generic negative prompts gives each Gaussian a softmax relevance score s_k, and the
    object position is the opacity/inverse-covariance-weighted centroid
    p_obj = sum_{k in K} w_k*mu_k / sum_{k in K} w_k with w_k = alpha_k * trace(Sigma_k)^-1 over the
    support K = {k | s_k > delta}, with a 6D pose from PCA and optional ICP refinement; (3)
    obstacle-aware rendering; (4) reachability-aware base stance preparation
    (x* = x_obj - 0.35 m, y* = y_obj - sign(y_obj)*0.20 m, psi* = atan2(y_obj, x_obj), and a
    crouch/stand switch at z_obj < 0.30 m) executed by a PPO leg-residual policy trained in Isaac Lab
    with domain randomization; (5) Late-Block Semantic Injection into only the final five diffusion
    experts, which the paper argues preserves pretrained continuous action priors that early or
    all-block injection degrades. The field is built before manipulation and refreshed on grounding
    failure, never optimized inside the low-level servo loop.

training:
  dataset: "10 teleoperated real demonstrations per task on the target embodiment; each trajectory records wrist RGB, robot proprioception and arm joint targets at 30 Hz. Test objects are held-out instances, though semantically related object families may appear in the demonstrations."
  method: >
    Two separately trained pieces. (a) Manipulation: only the semantic encoder, projection layers,
    late-block adapters and embodiment-specific action head are trained offline from the real
    demonstrations; the Qwen2-VL backbone and all pretrained diffusion blocks are frozen. The
    Semantic-3DGS feature field is optimized per scene with a cosine feature loss
    L_feat = sum_{i,u} (1 - cos(F_C_hat, F_C_tilde)) + lambda_D * sum_{i,u} (1 - cos(F_D_hat, F_D)),
    lambda_D = 0.1. (b) Base posture: a PPO policy outputting leg-joint residuals and the
    stand/crouch switch, trained in Isaac Lab on NVIDIA Isaac Sim with domain randomization. It is
    the only component trained in simulation.
  hardware: >
    Unitree Go2 Edu quadruped (standing and crouching modes) with a Unitree 4D L1 LiDAR, onboard
    Jetson Orin NX, and an Alicia-D 6-DoF arm with a gripper-mounted RGB camera. Semantic-3DGS
    perception and VLA inference run off-board on an RTX 4090 workstation; low-level control and the
    base posture policy run onboard.

