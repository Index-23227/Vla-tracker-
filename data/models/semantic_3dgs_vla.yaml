    eval_condition: "Long-horizon real-robot task: open a drawer, retrieve a banana, close the drawer, navigate to a black chair and place the banana; 50 trials, randomized initial object poses, 180 s time budget, success only if the complete instruction finishes without unsafe behavior; 95% Wilson interval"

