# Paper: Dive into the Scene: Breaking the Perceptual Bottleneck in Vision-Language Decision Making via Focus Plan Generation
# arXiv: 2606.04046

name: SceneDiver
full_name: "Dive into the Scene: Breaking the Perceptual Bottleneck in Vision-Language Decision Making via Focus Plan Generation"
organization: "State Key Lab of CAD&CG, Zhejiang University; Baiont Quant; Zhejiang Key Laboratory of Intelligent Medical Decision Support"
date: "2026-06-02"
paper_url: https://arxiv.org/abs/2606.04046
code_url: https://future-item.github.io/SceneDiver
venue: "ICML 2026 (PMLR 306)"
open_source: true

model_type: vla

architecture:
  backbone: "OpenVLA-OFT base policy + SceneDiver Adapter (Slot Attention + Scene-Aware MaskNet) positioned after the visual projector in cross-modal alignment space. VLM frontend evaluated with Qwen2.5-VL-7B/32B-Instruct-AWQ, InternVL2.5-8B, gpt-4o-mini, gemini-2.5-flash, doubao-seed-1.6-flash"
  llm: "OpenVLA-OFT LLM backbone (Llama-2 7B family); SceneDiver itself is VLM-agnostic and tested with multiple open/closed-source VLMs"
  action_head: "Inherited from OpenVLA-OFT; SceneDiver Adapter inserts between projector and LLM, generating task-conditioned soft focus masks via (1) Task-Guided Slot Attention with K object-centric slots (d_s=256) initialized from task vector v_task with T=5 refinement iterations and temperature tau=0.4, and (2) Scene-Aware MaskNet that combines slot-level relevance r_k = MLP([LN(s_k); Proj(m_k); Proj(v_task)]) with per-patch residual correction Delta_l (alpha~=0, learnable scale exp(beta), beta_init=1.1). Soft modulation I_out = s * I_dim + (1-s) * B_sigma(I_dim) attenuates luminance/high-frequency on background"
  action_head_category: other
  action_space: "continuous (inherits OpenVLA-OFT 7-DoF end-effector)"
  parameters: "OpenVLA-OFT backbone (~7B class) + SceneDiver Adapter overhead ~3.01 ms / 2.64% of total 114.45 ms action generation on RTX 4090"
  key_innovation: >
    Reframes the VLA perceptual bottleneck (object hallucination, attention drift, mis-grounding) as a
    *focus plan generation* problem rather than a representation problem. Two contributions:
    (1) SceneDiver — a coarse-to-fine focus plan pipeline for VLMs: build OvSGTR scene graph -> coarse
    graph reasoning to decompose scene into sub-scenes -> fine-stage agentic exploration with three
    primitives (multi-scale verify / semantic zoom / local spatial search) -> rasterize candidate boxes
    to focus score map -> dual modulation I_out = s * I_dim + (1-s) * B_sigma(I_dim);
    (2) SceneDiver Adapter — distills this deliberate focus into a lightweight VLA adapter via
    Hungarian-matched slot/mask supervision (Structure Loss + Mask Loss) with entropy-based dynamic
    gating that falls back to raw observations under high uncertainty. Achieves 9.6% LIBERO-plus SR
    gain at only 2.64% latency overhead.

training:
  dataset: "LIBERO joint training (libero_spatial + libero_object + libero_goal + libero_long) on interference-free original LIBERO data only; OvSGTR scene-graph generator pretrained on AI2-THOR / MuJoCo synthesized RGB + instance masks + <subj,pred,obj> triples (image-topology + 3D-geometry relations)"
  method: "Two-objective distillation: Structure Loss supervises Slot Attention with Hungarian matching against scene-graph-derived objects (slot-level alignment); Mask Loss supervises the Scene-Aware MaskNet (mask-level refinement). Task-Conditional Initialization: S0_k ~ N(Proj(v_task) + delta_k, sigma). T=5 slot iterations with GRUCell update. Entropy-based dynamic gating bypasses masking when ambiguous-patch uncertainty exceeds threshold (raw observations fed to VLA for graceful degradation)"
  optimizer: "not specified (paper reports only LIBERO-OFT-compatible joint training, 3 seeds)"
  hardware: "Single NVIDIA RTX 4090 for latency profiling (10,000-step benchmark)"
  notes: "VLA trained only on clean LIBERO; LIBERO-plus interference (Layout / Camera / Initial / Background / Light) is zero-shot. Mean/P95/P99 latency of adapter modules: SlotAttention 2.18/2.30/2.33 ms, MaskNet 0.83/0.86/0.87 ms"

