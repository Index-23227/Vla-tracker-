# Paper: Aligning Multi-Trajectory Supervision with Policy Optimization for VLA Driving
# arXiv: 2608.30122

name: AMPT
full_name: "AMPT: Aligned Multi-Trajectory Policy Training (Aligning Multi-Trajectory Supervision with Policy Optimization for VLA Driving)"
organization: "Wuhan University / Dongfeng Research & Development Institute"
date: "2026-08-31"
paper_url: https://arxiv.org/abs/2608.30122
code_url: null
venue: "arXiv preprint (AAAI 2027 template)"
open_source: false

architecture:
  backbone: "InternVL3-2B VLM (reused from ReCogDrive)"
  llm: "InternVL3-2B"
  action_head: "Conditional diffusion planner (reused from ReCogDrive) that models the continuous future ego trajectory pi_theta(tau|o) conditioned on VLM latent features; single-trajectory inference without a test-time scorer or reranker"
  action_head_category: diffusion
  parameters: "Not reported in paper (InternVL3-2B backbone + diffusion planner)"
  key_innovation: "Identifies a supervision-optimization mismatch in multi-trajectory IL -> GRPO driving pipelines (high-scoring extra trajectories improve the IL checkpoint but degrade after GRPO). Three stages: (1) PC-MTS keeps scene-wise Pareto-front candidates only if they are close to rollouts of a frozen GT-only policy and locally feasible; (2) FF-PGRPO feasibility-first Pareto credit assignment with safe-reference recovery for fully infeasible groups; (3) APR adaptive Pareto-guided refinement that re-evaluates a multi-source teacher pool against the latest policy each round and distills verified local improvements with policy retention."

training:
  pipeline: "GT-only diffusion IL (200 epochs) -> PC-MTS fine-tuning of a copy of the frozen GT-only policy -> FF-PGRPO (16 rollouts per scene, 10 epochs) -> 3 rounds of APR advantage-weighted distillation"
  hardware: "8 x NVIDIA A800 GPUs"
  dataset: "NAVSIM logged demonstrations plus multi-source candidate trajectory pool"

