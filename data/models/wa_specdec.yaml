# Paper: WA-SpecDec: World-Aware Speculative Decoding for Vision-Language-Action Models
# arXiv: 2608.08725

name: WA-SpecDec
full_name: "WA-SpecDec: World-Aware Speculative Decoding for Vision-Language-Action Models"
organization: "The University of Sydney"
date: "2026-08-09"
paper_url: https://arxiv.org/abs/2608.08725
code_url: null
venue: "arXiv 2026"
open_source: false
model_type: "world-aware speculative decoding VLA (trained world-aware target + distilled draft)"

architecture:
  backbone: "Frozen VLA visual backbone + multimodal projector (OpenVLA primary target; ActionCodec and UniVLA also evaluated as targets). Frozen Wan 2.2 VAE encoder used only as a latent compressor for the World-Aware Bias path."
  llm: "Target VLA language model with trainable LoRA adapters (base VLA parameters frozen)"
  action_head: "Autoregressive discrete action-token decoding of the target VLA, accelerated by speculative decoding: a distilled lightweight draft model proposes gamma tokens from the shared world-aware prefill hidden states and the world-aware target verifies them in parallel under an unchanged relaxed acceptance rule (rho-based, KERV, or HeiSD)."
  action_head_category: autoregressive
  parameters: "Not reported; trainable parts are the WAB path (token projector, 4-layer spatial VideoEncoder, bias projector, training-only VideoHead) plus LoRA adapters on the target LLM"
  key_innovation: "World-Aware Bias (WAB) module maps a frozen Wan 2.2 VAE latent map of the current frame into world tokens, spatially aligns them to the VLA visual patch grid, and adds a per-patch bias w_t to the visual patch embeddings BEFORE prefill (no extra multimodal tokens, unchanged sequence length). WAB and the LoRA adapters are trained with the action-token objective plus a dense next-frame VAE-latent prediction loss (L = L_action + lambda*L_video, lambda=0.1); the VideoHead is discarded at inference so deployment uses only the current frame. The resulting world-aware prefill hidden states are shared by draft proposal (draft distilled by KL against the frozen world-aware target) and target verification, so the acceptance rule itself is untouched and only the target reference changes. Introduces near-contact failure (NCF): share of failed episodes whose minimum gripper-fingertip-to-object/receptacle distance drops below delta (default 2 cm)."

