eval_conditions:
  libero: "Four LIBERO suites (Spatial, Object, Goal, Long), 50 rollouts per task = 500 episodes per suite; identical task splits, rollout budget and simulator settings across all methods; target policy, verifier and decoding configuration held fixed between Standard SpecDec and WA-SpecDec."
  simpler_env: "Four SIMPLER-Env manipulation tasks (Carrot, Stack, Spoon, Eggplant) with OpenVLA and UniVLA targets; Table 3 reports percentages and Table 4 reports success fractions."
  metrics: "Task success, accepted length (draft action tokens accepted per target verification step), wall-clock speedup vs the AR target (includes draft proposal, target verification, WAB computation and cache updates), and near-contact failure NCF (share of failed episodes whose minimum gripper-fingertip-to-object/receptacle distance falls below delta=2 cm)."
  headline_claims: "1.5x matched-success speedup over VLA speculative decoding alone and 18.6% average NCF reduction relative to the corresponding speculative baselines."
  not_recorded: "Figure 3 accepted-length/success frontier curves are graphical only and are not transcribed."

training:
  method: "Two stage. (1) Train the world-aware target: minimize L = L_action + lambda*L_video (lambda=0.1) over ϕ_tok, the 4-layer spatial VideoEncoder F_omega, bias projector f_bias, training-only VideoHead g_eta, and LoRA adapter delta-theta, with the Wan 2.2 VAE encoder and base visual stack frozen. (2) Freeze the world-aware target and distill the lightweight draft model q_phi by minimizing KL against the target distribution over the same world-aware prefill hidden states."
  auxiliary_objective: "Dense next-frame VAE latent prediction MSE over the full latent grid, using the next frame only during training"
  inference: "Current frame only; VideoHead discarded, no future-frame prediction, no VAE decoding or video generation; draft proposes gamma tokens per block and the first rejected token is replaced by the target token"

