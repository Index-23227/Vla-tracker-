# Paper: Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models
# arXiv: 2608.27550

name: VLAct
full_name: "Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models"
organization: "StarVLA team (advisors: Jiaya Jia, Bei Yu, Hengshuang Zhao, Zhuotao Tian, Shu Liu, Pengguang Chen)"
date: "2026-08-27"
paper_url: https://arxiv.org/abs/2608.27550
code_url: null
venue: arXiv
open_source: true

architecture:
  backbone: "Qwen3-VL-4B, continued pre-trained on open multi-embodiment robot data (StarVLA codebase)"
  llm: "Qwen3-VL-4B"
  action_head: "Downstream: freshly initialized task-specific head (default OFT-style parallel continuous regression; GR00T-style and PI flow-matching heads also evaluated). Pre-training: OFT + PI + GR00T heads co-supervised on the shared latent"
  action_head_category: regression
  parameters: "~4B (Qwen3-VL-4B backbone) + action head"
  key_innovation: "Representation-centric VLA continued pre-training: (1) shallow-layer protection (freeze vision encoder + lower half of LLM) and caption-data mixing to preserve the VLM prior; (2) multi-head continuous action co-supervision (L = L_OFT + L_PI + L_GR00T) to avoid head-specific representation collapse; (3) partially unified cross-embodiment action layout (shared gripper dims, masked embodiment-specific arm dims) with wrap-aware loss for periodic joints. Pre-training heads discarded; downstream head re-initialized."

training:
  base_model: "Qwen3-VL-4B"
  method: "Continued pre-training (vision encoder + lower half LLM frozen) with multi-head action co-supervision and caption mixing, then full-model downstream fine-tuning with a freshly initialized action head"
  data: "Open-source robot data: DROID, InternA1, RoboCoin, MolmoAct (Franka single-arm + AgileX bimanual) + captioning data"
  hardware: "16 GPUs (continued pre-training); real-world fine-tuning 8x H800, 50k steps"

