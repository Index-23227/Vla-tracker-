name: ActionMap
full_name: "ActionMap: Robot Policy Learning via Voxel Action Heatmap"
organization: "Show Lab, National University of Singapore; NVIDIA"
date: "2026-06-10"
paper_url: https://arxiv.org/abs/2606.06904
code_url: https://showlab.github.io/ActionMap/
venue: arXiv preprint
open_source: false

architecture:
  backbone: "OpenVLA-OFT (Prismatic-7B VLM with parallel decoding) as main backbone; pi-0.5 (flow-matching VLM) as cross-backbone verification"
  action_head: "Voxel heatmap action head: pure-MLP trunk with residual connections, branches into three parallel MLPs producing (i) translation voxel heatmap (48x48x24 grid), (ii) rotation voxel heatmap over Euler angles (24x24x24 grid), and (iii) gripper open/close binary distribution. Each voxel directly stores the probability mass of the corresponding delta-action. Trained with cross-entropy against a softmax-normalized Gaussian-blob target (sigma=0.1). At inference, recovers continuous actions via top-10 soft-argmax decoding (temperature T=1.0) over the highest-logit voxels."
  action_head_category: other
  parameters: "~7B (OpenVLA-OFT backbone); heatmap head is a lightweight MLP that replaces the native L1 regression or flow-matching decoder"
  key_innovation: "First voxel-heatmap action head integrated into a large pretrained VLA. Replaces the single-point action decoder (L1 regression, autoregressive tokens, or flow matching) with a discretized probability distribution over the 7-DoF delta-action space, factored as translation + rotation + gripper grids. Trained via Gaussian-blob cross-entropy and decoded with top-k soft-argmax. Acts as a drop-in replacement that works on architecturally distinct backbones (OpenVLA-OFT L1 regression and pi-0.5 flow matching) without changing other components, revealing action representation as an under-explored design axis for VLAs."

benchmarks:
  libero:
    libero_spatial: 98.0
    libero_object: 98.8
    libero_goal: 96.8
    libero_long: 95.4
    libero_avg: 97.3
    source: "Figure 3 (top), OpenVLA-OFT + Ours at 10K steps with default soft-argmax top-10 decoder (T=1.0); +8.2% over the matched-step OpenVLA-OFT L1 regression baseline (89.1%) and +0.2% over the OFT published 50-150K result (97.1%)"
    date_reported: "2026-06-10"
    eval_condition: "fine-tuned on 4 LIBERO suites; 50 trials x 10 tasks = 500 episodes per suite at LIBERO seed 7; LoRA r=32, 10K optimizer steps, 2x H200 DDP; OpenVLA-OFT backbone with voxel heatmap head replacing L1 regression decoder"

eval_conditions:
  libero: "fine-tuned with voxel heatmap action head on OpenVLA-OFT backbone; default soft-argmax top-10 decoder (T=1.0). On pi-0.5 backbone at 30K steps, the same head reaches 98.5 LIBERO four-suite average (Fig. 3 bottom)."

training:
  data: "LIBERO 4 suites (Spatial, Object, Goal, Long), 10 tasks per suite, full-data fine-tuning. Data-efficiency studies additionally use stratified 10%, 25%, 50% subsets of LIBERO-Spatial. Real-world Franka R3 tasks (Pick 225 demos, Sweep 200 demos, Insert 275 demos) with 50-episode partial-data variants."
  hardware: "2x NVIDIA H200 GPUs (DDP, per-GPU batch 8, 4 grad-accum steps, effective batch 64)"
  duration: "10,000 optimizer steps (OpenVLA-OFT main runs); 30K steps for pi-0.5; 4,000 steps for real-world Franka"
  notes: "LoRA fine-tuning (rank 32, alpha 16) on all linear layers; AdamW at constant lr 5e-4, no warm-up, no weight decay; Gaussian-blob target sigma=0.1 in normalized [-1,1] units for both translation and rotation; cross-entropy loss summed over translation, rotation, gripper branches and all T chunk slots."

tags: [libero, openvla-oft, pi0.5, voxel-heatmap, action-head, soft-argmax, gaussian-blob, real-world-franka, data-efficiency, action-representation]
