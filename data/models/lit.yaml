# Paper: Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models
# arXiv: 2609.12641

name: LIT
full_name: "Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models"
organization: "National University of Singapore / South China University of Technology / Nanyang Technological University"
date: "2026-09-11"
paper_url: https://arxiv.org/abs/2609.12641
code_url: "https://magiclab-nus.github.io/LIT"
venue: arXiv
# open_source: Not stated in the paper (project page only)
model_type: vla

architecture:
  backbone: "Framework-agnostic; instantiated on pi0.5, MolmoAct2 (VLAs) and FAST-WAM, ImageWAM (world-action models). Headline tracker entry = MolmoAct2 + LIT (the variant used for real-robot runs and all ablations)"
  action_head: "Native flow-matching action expert of each framework, trained from scratch in Stage 1 (conditioned on language, robot state and the chunk's terminal SE(3) end-effector pose, no images), then conditioned in Stage 2 only through K=100 learnable latent tokens that cross-attend to visual and semantic backbone features layer-wise"
  action_head_category: flow_matching
  parameters: "Not stated in the paper"
  key_innovation: "Two-stage Latent Interface Training: (1) image-free spatial-goal-conditioned action-prior pretraining using the terminal SE(3) pose of each demonstrated chunk; (2) a pose-supervised latent interface (MLP decoder reconstructs the same terminal pose, lambda_pose = 0.3) that is the action expert's ONLY visual conditioning pathway, mitigating vision-action shortcuts"

training:
  base_model: "Pretrained VLM/video backbones of pi0.5, MolmoAct2, FAST-WAM, ImageWAM; action experts randomly initialized (released policy checkpoints are NOT fine-tuned)"
  method: "Stage 1: backbone frozen, action expert + SE(3) encoder trained with flow matching (10K steps on MolmoAct2). Stage 2: full fine-tuning of backbone, action expert, latent tokens/interface and pose decoder with L_act + 0.3 L_pose (20K steps on MolmoAct2); total budget matched to the baseline (30K)"
  data: "Original LIBERO demonstrations only (LIBERO-Plus evaluated zero-shot); real robot: 300 demonstrations (100 per task) for one multi-task policy"
  hardware: "Not stated in the paper"

