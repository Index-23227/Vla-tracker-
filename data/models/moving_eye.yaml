model_type: data_strategy

architecture:
  backbone: "Gr00t N1 (primary policy); strategy also validated on ACT, Diffusion Policy, and Pi0 (pi0.5)"
  action_head: "Flow-matching action head of the primary Gr00t N1 policy; the contribution is a policy-agnostic data collection strategy, not a new head"
  action_head_category: flow_matching
  action_space: "continuous manipulation actions (So-101 arm, wrist camera + mobile environmental camera observations)"
  key_innovation: >
    Hybrid Dynamic Data Collection: a data-centric strategy to break shortcut learning
    (Camera-Base, Camera-Object, and Object-Position couplings) in VLA spatial
    generalization. A dual-arm setup uses one arm (So-101, wrist camera) for
    manipulation while a second arm (Airbot) moves an environmental camera as a
    "moving eye". Three camera configurations are defined (Fixed, Multi-Fixed,
    Moving View); episodes are mixed at ratio Moving:Multi-Fixed = 1:k (k=3, the
    "Golden Ratio" for Gr00t) with multi-dimensional diversity injection (randomized
    object-receptacle relative poses). Pure Moving data fails to converge (54.8%),
    pure Multi-Fixed reaches 80.5%, and the 1:3 mix peaks at 89.0% on the Moving
    Test. The strategy is universal across architectures (ACT +8.1, Diffusion +26.8
    at 1:1, Pi0 +13.8 at 1:11, Gr00t +8.5 at 1:3) and transfers: mixing auxiliary
    moving-view pen data into fixed-view multi-task training lifts Moving-Test
    success from 43% to 83% at 2400 episodes.

benchmarks: {}

eval_conditions:
  real_world: "So-101 arm + Airbot-controlled environmental camera (WowRobo 2MP USB, 640x480, 30 FPS); pen pick-and-place (400 eval episodes) and 5-object multi-task (100 episodes); 40 fixed camera moving trajectories (Moving Test), 40 static poses (Multi-Fixed Test), 5 target-container relative positions, 8 pen orientations"
  shortcut_tests: "Exp.1 Camera-Base coupling: Fixed baseline 85.0 ID vs 43.0 OOD (moving camera), Ours 86.0/83.0. Exp.2 Object-Position coupling: Multi-Fixed baseline 95.0 ID vs 71.9 OOD (holder shifted one diameter), Ours (1:3 mix) 91.9/90.6"

training:
  base_model: "Gr00t N1 (also ACT, Diffusion Policy, Pi0)"
  dataset: "Real-world teleoperated episodes via LeRobot SO-101 pipeline, recorded as continuous 30 FPS MP4; Moving View camera at 0.05 m/s linear speed (mean angular 0.198 rad/s, max 0.419 rad/s); pen task 2400 episodes, multi-task 2400 episodes"
  method: "Episode-level sampling: with prob 1/(k+1) collect Moving View (continuous camera trajectory), else Multi-Fixed View (random static pose per group); object configuration randomized every episode"
  hardware: "8x NVIDIA H800 GPUs; pen task ~34-37 h, multi-task ~14 h"
  learning_rate: "1e-4, cosine decay"
  batch_size: 4

