full_name: "The Moving Eye: Enhancing VLA Spatial Generalization via Hybrid Dynamic Data Collection"
organization: "Lion Rock AI Lab, China Merchants Research Institute of Advanced Technology; The Hong Kong University of Science and Technology; Nankai University"
date: "2026-07-02"
