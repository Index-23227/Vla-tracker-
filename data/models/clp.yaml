name: CLP
full_name: "CLP: CKA-guided Layer Pruning — Finetuning Vision-Language-Action Models Requires Fewer Layers Than You Think"
organization: "VinUniversity / VinRobotics / DFKI"
date: "2026-06-20"
paper_url: https://arxiv.org/abs/2606.20246
code_url: null
venue: "arXiv preprint 2026 (project: https://clpvla.github.io)"
open_source: false

architecture:
  backbone: "N/A (calibration-based static layer-pruning pipeline applied to existing VLA backbones — validated on pi0 (PaliGemma + flow-matching), GR00T-N1.5 (Eagle VLM + DiT action head), SmolVLA (SmolVLM2 + flow-matching))"
  llm: "N/A (inherits LLM of host VLA)"
  action_head: "N/A (pruning method preserves the native action head — flow matching for pi0/SmolVLA, DiT for GR00T-N1.5)"
  action_head_category: other
  parameters: "pi0-CLP 2.7B (-22.9%); GR00T-N1.5-CLP 2.0B (-25.9%); SmolVLA-CLP 354M (-21.3%)"
  key_innovation: "Single-forward-pass training-free structural pruning of redundant transformer layers in modern continuous-control VLAs. Uses Centered Kernel Alignment (CKA) between consecutive layer hidden states to detect contiguous high-similarity blocks; retains anchor layer of each block and removes the rest before fine-tuning. Permanently truncates VLM backbone and action head depth by up to 50% with no auxiliary routing, distillation, or early-exit modules. Cuts trainable parameters 25.8–37.0%, training time 27.8–64.3%, GFLOPs up to 49.3%, and inference latency 27.9–31.8% while matching or exceeding full-scale base policies. Acts as an implicit regularizer in low-data regimes (e.g., +6.9%p on 10% LIBERO)."

