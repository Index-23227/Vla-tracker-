eval_conditions:
  libero: "Full LIBERO 4-suite fine-tuning with pi0 backbone, 60k steps, eval over 50 episodes/task with 10-step execution length"
  simpler_env: "GR00T-N1.5 backbone fine-tuned on Bridge dataset, single H100, batch 32, 200k steps, 50 episodes/task, 8-step execution"
  robocasa: "pi0 backbone fine-tuned on 30-demo subset of 5 RoboCasa tasks (PnPCabToCounter, PnPCounterToCab, SetUpCoffeeMug, TurnOffStove, TurnOnMicrowave), 4xH100, batch 48"
  real_world: "10 tasks across UR10, UR5, single-arm ALOHA, bimanual ALOHA — GR00T-N1.5-CLP avg 75.9% vs GR00T-N1.5 baseline 73.5% (Table 4)"

training:
  dataset: "LIBERO (full + 10% subset), RoboCasa (30 and 100 demos from 5 tasks), SimplerEnv Bridge, plus 10 real-world tasks (UR10/UR5/ALOHA single+bimanual)"
  method: "CKA-guided static layer pruning. (1) Calibration set Dcal sampled from training episodes; (2) single forward pass extracts hidden states H_l per layer of target module M; (3) compute CKA(H_{l-1}, H_l) for consecutive layers; (4) group layers with CKA >= tau into contiguous blocks B; (5) retain anchor (first) layer per block, pool remainder into candidate set P_M; (6) remove top-k most redundant layers (RemoveLayers). Applied independently to VLM backbone and action head. Specific configs (Table 5): pi0 prunes 12/18 layers (indices 1,2,4,6,8,9 in shared VLM+action expert); GR00T-N1.5 prunes 3/4 VL-self-attention + 8/16 DiT layers; SmolVLA prunes 10/16 (indices 1,2,5,6,14,15). Then fine-tune under native objective (flow-matching loss for pi0/SmolVLA, DiT objective for GR00T-N1.5)."
  num_trajectories: null
  compute: "pi0-CLP 11.2h training (-27.8%), 4 GPUs; GR00T-N1.5-CLP 7.4h (-30.8%), 1xH100; SmolVLA-CLP 8.83h (-64.3%). Real-world up to 1.94x faster training. Inference on RTX 4070: pi0-CLP 152ms (-27.9%), GR00T-N1.5-CLP 85ms (-29.8%), SmolVLA-CLP 137ms (-31.8%)"

inference_hz: 12

