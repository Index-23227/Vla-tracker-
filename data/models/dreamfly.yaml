    full_osr: 46.77
    full_spl: 27.17
    source: "Table 3 (Ablation study of different experimental settings)"
    eval_condition: "progressive and leave-one-out ablation; the full-model row (SR 31.46 / NE 44.97m / SPL 27.17) differs slightly from the Table 2 headline numbers reported by the authors"
  openfly_litestop_threshold_pilot:
    tau_0_50_sr: 26.6
    tau_0_50_spl: 22.9
