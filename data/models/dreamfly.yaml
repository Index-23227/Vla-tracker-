    eval_condition: "64-trajectory balanced calibration set (8 per environment), disjoint from the final evaluation split, using the step-500 LiteStop checkpoint; tau_stop = 0.50 selected (45/64 episodes terminated by LiteStop)"

training:
  datasets: ["OpenFly (standardized: 20 subsets, 85,785 trajectories, 1,356,622 decision steps; pre-packaged historical keyframes removed, ~190,000 non-standard action labels remapped)"]
  method: "Staged training. Stage 1: Dream-VLA backbone fine-tuned with all-linear LoRA (r=32, alpha=16) jointly with the memory-fusion adapter while the base projector and the memory-construction routers stay frozen; horizon-aware masked action objective with CAR context reweighting (p=0.1) and horizon decay gamma=0.7; AdamW, lr 1e-4, batch size 8, up to 10,000 steps with the step-5,000 checkpoint used for evaluation. Stage 2: the complete navigation policy is frozen and only LiteStop is optimized with a weighted BCE (positive weight 4.0)."

eval_conditions:
  openfly: "closed-loop simulation only (AirSim / Unreal Engine); no physical UAV deployment"

tags: [aerial_vln, uav, navigation, discrete_diffusion, action_chunking, memory, receding_horizon, openfly, dream_vla, lora]
