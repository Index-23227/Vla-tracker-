name: DreamFly
full_name: "DreamFly: Causal Memory and Receding-Horizon Diffusion Planning for Aerial Vision-Language Navigation"
organization: "Xi'an Technological University"
date: "2026-08-12"
paper_url: https://arxiv.org/abs/2608.12308
code_url: null
venue: null
open_source: false
model_type: aerial_vln

architecture:
  backbone: "Dream-VLA (discrete diffusion language model backbone with bidirectional attention); frozen CLIPSeg dense router + frozen OWLv2 region router for instruction-conditioned memory candidate extraction"
  llm: "Dream-VLA / Dream-VL diffusion LLM backbone (arXiv:2512.22615)"
  action_head: "Bidirectional discrete diffusion over K=4 dedicated action tokens (plan-K, execute-one receding-horizon chunk), plus LiteStop, an LN+MLP head mapping the initial all-mask K x |A| action-logit grid to a scalar stop logit"
  action_head_category: discrete_diffusion
  parameters: null
  key_innovation: "Three components on top of Dream-VLA: (1) causally aligned historical memory with 16 long-term 512-d slots under a read-before-write protocol, fused into current visual tokens by zero-initialized gated cross-attention (dim 512, 8 heads); (2) receding-horizon discrete diffusion planning that jointly predicts a K-step action chunk with valid-prefix supervision and horizon decay gamma=0.7, executing only the first action before replanning; (3) LiteStop, a decoupled termination head trained with the navigation policy frozen (positive class weight 4.0) that estimates stop probability from the initial all-mask action logits."

benchmarks:
  openfly:
    test_seen_ne: 44.87
    test_seen_sr: 32.04
    test_seen_osr: 46.77
    test_seen_spl: 28.22
    test_unseen_ne: 45.29
    test_unseen_sr: 29.46
    test_unseen_osr: 46.78
    test_unseen_spl: 23.54
    source: "Table 2 (Performance comparison on the seen and unseen splits)"
    eval_condition: "closed-loop AirSim/UE rollouts on OpenFly; 1,392 test-seen trajectories (UE BigCity + 6 AirSim urban scenes) and 404 test-unseen trajectories (UE SmallCity); success radius 20 m; 12 discrete diffusion steps; tau_stop = 0.50"
  openfly_ablation:
    dream_vla_baseline_sr: 21.55
    dream_vla_baseline_ne: 67.82
    dream_vla_baseline_osr: 42.32
    dream_vla_baseline_spl: 16.09
