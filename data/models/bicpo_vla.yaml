# Paper: BICPO-VLA: Behavior-Identified Continuation Preference Optimization for Smooth Asynchronous Vision-Language-Action Control
# arXiv: 2608.13924

name: BICPO-VLA
full_name: "BICPO-VLA: Behavior-Identified Continuation Preference Optimization for Smooth Asynchronous Vision-Language-Action Control"
organization: "Beihang University; Beijing Institute of Technology; CASIA; BUPT; Hunan University; Peking University; Tsinghua University"
date: "2026-08-14"
paper_url: https://arxiv.org/abs/2608.13924
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "VLM backbone with Vision Mamba / instruction-aware visual routing (visual tokens cross-attend to language before history fusion), causal Mamba history encoder with behavior memory bank and phase-conditioned prior decoder (builds on BehaviorVLA / B-VLA)"
  action_head: "Handoff-conditioned Haar-structured flow-matching action expert: a one-level orthogonal Haar transform splits each action chunk into a pairwise scaffold C and residual D, generated sequentially (scaffold then residual, shared expert with stage embeddings) and reconstructed exactly; conditioned on a behavior prior and a rolled handoff state from a frozen action-state model"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "Not reported"
  key_innovation: "Addresses the request-to-handoff gap in asynchronous action chunking. (1) Instruction-grounded behavior identification; (2) Haar scaffold-residual realization with exact reconstruction; (3) BICPO: offline reference-relative Flow-DPO over same-behavior candidate pairs ranked by handoff jump and motion-trend mismatch after rolling known outgoing commands to the handoff state, with the semantic pathway frozen. The continuation DPO objective also transfers to pi0.5 flow matching, Legato and RTC."

training:
  method: "Imitation learning, continuation warm-up with L_struct, then offline Flow-DPO (L_pref + preferred-energy term + replay); only the continuation projector, W_g and selected expert parameters are updated in DPO"

