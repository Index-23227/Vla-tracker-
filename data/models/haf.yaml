name: HAF
full_name: "HAF: Adapting Generalist VLAs to Humanoid Whole-Body Loco-manipulation via Hierarchical Action Flow and Spectral Latent RL"
organization: "Peking University; Beijing Innovation Center of Humanoid Robotics; Nankai University; Xi'an Jiaotong University"
date: "2026-08-17"
paper_url: https://arxiv.org/abs/2608.16837
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "pi0.5 (pretrained generalist flow-matching VLA; VLM expert + shared action expert)"
  action_head: "Hierarchical action flow: one shared flow-matching action expert run in three sequential stages (locomotion+head -> +waist -> +arms) over nested cumulative action sets, with trainable stage embeddings and cross-stage KV caches of re-encoded clean actions; 10 denoising steps per stage, horizon H=100, first 40 steps executed; optional HAF-Steer SAC actor over top-8 DCT coefficients of the initial flow noise"
  action_head_category: flow_matching
  parameters: "pi0.5-scale VLA (parameter count not stated); HAF-Steer trains only a small spectral actor + twin critics with the VLA frozen"
  key_innovation: "HAF-VLA restructures whole-body humanoid action generation along the kinematic chain: base/head first, then waist, then bimanual arms, each stage conditioned on the vision-language prefix cache and the clean-action KV caches of earlier stages (teacher-forced during training, stage-wise masked flow-matching loss summed over stages). HAF-Steer adapts the frozen flow VLA by numerically reversing the flow to recover demo noise, keeping the first 8 temporal DCT coefficients, BC-initializing a spectral actor and refining it with mixed offline-online SAC + BC regularization."

