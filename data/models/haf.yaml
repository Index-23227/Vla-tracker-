training:
  datasets: ["120 teleoperated trajectories per task on TienKung 2.0 / 3.0 (IMU head, kinematic master arms, joystick legs/waist)"]
  method: "HAF-VLA: fine-tune pi0.5 with a stage-wise masked flow-matching loss (three stages, shared action expert, teacher-forced cross-stage caches, trainable stage embeddings). HAF-Steer: frozen VLA; flow reversal + DCT top-8 spectral action space, BC initialization then mixed offline-online SAC with BC regularization on the real robot"

eval_conditions:
  real_world: "seven real-world humanoid loco-manipulation tasks on TienKung 2.0/3.0; average normalized milestone score over 10 rollouts per task; HAF-Steer results (Figure 8) are reported only in a figure and not recorded here"

tags: [humanoid, whole_body, loco_manipulation, flow_matching, hierarchical_action_generation, latent_rl, sac, noise_steering, dct, pi05, real_robot]
