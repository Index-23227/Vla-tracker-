# Paper: DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA
# arXiv: 2608.28108

name: DeicticVLA
full_name: "DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA"
organization: "The University of Osaka"
date: "2026-08-28"
paper_url: https://arxiv.org/abs/2608.28108
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "pi0 (pretrained VLA, all parameters fine-tuned); deictic masks from user clicks grounded by SAM 2 (sam2.1-hiera-tiny, ~30 Hz tracking on RTX 4090) are injected either as RGB visual prompts (VP-BBox red bounding box, VP-Fade gray fade outside mask) or as a separate-channel mask prompt (bias-free patch embedding added to image embeddings before (MP-Early) or after (MP-Late) the visual encoder, Alpha-CLIP style)"
  action_head: "pi0 flow-matching action expert (unchanged action space and training objective), outputs action chunks"
  action_head_category: flow_matching
  action_space: continuous
  key_innovation: "Instruction canonicalization maps Language Instruction (LI), Vision-Language Instruction (VLI, language + click) and Visual Instruction (VI, click only, fixed prompt 'follow visual instruction') into one text prompt + deictic mask representation so a single fine-tuned VLA supports all three modes; zero mask for LI leaves visual input unchanged. Two-stage training (LI-only first, then joint LI+VLI+VI) with matched total steps; controlled comparison of four mask-conditioning methods."

training:
  dataset: "Simulation: LIBERO-Object (10 tasks), LIBERO-Spatial (9 of 10 tasks), LIBERO-Goal (6 'put A B' tasks), 50 demos per task, each demo turned into LI/VLI/VI variants with ground-truth instance-segmentation masks. Real world: 360 GELLO teleoperation episodes (~97k timesteps) on UR5e + Robotiq 2F-85 (PickBlock 100, PutBlock 110, OrganizeToy 150)"
  method: "Full-parameter fine-tuning of pi0. 2S: 30k steps on LI data, then 30k steps on LI+VLI+VI (sim); 15k + 15k steps (real). Ablations: 1S (60k joint) and 2S-NoLI (second stage without LI). AdamW, cosine LR 2.5e-5 -> 2.5e-6, batch 32, EMA 0.99, 2x A100"

