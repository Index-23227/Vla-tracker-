name: LaMem-VLA
full_name: "LaMem-VLA: Dual Latent Memory in Vision-Language-Action Models for Robotic Manipulation"
organization: "Nanjing University of Science and Technology / Zhejiang University / National University of Singapore"
date: "2026-07-08"
paper_url: https://arxiv.org/abs/2607.07608
venue: null
open_source: false  # project page announced ("will be available"), no code released yet
model_type: "latent-memory-native VLA (dual short/long-term memory vaults woven into VLA reasoning)"

architecture:
  backbone: "Prismatic VLM 7B (DINOv2 + SigLIP vision encoders), pretrained on Open X-Embodiment"
  llm: "LLaMA-7B"
  action_head: "diffusion-based action expert (DiT, ~300M params, DDIM 10 steps), conditioned on memory-grounded action tokens"
  action_head_category: diffusion
  action_space: continuous
  parameters: "7B (VLM backbone) + ~300M (diffusion action expert)"
  key_innovation: >-
    Latent-memory-native framework that stores, retrieves, and consumes historical experience
    entirely in the VLA's continuous embedding space instead of an external policy-side memory bank.
    Four coordinated modules: a curator organizing history into a short-term visual vault (key-value,
    SE-bottleneck compressed visual tokens) and a long-term semantic vault (action hidden states,
    capacity L=16 with adjacent-pair merging); a seeker retrieving top-K=8 units per vault via a
    context-aware query built from the current multimodal cognition; a condenser reconstructing
    retrieved evidence into fixed-length latent memory tokens (Ls=8 short-term, Ll=4 long-term);
    and a weaver prepending them to the VLA input sequence before action queries are resolved,
    so memory participates in the same self-attention reasoning as observation and instruction.

