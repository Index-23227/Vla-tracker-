# Paper: SimpleMemVLA: A Simple but Effective Native-Video Memory for Vision-Language-Action Models
# arXiv: 2609.05533

name: SimpleMemVLA
full_name: "SimpleMemVLA: A Simple but Effective Native-Video Memory for Vision-Language-Action Models"
organization: "HUST; Renmin University of China; Tsinghua University; Peking University; ModelBest (OpenBMB); BAAI; Zhongguancun Academy"
date: "2026-09-02"
paper_url: https://arxiv.org/abs/2609.05533
code_url: https://github.com/OpenBMB/SimpleMemVLA
venue: arXiv preprint
open_source: true
model_type: vla

architecture:
  backbone: "Qwen3.5-4B VLM (native video interface with plaintext timestamps); head-camera history enters as timestamped video, current wrist views as images"
  llm: "Qwen3.5-4B"
  action_head: "DiT-style flow-matching action expert conditioned only on the hidden states + token embeddings of a backbone-generated one-sentence sub-task span, plus a single proprioception token; few Euler steps; action chunk H=16-30"
  action_head_category: flow_matching
  parameters: "Qwen3.5-4B backbone + DiT flow-matching expert (expert size not stated)"
  key_innovation: >
    No dedicated memory module: sampled visual history (e.g. 60 s at 2 fps = 120 frames, ~5.6k tokens)
    is fed intact to the VLM through its native video channel with plaintext timestamps, avoiding
    "write-time commitment" of retrieval / compression / recurrent memories. The backbone generates a
    sub-task sentence whose contextual hidden states are the only path from history to the action
    expert. Streaming prefix prefill of the shared history during chunk execution cuts decision
    latency from 1.02 s to 0.68 s (single-frame model ~0.65 s) on one H100.

training:
  method: "Joint loss L = lambda_sub * CE(sub-task span, teacher-forced VLM-annotated sub-task labels) + lambda_act * flow-matching action loss; one model per simulation suite"
  optimizer: "AdamW, LR 1e-5 (backbone) / 5e-5 (action head), cosine decay, gradient clipping"
  hardware: "128 H100 GPUs; 14-28 h wall-clock per suite (Table 8)"
  real_robot_data: "180 demos (Cover Blocks) and 308 demos (Put Back Block) on a dual-arm Piper robot"

