# Paper: FoMoVLA: Bridging Visual Foresight and Motion Guidance for Vision-Language-Action Models
# arXiv: 2607.14739

name: FoMoVLA
full_name: "FoMoVLA: Bridging Visual Foresight and Motion Guidance for Vision-Language-Action Models"
organization: "LiAuto / University of Chinese Academy of Sciences / Tsinghua University"
date: "2026-07-16"
paper_url: https://arxiv.org/abs/2607.14739
code_url: null
venue: null
open_source: false

architecture:
  backbone: "StarVLA-GR00T (Ye et al. 2026); 224x224 input, ViT patch 16 -> 14x14 map compressed by spatial merger to 8x8 = 64 image tokens (M=N=64)"
  llm: "VLM backbone of StarVLA-GR00T"
  action_head: "Conditional flow-matching DiT action head; DiT velocity field v_theta(x_tau, tau, c) integrated from tau=0 to 1 to recover action chunk (T=8 LIBERO, T=16 RoboCasa)"
  action_head_category: flow_matching
  parameters: "~4.6B (inference 4599.3M identical to Vanilla baseline; training 4660.0M incl. +60.7M/+1.3% auxiliary branches discarded at inference)"
  key_innovation: "Training-only framework that augments VLA latent representations with explicit spatio-temporal supervision by jointly learning (1) compact future feature foresight via K=16 learnable <Foresight> tokens supervised by an EMA teacher (MAE decoder, cosine loss) and (2) sparse 2D point tracking from image-token hidden states supervised by a frozen CoTracker-v3 teacher. A zero-initialized future-conditioned cross-attention module (FCCA) couples the two objectives by conditioning motion prediction on the predicted future state, enforcing consistency between anticipated visual states and geometric motion. All auxiliary branches are discarded at inference (+9.4ms latency, +0.1GB GPU only)."

benchmarks:
  libero:
    libero_spatial: 98.4
    libero_object: 99.6
    libero_goal: 99.4
    libero_long: 97.6
    source: "arXiv:2607.14739 Table 1 (full model: + Future Prediction + Tracking + FCCA; 20 rollouts/task, T=8; average 98.8)"
    eval_condition: "fine-tuned single policy over 4 LIBERO suites; StarVLA-GR00T backbone; auxiliary foresight/tracking branches used only during training"
  robocasa:
    robocasa_avg: 56.9
    source: "arXiv:2607.14739 Table 3 (RoboCasa GR-1 Tabletop, 24 tasks, 50 rollouts/task; +9.1 over StarVLA-GR00T backbone 47.8)"
    eval_condition: "fine-tuned on GR-1 humanoid egocentric tabletop pick-place, 1000 demos/task, T=16"

eval_conditions:
  libero: "fine-tuned"
  robocasa: "fine-tuned"

training:
  dataset: "LIBERO (4 suites, 10 tasks each, 50 demos/task); RoboCasa GR-1 Tabletop (24 tasks, 1000 demos/task = 24000)"
  method: "Joint action flow-matching loss + auxiliary foresight (EMA teacher, MAE decoder, cosine loss, lambda1=0.1) + point tracking (displacement + visibility + smoothness, lambda2=0.3) coupled via FCCA; frozen CoTracker-v3 tracker teacher; EMA teacher momentum mu=0.999; instruction tokens reordered before image tokens for goal-aware conditioning"
  num_trajectories: null
  compute: "8x H20 GPUs, DeepSpeed ZeRO-2, AdamW; LIBERO 30K steps batch 12, RoboCasa 100K steps batch 8"

