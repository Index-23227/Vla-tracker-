# Paper: DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination
# arXiv: 2609.09119

name: DeCAL
full_name: "DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination"
organization: "Peking University / Beijing Academy of Artificial Intelligence (BAAI)"
date: "2026-09-08"
paper_url: https://arxiv.org/abs/2609.09119
code_url: null
venue: arXiv
open_source: false
model_type: "Visuo-tactile dexterous VLA with Mixture-of-Transformers (understanding / generation / action experts)"
inference_hz: 30

architecture:
  backbone: "Qwen3-VL understanding expert; Qwen3 generation and action experts (MoT, initialized from InternVLA-A1-3B)"
  action_head: "Factorized Flow Matching action expert (separate noise/tokens for arm and hand actions, jointly processed), action chunk length 50"
  action_head_category: flow_matching
  parameters: "~3B (initialized from InternVLA-A1-3B)"
  key_innovation: "Adaptive Visuo-Tactile Fusion (per-block tactile cross-attention gated by a global contact token) + Visuo-Tactile Latent Co-Imagination (generation expert jointly predicts future Cosmos-VAE visual latents and tactile latents decoded to raw tactile image / deform map / 6-DoF force) + Factorized Flow Matching for arm-hand decoupling; blockwise understanding -> generation -> action attention."

training:
  base_model: "InternVLA-A1-3B"
  method: "Full training from pretrained weights with L = lambda_v L_visual + lambda_t L_tactile + L_action; AdamW 5e-5, 100k steps"
  data: "100 teleoperated demos per task (MetaGlove Pro + VIVE trackers), 6 contact-rich dexterous tasks"
  hardware: "8x NVIDIA H100 (training); single RTX 4090 inference, 0.27 s per action chunk"

benchmarks:
  real_world:
    wipe_vase: 100.0
    erase_whiteboard: 80.0
    assemble_parts: 65.0
    twist_cap: 80.0
    pipetting: 60.0
    screw_light_bulb: 40.0
    success_rate_avg: 71.0
    source: "Paper Table 1, DeCAL (Ours) SR columns; average 71% stated in Abstract"
    date_reported: "2026-09-08"
    eval_condition: "dual UR5 + two 22-DoF SharpaWave hands with fingertip visuo-tactile sensors, 20 trials per task"

  real_world_progress_rate:
    wipe_vase: 100.0
    erase_whiteboard: 86.7
    assemble_parts: 85.0
    twist_cap: 93.3
    pipetting: 86.3
    screw_light_bulb: 48.8
    psr_avg: 83.4
    source: "Paper Table 1, DeCAL (Ours) PSR columns; average 83.4% stated in Abstract"
