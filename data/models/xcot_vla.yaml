training:
  data: "Large-scale hybrid corpus of ~3,620,000 unique samples: General SFT 3,100,000 (automatic Reason-Action labeling of logged driving data), Human-Annotated 200,000 (human Reason-Action supervision for ambiguous interactive scenarios), Targeted Lane-Change 320,000 (rule-based XCoT labeling mined for lateral planning)"
  stage_1_sft: "Supervised Reason-Action training on the full mixed dataset, jointly training the Reason FFN and the Control FFN. Loss L_SFT = lambda_XCoT * L_XCoT + lambda_FM * L_FM, where L_XCoT is token cross-entropy over the offline XCoT label sequence (padding masked, EOS supervised) and L_FM is the conditional flow-matching loss E||v_theta(x_alpha; alpha, c) - (x1 - x0)||^2 with x_alpha = (1 - alpha) x0 + alpha x1, x0 ~ N(0, I_48). lambda_XCoT = 1 and lambda_FM tuned on a validation split. The trajectory decoder is teacher-forced on the XCoT labels z* during training and conditioned on the predicted sequence z-hat at inference."
  stage_2_xcpo: "XCoT Policy Optimization, an optional refinement applied to a subset of safety-critical and complex interaction scenarios. The visual encoder, shared self-attention, Control FFN and flow-matching trajectory head are frozen (theta_exec^frozen); only the Reason FFN and XCoT prediction head (theta_reason) are updated. A group of G XCoT sequences is sampled per observation and decoded by the frozen executor; group-relative advantages A_i = (R_i - mu_R) / (sigma_R + eps) are computed from a weighted reward R_i = sum_k w_k r_k(tau_i), and a clipped sequence-level GRPO-style objective plus a KL term to the Stage-I reference policy is optimized. Gradients flow only through the autoregressive XCoT log-probabilities."
  optimizer: "AdamW; peak learning rate 4e-5 for Stage I and 1e-4 for Stage II"
  horizon: "Prediction horizon 6 s with H = 24 future motion steps; action evidence extracted over a -3 s to +6 s logged window"
  note: "XCPO is explicitly NOT quantitatively evaluated in this version of the paper; the authors state its benefits should be assessed with closed-loop metrics (route completion, collisions, rule violations, interventions, comfort)"

eval_conditions:
  general_set: "In-house general-distribution open-loop planning set; directional ADE/FDE reported separately for longitudinal (x) and lateral (y) axes in an ego-centric route-aligned coordinate frame, full 6 s horizon"
  lane_change_set: "In-house lane-change open-loop evaluation set targeting route-conditioned lateral decisions"
  lane_change_diagnostic_split: "Separate controlled lane-change diagnostic split used only for Table 5; the paper warns it is not numerically comparable with Table 4"
  latency: "Worst-case reasoning-interface latency profiled on a single NVIDIA H100 against a 12 Hz (83.3 ms) planning budget"
  closed_loop: "No closed-loop simulation or public benchmark (nuScenes / NAVSIM) results are reported; all quantitative results use proprietary open-loop sets"

