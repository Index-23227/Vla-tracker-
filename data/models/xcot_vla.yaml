architecture:
  backbone: "VLM backbone consuming camera observations, task prompt, ego status (velocity, acceleration, history trajectory) and high-level drive command; N x Transformer blocks with shared multimodal self-attention followed by deterministic token-function routing into two FFN branches (Reason FFN / Control FFN). Specific vision encoder and LLM sizes are not disclosed in the paper."
  llm: null
  action_head: "Flow-matching trajectory decoder (Conditional Flow Matching, inspired by pi0) over 24 fixed learnable trajectory queries Q_traj in R^{24xd}; each query decodes one future step as (longitudinal acceleration a_lon, yaw change delta-psi), giving u_t in R^{24x2} (x1 = vec(u_t) in R^48). A parameter-free temporal integration operator I_traj(u_t; s_t) converts the motion sequence into ego-centric coordinates tau_t in R^{24x2} over a 6 s horizon (H = 24)."
  action_head_category: flow_matching
  action_space: "continuous 24-step future motion sequence (longitudinal acceleration, yaw change), temporally integrated to a 6 s ego-centric (x, y) trajectory"
  parameters: null
  key_innovation: "Executable Chain-of-Thought (XCoT): verbose natural-language rationales are replaced by a canonical sequence of only 2-6 executable semantic-action tokens (KEEP_SPEED, DECELERATE, LANE_KEEPING, NAV_LEFT_LANE_CHANGE, EFFICIENCY_LEFT_LANE_CHANGE, LEFT_TURN_PREPARE, LEFT_TURN, RED_LIGHT_HOLD, LEFT_OVERTAKE, VISIBILITY_CAUTION, HAZARD_YIELD, ...) plus EOS, with M_max = 6. Labels are built offline by a Reason-Action pipeline: (o_t, tau_t) -> f_act -> a_t -> f_ground -> (r*_t, a_t) -> g_XCoT -> z*_t, where the logged -3s..+6s trajectory supplies longitudinal/lateral action evidence and scene context supplies the causal reason (navigation, road structure, traffic rule, interaction, safety); vision-language experts are queried only offline and their free-form text is mapped to a taxonomy signature, with a consensus score S_cons selecting the causal reason. At inference the predicted XCoT sequence stays in context and conditions the fixed trajectory queries through shared self-attention, while deterministic (router-free, non-MoE) token-function routing sends all valid non-trajectory tokens to the Reason FFN and only the 24 trajectory queries to the Control FFN, with disjoint masks m_Reason + m_Control = 1."

