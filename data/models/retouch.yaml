  wo_future_tactile_prediction_avg: 67.6
  non_blocking_joint_refinement_avg: 75.8
  wo_tactile_patch_encoder_avg: 69.1
  source: "Table 3 — average success rate (%) over the seven tasks. Deltas from the full model: -23.6, -15.2, -16.0, -7.8, -14.5 respectively. The 0.8-point gap between 'w/o tactile-prediction refinement' (68.4) and 'w/o future tactile prediction' (67.6) indicates a fixed one-shot tactile forecast adds little on its own."
