  object_position_shift_cob_grasp: 98.5
  lighting_change_liquid_transfer: 66.5
  pulling_disturbance_bottle_grasp: 85.0
  ood_avg: 73.1
  source: "Table 2 — out-of-distribution generalization and disturbance robustness (%). Baselines: pi0.5 + tactile 49.3 (strongest, +23.8 for ReTouch), pi0.5 47.1, Tactile-VLA 35.0, RDP 10.0, ViTacFormer 7.8. Largest gain is the post-grasp pulling disturbance (85.0 vs 55.0 best baseline, +30.0)."
  date_reported: "2026-08-03"
  eval_condition: "20 rollouts per challenging setting; Sponge Wipe at held-out heights 2.5 and 5 cm (training heights 7.5/9/10.5 cm); Cob Grasp at held-out positions outside the training region; Liquid Transfer under projector-generated dynamic illumination; Bottle Grasp with a downward pull after stable lift, followed by autonomous grasp recovery"

