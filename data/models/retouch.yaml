# Paper: ReTouch: Empowering Contact-Rich Dexterous Manipulation with Online-Refined Tactile Prediction
# arXiv: 2608.01824v1 (3 Aug 2026) — verified against PDF

name: ReTouch
full_name: "ReTouch: Empowering Contact-Rich Dexterous Manipulation with Online-Refined Tactile Prediction"
organization: "University of Science and Technology of China; iFLYTEK; The Chinese University of Hong Kong"
date: "2026-08-03"
paper_url: https://arxiv.org/abs/2608.01824
code_url: null
