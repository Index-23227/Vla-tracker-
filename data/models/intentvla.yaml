# Paper: IntentVLA: Short-Horizon Intent Modeling for Aliased Robot Manipulation
# arXiv: 2605.14712

name: IntentVLA
full_name: "IntentVLA: Short-Horizon Intent Modeling for Aliased Robot Manipulation"
organization: "Huazhong University of Science and Technology (HUST), Zhongguancun Academy (Beijing), Zhongguancun Computing Institute, Harbin Institute of Technology, HKUST(GZ), BUAA, Zhejiang Normal University, East China Normal University, USTC, DeepCybo"
date: "2026-05-14"
paper_url: https://arxiv.org/abs/2605.14712
code_url: https://github.com/ZGC-EmbodyAI/IntentVLA
venue: null
open_source: true

architecture:
  action_head: "DiT-based flow-matching action chunk head conditioned on a short-horizon intent representation. Recent visual observations are encoded by a frozen VGGT-1B (camera + register tokens retained), then fused with the current Qwen3-VL 4B context via gated cross-attention to form the intent condition. Conditional flow-matching loss L_flow = E[||V_hat(X_s, s | C_t) - (tau_t - eps)||_2^2]."
  action_head_category: flow_matching
  backbone: "Qwen3-VL 4B (current context) + VGGT-1B (frozen, history encoder)"
  parameters: "~5B total (Qwen3-VL 4B trainable + VGGT-1B frozen)"
  key_innovation: "IntentVLA is a history-conditioned VLA framework that addresses short-horizon observation aliasing — the multimodal nature of imitation demonstrations where similar visual-language observations are followed by different action chunks depending on the demonstrator's short-horizon intent. The model encodes recent visual observations via frozen VGGT-1B into a compact intent representation and uses gated cross-attention to condition flow-matching chunk generation. The authors also introduce AliasBench, a 12-task ambiguity-aware benchmark built on RoboTwin2 with matched train/eval environments that isolate short-horizon observation aliasing."

