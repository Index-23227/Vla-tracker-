# Paper: Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models
# arXiv: 2608.23478

name: INDI
full_name: "INDI (Intention Distillation): Act with Intent — Distilling Behavior Intent for Vision-Language-Action Models"
organization: "POSTECH (GSAI, IME)"
date: "2026-08-24"
paper_url: https://arxiv.org/abs/2608.23478
project_url: https://leesangoh.github.io/indi-project-page/
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "GR00T-N1.7 (primary) and pi0.5 (secondary) with frozen vision-language module; action decoder augmented with 8 learnable intent queries, 8 textual-grounding rows and 16 visual-grounding rows per camera"
  llm: "Backbone VLM of GR00T-N1.7 / pi0.5 (frozen); training-only teacher VLM Cosmos-Reason2-8B"
  action_head: "Pretrained flow-matching action decoder (DiT / action expert) with intent queries supervised at 50% decoder depth; asymmetric attention (intent -> groundings -> actions), context-dropout gate and intent-mismatch margin loss"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "GR00T-N1.7+INDI 3.50B (3.455B -> 3.502B, +46.4M); pi0.5+INDI 3.64B (+23.1M)"
  key_innovation: "Distills behavior-level intent from a frozen teacher VLM (which sees observation, instruction, coarse action summary and execution video of the demonstrated segment) into an intermediate layer of the VLA action decoder via cosine alignment; decoder also predicts endpoint-visual and textual-purpose grounding latents. Teacher and target modules removed at deployment."

training:
  method: "Fine-tuning of the action decoder of GR00T-N1.7 / pi0.5 with L = L_action(flow matching) + intent alignment + visual/textual grounding alignment + intent-mismatch hinge loss (margin 0.05); VL module frozen per backbone config"
  data: "BridgeData V2 (LeRobot conversion, 53,192 episodes) for SimplerEnv-Bridge; RoboCasa Kitchen 100 machine-generated demos per task x 24 tasks; real-world SO-101 teleoperation demos"

benchmarks:
  simpler_env:
    simpler_widowx_put_spoon_on_towel: 88.7
    simpler_widowx_put_carrot_on_plate: 84.7
    simpler_widowx_stack_block: 69.3
    simpler_widowx_put_eggplant_in_basket: 96.0
    simpler_widowx_avg: 84.7
    simpler_avg: 84.7
    source: "Paper Table 1 (row GR00T-N1.7 + INDI, mean over 3 evaluation runs)"
    date_reported: "2026-08-24"
    eval_condition: "SimplerEnv-Bridge (WidowX) 4 tasks, trained on BridgeData V2, 3 runs x 50 episodes per task"

  simpler_env_baselines:
    gr00t_n17_avg: 64.3
    gr00t_n17_future_supervision_avg: 68.0
    pi05_avg: 52.3
    pi05_indi_avg: 58.8
