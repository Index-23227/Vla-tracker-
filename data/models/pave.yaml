# Paper: PAVE: Predictive Alignment and Value-Guided Evolution for World-Action Policies
# (v3 PDF title: "PAVE: Separates Prediction from Preference in World-Action Policies")
# arXiv: 2608.30378

name: PAVE
full_name: "PAVE: Predictive Alignment and Value-Guided Evolution for World-Action Policies"
organization: "East China Normal University / EBKernel Technologies (Lab for Brain-Inspired Embodied Intelligence) / Shanghai Artificial Intelligence Laboratory"
date: "2026-08-31"
paper_url: https://arxiv.org/abs/2608.30378
code_url: null
venue: arXiv
open_source: false
model_type: latent_world_action_model

architecture:
  backbone: "Frozen V-JEPA 2.1 ViT-L/16 visual encoder (384^2 inputs, 576x1024 tokens per view) with a frozen projector to width 896"
  llm: "Qwen2.5-0.5B causal backbone (width 896), adapted only through LoRA (rank 32, alpha 64, dropout 0.1); 64 action placeholders"
  action_head: "16-layer DiT flow-matching velocity decoder conditioned on action-position states, proprioception and 32 learnable future-query tokens; action chunk H=20, 4 Euler steps at inference, deployed with the positive quality condition"
  action_head_category: flow_matching
  parameters: "1.29B online parameters (Table 5); offline critic fusion alone 3,934,720 trainable params (frozen encoders excluded)"
  key_innovation: >
    Separates the supervision roles of mixed-quality rollout experience inside one shared world-action actor.
    (1) Trajectory-relative predictive alignment: besides a local joint current-future V-JEPA target (offset 31),
    horizon-conditioned predictors align visual-position states with joint embeddings at fixed fractions
    {0.25, 0.5, 0.75, 1.0} of the remaining recorded trajectory, so supervision is broad early and fine near termination;
    all valid transitions (from successes and failures) supervise prediction. (2) An offline dual-head critic
    (frozen V-JEPA 2.1 + Gemma-2-2B, shared fusion MLP) jointly learns a 201-bin distributional return and an
    action-conditioned future-latent prediction. (3) Episode-excluded (2-fold cross-fitted) N-step advantages label
    the top 30% of chunks per task positive, the rest negative; both conditions train the actor (condition dropout 0.3)
    and deployment selects positive. Critic, target encoder and predictive heads are removed at deployment.

training:
  method: "Actor loss L_FM + 0.5 L_local + 0.5 L_MH (Eq. 7); base actor 60,000 updates on demonstrations, then 3 evolution rounds of 30,000 actor updates each, with 8,000 updates per fold-specific critic per round; demonstrations sampled 3x as often as evolution data"
  batch_size: "actor 128; pooled-critic 240"
  training_data: "LIBERO 50 demos/task (four suites, two views, 7-D actions); RoboTwin 2.0 Clean-20 task manifest from JEPA-WAM, 50 demos/task (three views, 14-D); simulation evolution adds 96 rollouts per training group per seed per round (288 cumulative); S1 real robot 120 demos/task + 3 x 50 physical rollouts per task"
  compute: "31.20 actor GPU-hours + 8.40 critic GPU-hours per simulation evolution round on NVIDIA H200 (excluding collection)"

