# Paper: NebulaVLA: A Dual-Frequency Vision-Language-Action Model With Guide Action for Robotic Manipulation
# arXiv: 2608.16503

name: NebulaVLA
full_name: "NebulaVLA: A Dual-Frequency Vision-Language-Action Model With Guide Action for Robotic Manipulation"
organization: "ZTE Corporation"
date: "2026-08-17"
paper_url: https://arxiv.org/abs/2608.16503
code_url: null
venue: null
open_source: false
model_type: vla
inference_hz: 20

architecture:
  backbone: "Qwen3-VL (System 2, ~10 Hz) + contrastively fine-tuned DINOv2 visual encoder (System 1, ~20 Hz)"
  llm: "Qwen3-VL"
  action_head: >
    Asynchronous dual-frequency fast-slow design. System 2 (Qwen3-VL) emits abstract action guidance
    through learnable query tokens; System 1 compresses that guidance with a Q-Former together with
    high-frequency DINOv2 visual tokens, robot state and action history, and generates the action
    chunk with a Diffusion Transformer (DiT) denoiser. Guide Action conditions each new chunk on the
    previous chunk's not-yet-executed actions and re-imposes them after every denoising step with a
    binary mask (outpainting-style), so the loss is computed only on the newly generated region.
  action_head_category: diffusion
  action_space: "continuous end-effector actions; System 2 reasons in GESTURE-7 ([x,y,z,roll,pitch,yaw,gesture keyword])"
  parameters: "Not stated"
  key_innovation: >
    (1) Heterogeneous dual-frequency architecture (S2 ~10 Hz / S1 ~20 Hz) enabling distributed
    deployment; (2) GESTURE-7, a language-keyword end-effector representation shared across grippers
    and dexterous hands; (3) three-stage training: S2 SFT on GESTURE-7 grounding/trajectory/CoT tasks,
    S2 GRPO RL with GESTURE-7 distance, keypoint, waypoint (DTW) and format rewards, then joint S1+S2
    SFT with frozen visual encoders; (4) Guide Action mask-based chunk stitching for smoothness.

training:
  stages: "Stage 1 S2 SFT (5 tasks) -> Stage 2 S2 GRPO RL -> Stage 3 joint S2+S1 SFT (visual encoders frozen)"
  compute: "Single node, 8x H800, batch size 96 (real-world training)"

