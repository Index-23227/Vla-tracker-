# Paper: LIRA: Local Cross-Layer Information Routing for Vision-Language-Action Decoding
# arXiv: 2608.07596

name: LIRA
full_name: "LIRA: Local Cross-Layer Information Routing for Vision-Language-Action Decoding"
organization: "Unknown (author affiliations not stated in the arXiv v1 PDF)"
date: "2026-08-06"
paper_url: https://arxiv.org/abs/2608.07596
code_url: null  # "Code and model checkpoints will be released upon publication"
venue: "arXiv 2026"
open_source: false
model_type: policy
inference_hz: 186.3

architecture:
  backbone: "Prismatic-style VLM taking a third-person image and a gripper-view image, plus proprioceptive state through a learnable projection"
  llm: "Qwen2.5-0.5B language backbone (LoRA rank 64 fine-tuning)"
  action_head: "Action decoder of L Parallel Fusion Blocks (PFBs) initialized by Action Query tokens; each PFB uses Bridge Attention (self-attention + cross-attention) over depth-aligned task-token features, locally routed LIRA Query features and the proprioceptive embedding. A final output head regresses a continuous action chunk of horizon H, trained with an L1 behavior-cloning objective."
  action_head_category: regression
  parameters: "0.5B"
  key_innovation: "LIRA reframes the VLM-to-action interface as depth-aware information routing on top of VLA-Adapter. Instead of conditioning each Parallel Fusion Block on the single matched VLM layer, it appends M=64 learnable LIRA Query tokens to the VLM and gives PFB i a centered local window W_r(i) = {l : |l - i| <= r} of adjacent VLM layers (r=1, i.e. a three-layer window, clipped to two layers at the boundaries), concatenating those LIRA Query features along the token dimension. The routing adds no projection layers and no trainable parameters, leaves backbone, action decoder and training recipe unchanged, and mostly pays off under distribution shift (LIBERO-Plus zero-shot 59.1 -> 78.0)."

training:
  dataset: "LIBERO (4 suites), LIBERO-Plus (10,030 perturbed tasks, fine-tuned setting only), CALVIN ABC->D (train A/B/C, evaluate D), and self-collected real-world Franka demonstrations via SpaceMouse teleoperation"
  method: "Supervised continuous-action regression (L1 loss over an action chunk of horizon H), LoRA rank 64, identical objective and recipe as the VLA-Adapter baseline so the comparison isolates the routing change. M=64 LIRA Query tokens, routing window r=1."
  compute: "Four NVIDIA H100 GPUs, learning rate 1e-4, batch size 16; 12.8 GB training memory at batch size 8"

