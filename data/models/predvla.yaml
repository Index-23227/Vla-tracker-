training:
  method: "Trained from scratch per LIBERO suite: L = visual prediction error + proprioceptive prediction error + action NLL (GMM) + complexity; posterior free variables per demo/time step learned jointly then discarded"
  steps: 30000
  batch_size: 32
  optimizer: "Adam, network LR 6e-5 (constant), posterior LR 1e-2, weight decay 1e-4"
  online_inference: "Adam, window 40, 10 iterations, step size 0.05, w_ER 1.0"

eval_conditions:
  libero: "per-suite training on official demos, 50 rollouts/task, 14 seeds (7,000 episodes per suite); frozen generic encoders, no robot-data pretraining"

