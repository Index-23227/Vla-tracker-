# Paper: PredVLA: Predictive Sensorimotor Modeling for Sub-Million-Parameter Robot Manipulation
# (arXiv listing title: "PredVLA: A Sub-Million-Parameter Predictive-Coding Policy for Robot Manipulation")
# arXiv: 2608.26673

name: PredVLA
full_name: "PredVLA: Predictive Sensorimotor Modeling for Sub-Million-Parameter Robot Manipulation"
organization: "Sony Computer Science Laboratories, Tokyo"
date: "2026-08-27"
paper_url: https://arxiv.org/abs/2608.26673
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "frozen front end: all-MiniLM-L6-v2 sentence encoder (384->64 PCA) + ImageNet ResNet18 per camera (512->96 PCA, agentview + eye-in-hand) + raw 9-D proprioception; trainable hierarchical predictive-coding RNN (PV-RNN-style modules T/V/A_top/A_bottom, multiple timescales)"
  action_head: "2-layer MLP decoding a 5-component diagonal Gaussian mixture over 7-D end-effector action from the A_bottom module; mean of highest-weight component executed"
  action_head_category: regression
  parameters: "675,732 trainable controller parameters (0.68M); frozen encoders not counted"
  key_innovation: "Predictive-coding policy in which observations never enter the recurrent dynamics directly: hierarchical multi-timescale recurrent modules predict visual features and proprioception, and deterministic posterior free variables over a 40-step window are optimized online (10 Adam steps per control step) to minimize visual/proprioceptive prediction error plus a prior complexity term; the inferred latent trajectory is decoded into action. Setting n_itr=0 gives an exact open-loop counterpart. No robot-data pretraining."

