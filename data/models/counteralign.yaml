# Paper: CounterAlign: Counterfactual Supervision for Vision-Language-Action Models
# arXiv: 2608.21740

name: CounterAlign
full_name: "CounterAlign: Counterfactual Supervision for Vision-Language-Action Models"
organization: "Institute of Science Tokyo / AI Robot Association (AIRoA) / RIKEN AIP / Tohoku University"
date: "2026-08-22"
paper_url: https://arxiv.org/abs/2608.21740
code_url: null
venue: arXiv
open_source: false
model_type: "Offline-RL post-training of a flow-matching VLA with a learned instruction-grounded reward"

architecture:
  backbone: "pi0.5 (policy architecture unchanged from the BC baseline)"
  llm: "PaliGemma-based VLM (inherited from pi0.5)"
  action_head: "pi0.5 flow-matching action expert trained with advantage-weighted flow matching (IQL-style critic); adversarial + relabeling discriminators and double-Q/V critics share VLM backbones with separate expert heads"
  action_head_category: flow_matching
  parameters: "Policy ~3.4B (same as BC baseline); total trainable incl. discriminators and critics ~12.7B"
  key_innovation: >
    Converts successful expert demonstrations into corrective supervision via counterfactual relabeling:
    instruction-, action- and jointly-relabeled instruction-observation-action tuples (similarity-thresholded
    near-misses) train a relabeling discriminator with a PN + non-negative PU (nnPU) objective plus entropy
    regularization, combined with a GAIL-style offline adversarial discriminator (expert vs policy actions).
    The weighted log-discriminator reward drives IQL with clipped double-Q; the critic also sees
    near-positive instruction-relabeled samples; the actor is trained with exp(beta*advantage)-weighted
    flow-matching loss. No additional rollouts, annotations or reward labels.

training:
  dataset: "LIBERO (train) -> LIBERO-PRO eval; CALVIN ABC; TX-G2 real robot 4 tasks / 1,198 demos"
  method: "Full-parameter fine-tuning of pi0.5; iterative discriminator / critic / actor updates (offline RL, IQL + advantage-weighted flow matching)"
  compute: "LIBERO: 15K steps, batch 256, 8x H200, ~28 h. TX-G2: 150K steps, batch 64, 8x H200, ~96 h"

inference_hz: null

