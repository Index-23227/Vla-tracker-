architecture:
  action_head: "Frozen VLA backbone + two lightweight projection heads (image patches, language tokens) producing a focus map that reweights image tokens; learned scalar readiness threshold gates action start"
  action_head_category: other
  parameters: "TODO: not stated in abstract (lightweight projection heads on a frozen backbone)"
  key_innovation: "Premover turns the idle window during user instruction entry into useful precomputation for VLA policies. Two small projection heads map an intermediate layer of a frozen VLA backbone into a shared image-language space, producing a focus map (supervised by simulator-rendered target-object masks) that reweights next-step image tokens. A jointly trained scalar readiness threshold decides when to begin acting on streaming prefixes, reducing latency without sacrificing success rate."

