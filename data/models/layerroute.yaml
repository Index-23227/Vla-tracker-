# Paper: LayerRoute: Action-Conditioned Mixture-of-Layers Routing for Vision-Language-Action Policies
# arXiv: 2609.06079

name: LayerRoute
full_name: "LayerRoute: Action-Conditioned Mixture-of-Layers Routing for Vision-Language-Action Policies"
organization: "Tsinghua University; MBZUAI; Nanyang Technological University; Zhejiang University; Rutgers University"
date: "2026-09-05"
paper_url: https://arxiv.org/abs/2609.06079
venue: arXiv
open_source: true
model_type: vla

architecture:
  backbone: "Headline entry = pi0.5 + LayerRoute (PaliGemma VLM + flow-matching action expert). Also instantiated on StarVLA-pi (Qwen3-VL + 36-layer action DiT)"
  llm: "PaliGemma (pi0.5 variant); Qwen3-VL (StarVLA-pi variant)"
  action_head: "pi0.5 flow-matching action expert with an added per-layer eight-head action-to-VLM cross-attention adapter reading a routed mixture of cached VLM hidden states, plus Action-State Reread before each FFN"
  action_head_category: flow_matching
  parameters: "+3.87% over pi0.5 (+0.31% over StarVLA-pi)"
  key_innovation: "Layer Mixture Router: at each action layer, pooled current action state queries pooled summaries of cached VLM hidden states from several depths (StarVLA-pi: layers 5/11/17/23/29/35), softmax over depth gives a sample-wise mixture used as cross-attention context. Action-State Reread: a learned per-layer query attends token-wise over the initial, earlier retained and current action states before the FFN. Routing analyses show early action layers favor shallow VLM states and later layers deeper ones; Spatial suites favor shallow, Goal suites deep layers."

training:
  method: "Joint fine-tuning of pretrained VLM, action module, router and reread modules; pi0.5 path AdamW lr 5e-5, 5K warmup, constant; StarVLA-pi base lr 2.5e-5, action/routing lr 1e-4, cosine; 30K/40K/100K steps on LIBERO/SimplerEnv/RoboCasa-GR1; real robot 20K steps"
  data: "LIBERO; LeRobot conversions of Bridge and RT-1 (SimplerEnv); RoboCasa-GR1 24-task mixture; 50 demos per real-world task"
  hardware: "8x NVIDIA H200, global batch 256"

