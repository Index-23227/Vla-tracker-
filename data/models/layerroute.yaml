    libero_spatial: 99.0
    libero_object: 98.4
    libero_goal: 99.2
    libero_long: 96.0
    libero_avg: 98.2
    source: "Paper Table 2, pi0.5+LayerRoute row"
    date_reported: "2026-09-05"
    eval_condition: "fine-tuned on LIBERO (30K steps); 500 episodes per suite, seed 7; Avg4 = unweighted mean of suites"

  simpler_env:
