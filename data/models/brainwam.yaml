    navsim_v2_nc: 98.1
    navsim_v2_dac: 97.5
    navsim_v2_ddc: 99.6
    navsim_v2_tlc: 99.9
    navsim_v2_ep: 88.2
    navsim_v2_ttc: 97.4
    navsim_v2_lk: 97.6
    navsim_v2_hc: 98.4
    navsim_v2_ec: 85.8
    source: "Tables 1-2 in BrainWAM paper (NAVSIM v1 PDMS, NAVSIM v2 EPDMS)"
    date_reported: "2026-08-13"
    eval_condition: "open-loop non-reactive simulation on NAVSIM v1/v2 (OpenScene/nuPlan real driving logs), 4s trajectory at 2Hz (8 waypoints)"

training:
  hardware: "8x NVIDIA H20 GPUs, per-GPU batch size 6"
  optimizer: "AdamW, peak LR 5e-5, weight decay 0.01, cosine schedule, 200 warmup steps, bf16, DeepSpeed ZeRO-2"
  steps: "100K steps per stage (3 stages)"
  notes: "Reported branch convergence: VLA-only reaches 86.1 PDMS at 54K steps; WAM-only reaches 88.1 PDMS at 81K steps"

eval_conditions:
  driving: "fine-tuned, end-to-end open-loop planning (NAVSIM v1 navtest / NAVSIM v2)"

