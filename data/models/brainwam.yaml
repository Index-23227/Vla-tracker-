# Paper: BrainWAM: Action-Space Coordination of Semantic Priors and Predictive Dynamics for Autonomous Driving
# arXiv: 2608.12854

name: BrainWAM
full_name: "BrainWAM: Action-Space Coordination of Semantic Priors and Predictive Dynamics for Autonomous Driving"
organization: "NLPR, Institute of Automation, Chinese Academy of Sciences (CASIA) / Li Auto Inc."
date: "2026-08-13"
paper_url: https://arxiv.org/abs/2608.12854
code_url: null
venue: arXiv preprint
open_source: false
model_type: driving_vla

architecture:
  backbone: "Dual-branch: Wan2.2-TI2V-5B video generative backbone (WAM branch) + Qwen3-VL-4B VLM (VLA branch), each with a lightweight rectified-flow action expert"
  llm: "Qwen3-VL-4B"
  action_head: "Two rectified-flow action experts (8 action tokens, hidden dim 1024) producing prediction-grounded and semantic-grounded action tokens; coupled by Callosal Action Bridge (CAB, 2 cross-attention blocks at layers 9/18, 8 heads x 128 dim, zero-init tanh gates, ~16.8M params) and fused by Cerebellar Intent Fusion (CIF, 2-layer Transformer with AdaLN timestep conditioning, ~49.3M params); action decoder emits an 8-waypoint 4s trajectory at 2Hz"
  action_head_category: flow_matching
  parameters: "~9B backbone total (Wan2.2-TI2V-5B + Qwen3-VL-4B); CAB ~16.8M + CIF ~49.3M trainable in Stage 3"
  key_innovation: "Diagnoses an attention-allocation mismatch in Tri-modal Joint Attention (Tri-MoT): action tokens attend far more to clean VLM tokens than to still-denoising VGM tokens, so raw-token fusion (87.8 PDMS) underperforms WAM-only (88.1 PDMS). Instead of mixing raw tokens, BrainWAM keeps a brain-inspired left-hemisphere (semantic/VLM) and right-hemisphere (predictive/VGM) pathway separate and coordinates them only at the compact action-token level via CAB (corpus callosum) and CIF (cerebellum). Three-stage training: (1) WAM branch with video+action rectified-flow losses, (2) VLA branch with action loss, (3) both branches frozen, only CAB/CIF/action decoder trained. Asynchronous rectified-flow inference decouples video and action timesteps, letting the video stream terminate early and cache features (3-step action sampling)."

