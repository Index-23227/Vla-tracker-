    gr00t_n15_warped_aug_in_range: 69.1
    gr00t_n15_warped_aug_extrapolation_35_45: 24.0
    gr00t_n15_rerendered_aug_in_range: 74.5
    gr00t_n15_rerendered_aug_extrapolation_35_45: 59.2
