    pink_noodle_different_bg: 0.8
    hotdog_bun_regular_bg: 0.8
    hotdog_bun_different_bg: 0.6
    close_cabinet_regular_bg: 0.8
    close_cabinet_different_bg: 0.7
    pour_pasta_regular_bg: 0.8
    pour_pasta_different_bg: 0.7
    average: 0.76
    source: "Paper Table 4 (column TrAct)"
    date_reported: "2026-08-25"
    eval_condition: "Franka Panda, fine-tuned on 400 demos of 4 training tasks, evaluated on 5 unseen tasks x 2 backgrounds, 10 episodes each; success as fraction"

  real_world_baselines:
    pi05_average: 0.49
    pi05_vlac_average: 0.65
    vlat_average: 0.55
    vlat_awm_average: 0.66
    source: "Paper Table 4 (baseline columns)"
    date_reported: "2026-08-25"

eval_conditions:
