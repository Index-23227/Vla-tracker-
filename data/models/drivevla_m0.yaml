training:
  vlm_pretraining: "VLM backbone initialized from InternVL3 and domain-pre-trained on the ReCogDrive-collected driving QA corpus aggregating 12 public datasets (Talk2Car, SUTD, NuScenes-QA, OmniDrive, ...), 3.1M QA pairs covering perception, prediction and planning; ~775K high-quality QA pairs retained for NAVSIM training. The Compress Module is excluded from this stage."
  action_decoder: "VLM frozen afterwards; Compress Module trained jointly with the Action Decoder. Trajectory Head and Score Head optimized jointly with L_total = L_traj + L_score, where L_traj is the min-over-N L1 distance between the N proposals and the human expert trajectory, and L_score is a BCE loss against PDM-scorer soft targets s_i in [0,1] per proposal (training paradigm follows iPad)."
  retrieve_model: "DINOv2 fine-tuned with Decoupled LoRA (Map / Agent branches) under Transfuser-style occupancy-grid supervision: L = BCE(M_map_hat, M_map) + alpha * BCE(M_agent_hat, M_agent) with alpha = 10 to balance the smaller agent-loss magnitude."
  memory_generation: "Base model inference over training/synthetic scenarios; PDM oracle sub-scores aggregated into Q(tau); failure threshold beta = 0.5 (NAVSIM convention where NC/DAC below 0.5 mean collision or drivable-area violation); cosine-similarity deduplication bounds pool size to ~4K (Base) / 10K (Scale, using SimScale-synthesized scenarios)."
  test_time_training: "AdamW, learning rate 2e-4, 3 optimization steps, LoRA weights re-initialized per test scenario; trigger threshold lambda = 0.9; hierarchical retrieval first filters top-k1 by map embedding then refines to top-k2 by agent embedding, with k1 = 3*k2 and k2 = 3."
  optimizer: "AdamW, learning rate 1e-4 for base-model training"
  hardware: "16 x NVIDIA H20 GPUs for base-model training; single H20 for inference/latency measurement"

eval_conditions:
  navsim_v1: "Navtest split of NAVSIMv1 (built on nuPlan / OpenScene); non-reactive data-driven simulation, PDMS = f(NC, DAC, EP, TTC, C); front-view camera input only"
  navsim_v2: "Navhard split of NAVSIMv2; pseudo closed-loop two-stage protocol, EPDMS adds DDC, TLC, LK, EC and history comfort plus false-positive penalty filtering"
  memory_scaling: "Scale configuration expands the latent memory to 10K entries using SimScale-synthesized scenarios; no retraining of the base model"
  ablations: "All ablation tables run on NAVSIMv1 against the same base model whose no-memory PDMS is 91.0"

