# Paper: DriveVLA-M0: Failure-Aware Memory Augmentation for Autonomous Driving
# arXiv: 2608.10413

name: DriveVLA-M0
full_name: "DriveVLA-M0: Failure-Aware Memory Augmentation for Autonomous Driving"
organization: "Institute of Automation, Chinese Academy of Sciences / Chongqing Chang'an Technology"
date: "2026-08-11"
paper_url: https://arxiv.org/abs/2608.10413
code_url: https://github.com/ZebinX/DriveVLA-M0
venue: "ACM MM 2026"
open_source: true
model_type: vla

architecture:
  backbone: "InternVL3 vision-language backbone (following ReCogDrive), front-view camera only; Q-Former-style Compress Module with N=16 learnable queries (D=256) compressing the LLM last-layer feature h_-1 (2800 x 1536 tokens) by 1050x into F_lang; separate DINOv2 Retrieve Model fine-tuned with Decoupled LoRA (Map/Agent branches) producing structural retrieval keys"
  llm: "InternVL3 (domain pre-trained on driving QA)"
  action_head: "Two-stage score-based planning decoder: a Trajectory Head (Transformer with learnable ego query Q_ego + ego-status embedding F_ego, cross-attending F_lang) regresses a cluster of M trajectory proposals (M x 8 x 3) via MLP, and a Score Head re-encodes the proposals and predicts K PDM sub-scores per proposal; the highest aggregated-score trajectory is selected"
  action_head_category: regression
  action_space: continuous
  parameters: null
  key_innovation: "Failure-aware latent memory with associative test-time correction. Offline, the base model is run over training/synthetic scenarios and scored by the oracle PDM scorer; scenarios with Q(tau) < beta = 0.5 are written into a latent memory pool as (retrieval keys F_map/F_agent, adaptation inputs F_lang/F_ego/trajectory cluster, supervision targets expert trajectory + oracle sub-scores), with cosine-similarity deduplication. Online, a dedicated DINOv2 Retrieve Model that decouples static road structure from dynamic agent interaction retrieves structurally (not vision-language) similar failure cases; a cosine-similarity Trigger (lambda = 0.9) gates whether adaptation happens at all, and a Decoupled LoRA test-time-training step (AdamW, lr 2e-4, 3 steps) fine-tunes only the Action Decoder - map-retrieved cases update the Map (static) LoRA branch, agent-retrieved cases the Agent (dynamic) branch - with pathway-aware score fusion (static branch for drivable-area-type sub-scores, dynamic branch for collision-type sub-scores). Memory can be expanded (4K -> 10K entries with SimScale-synthesized scenes) for training-free gains."

