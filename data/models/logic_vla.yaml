# Paper: Logic-VLA: A Temporal Logic Conditioned Vision-Language-Action Model
# arXiv: 2608.20556

name: Logic-VLA
full_name: "Logic-VLA: A Temporal Logic Conditioned Vision-Language-Action Model"
organization: "University of Southern California"
date: "2026-08-20"
paper_url: https://arxiv.org/abs/2608.20556
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla
inference_hz: 10

architecture:
  backbone: "pi0.5 (2B vision-language backbone + 300M action expert), initialized from the pre-trained pi0.5 checkpoint; STL formulas encoded by a TeLoGraF-style syntax-graph GCN encoder (child-to-parent message passing + mean pooling), projected to N_spec specification tokens appended to the VLM prefix after image and NL tokens"
  action_head: "pi0.5 conditional flow-matching action expert (unchanged); outputs absolute drone positions, executes 40 actions per query in closed loop"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "2B VLM backbone + 300M action expert (pi0.5) + STL graph encoder"
  key_innovation: "Formal-requirement-conditioned VLA: a Signal Temporal Logic (STL) specification supplied at inference time is an additional policy input alongside the NL task. STL encoder is pre-trained to regress (tanh-normalized) STL robust semantics from trajectory-formula pairs. Two-stage post-training: (1) STL-conditioned SFT on satisfying demonstrations; (2) trajectory-level Identity Preference Optimization over matched satisfying-violating rollout pairs using flow-matching-loss differences as a surrogate for log-policy ratios (aggregated over temporal windows), plus a one-sided preferred-rollout anchor against the frozen Stage-1 reference."

training:
  dataset: "3000 collision-free reference drone trajectories in NVIDIA Isaac Sim 5.1 (10 randomized photorealistic warehouse environments x 6 NL navigation tasks, DJI Mavic 2 Pro, egocentric + third-person cameras); 1449 formula-groups from 1224 distinct STL formulas spanning 87 structures -> 8886 satisfying rollouts (D+) and 13494 preference-pair instances (P)"
  method: "pi0.5 first fine-tuned without STL to obtain the STL-blind base policy; then Stage 1 STL-conditioned SFT (conditional flow matching, STL encoder jointly fine-tuned) and Stage 2 trajectory-level IPO with preferred-rollout anchor. LoRA on 2B VLM (rank 16, alpha 16) and 300M action expert (rank 32, alpha 32); vision encoder and action input/output projections fully fine-tuned."

