# Paper: GigaBrain-0.7: Scaling Embodied Foundation Models to Emergent Capabilities with a Three-System Architecture
# arXiv: 2608.15875

name: GigaBrain-0.7
full_name: "GigaBrain-0.7: Scaling Embodied Foundation Models to Emergent Capabilities with a Three-System Architecture"
organization: "GigaAI (GigaBrain Team)"
date: "2026-08-16"
paper_url: https://arxiv.org/abs/2608.15875
code_url: https://github.com/open-gigaai/giga-brain-0
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "PaliGemma2 (3B) vision-language backbone with Temporal-Spatial Blocks inserted into the visual encoder (short-term visual memory); System 2 (understanding & planning, subtask/CoT prediction) shares the VLM; System 3 = World Value Model extended from GigaWorld-1 (frozen during VLA post-training) that supplies a subgoal image and a value-derived binary advantage condition"
  llm: "PaliGemma2 (3B)"
  action_head: "Action Expert (0.5B) coupled to the VLM in a dual-stream Mixture-of-Transformers (joint attention, separate FFNs); conditional flow matching generates continuous action chunks, with a parallel NTP discrete-action pathway used during training; shared expert Transformer with per-embodiment input/output projections, 6D rotations"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "~3.5B for System 1 (PaliGemma2 3B + 0.5B Action Expert; Table 4 lists 3.5B total for the PaliGemma2 configuration); System 3 world model not counted"
  key_innovation: "Three-system embodied foundation model (System 1 action & control, System 2 understanding & planning, System 3 prediction & evaluation via a World Value Model). One-stage pretraining jointly optimizes NTP (VL, subtask, discrete-action) and flow-matching losses on 37,257 hours of embodied trajectories (real robot 55%, UMI 22%, EGO 8%, sim 4%, world-model-generated 11%) spanning 16 robot types plus ~272M VL samples, using Soft Knowledge Insulation (action gradients into the VLM attenuated by alpha_KI in (0,1)). Post-training conditions System 1 on System 3 subgoal images and advantage; experience reinforcement adds offline advantage-weighted RL and online human-in-the-loop actor-critic RL."

training:
  pretraining_data: "37,256.98 h embodied trajectories (16 robot morphologies) + 271,976,674 VLM image-text/QA samples"
  method: "One-stage joint VLA pretraining (L_NTP + L_FM) with Soft KI; World Value Model pretraining (robot video pretraining + value learning); world-model-conditioned task-specific post-training; offline RL then online HIL RL"

