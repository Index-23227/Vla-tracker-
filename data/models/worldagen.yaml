# Paper: WorldAgen: Unified State-Action Prediction with Test-Time World Model Training
# arXiv: 2609.08162

name: WorldAgen
full_name: "WorldAgen: Unified State-Action Prediction with Test-Time World Model Training"
organization: "Northwestern University"
date: "2026-09-08"
paper_url: https://arxiv.org/abs/2609.08162
code_url: https://worldagen.github.io
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "GR-1/Seer-style GPT video policy with a Qwen3 Transformer backbone (24 layers, 12 heads); MAE-pretrained ViT-B visual encoder on static + wrist RGB, Perceiver Resampler token compression, CLIP ViT-B/32 text encoder, MLP state/action embeddings"
  llm: "Qwen3 architecture (configured as 24-layer / 12-head, trained as policy backbone)"
  action_head: "Agent (policy) head: MLP decoder from action placeholder tokens to 7-D action chunks (separate linear layers for 6-D arm and gripper; gripper thresholded at 0.5). World-model head: ViT decoder predicting future image patches. Paper describes the action loss as cross-entropy."
  action_head_category: regression
  parameters: "370M total, 120M trainable"
  key_innovation: "Single Transformer with a task-conditioned agent head and a task-agnostic world-model head, separated by a Mixed Unidirectional Attention Mask (local mask blocks action leakage; global mask hides the instruction from the world head). At deployment, two-stage Test-Time Training: random exploratory rollouts relabeled with a 'no-lang' token, then LoRA updates of the shared backbone using only the observation-prediction loss (policy head frozen)."

training:
  method: "Joint pretraining with L = L_a + lambda * L_o (teacher forcing); test-time LoRA adaptation (rank 128 on CALVIN, 64 on LIBERO; single-epoch single-step, AdamW lr 0.005) on ~204 (CALVIN) or 6x6 per scene (LIBERO) exploratory samples"
  data: "CALVIN and LIBERO demonstrations"
  hardware: "Pretraining on 4x H100 (~60 h CALVIN, ~5 h LIBERO); TTT on one RTX 4090 (~8 min/task CALVIN, ~2 min/scene LIBERO)"

