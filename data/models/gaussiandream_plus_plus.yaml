# Paper: GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation
# arXiv: 2608.25659
# Successor of GaussianDream (data/models/gaussiandream.yaml, arXiv 2605.20752)

name: GaussianDream++
full_name: "GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation"
organization: "Tuojing Intelligence; UCAS; Institute of Automation, CAS; Tsinghua University; USTC; HKUST (Guangzhou); NTU; Beihang University; CMU; University of Hong Kong"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25659
code_url: https://github.com/TuojingAI/GaussianDream
venue: arXiv
open_source: true

architecture:
  backbone: "pi0.5 (PaliGemma VLM + flow-matching Action Expert)"
  llm: "PaliGemma (pi0.5 backbone)"
  action_head: "pi0.5 flow-matching Action Expert conditioned on the world-token-augmented PaliGemma prefix (no extra world-to-action projector)"
  action_head_category: flow_matching
  parameters: "pi0.5 backbone + 20 learnable world tokens (16 World State Tokens in a 4x4 layout + 4 World Prediction Tokens); total parameter count not stated"
  key_innovation: "Policy-native successor to GaussianDream: replaces the dense 1024-token VGGT/TGE-built Gaussian prefix with 16 World State Tokens and 4 World Prediction Tokens inserted directly into the PaliGemma prefix. A training-only World Representation Head decodes them into a renderable Current World (metric-depth unprojection, geometry/appearance decomposition with stop-gradient) and a coupled Future Prediction over the same Gaussian primitives (residual center displacement with static-dynamic gating and static-consistency loss). Head, renderer and VGGT/TGE path are removed at deployment; only 20 extra tokens remain (330 ms vs 286 ms for pi0.5 per chunk)."

