training:
  base_model: "pi0.5"
  method: "Joint optimization L = L_act (pi0.5 flow matching) + lambda_cur * L_cur (RGB/depth/alpha/reg rendering of Current World) + lambda_fut * L_fut (RGB/depth/metric 3D flow/static consistency over future horizons). Future observations used only as targets."

eval_conditions:
  libero: "fine-tuned on LIBERO (4 suites); LIBERO-Plus zero-shot, 7 perturbation dimensions"
  real_world: "dual-arm platform, Bowl-Proximity and Eggplant-to-Pink-Plate under Standard/Layout/Camera shifts, 20 trials each"

