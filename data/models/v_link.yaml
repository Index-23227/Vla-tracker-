# Paper: V-Link: Recovering Lost Visual Representations in Action DiT for Vision-Language-Action Models
# arXiv: 2608.25308

name: V-Link
full_name: "V-Link: Recovering Lost Visual Representations in Action DiT for Vision-Language-Action Models"
organization: "AGIBOT / Zhejiang University / HKUST (Guangzhou) / Simon Fraser University"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25308
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "GR00T N1.6 3B (Qwen-based VLM + 32-layer AlternateVLDiT action expert); pretrained language and vision backbones frozen, VLM adapted with rank-128 LoRA"
  action_head: "GR00T N1.6 Action DiT (flow matching) with extra injection at the image cross-attention layers (l = 4k+2): parallel cross-attention to VLM image tokens and learnable Semantic Queries fused via a gated residual projection, followed by a dedicated cross-attention to Spatial Queries for geometric conditioning"
  action_head_category: flow_matching
  parameters: "~3B (GR00T N1.6 3B) + learnable query tokens + two ~2.3M-param training-only depth/segmentation heads (removed at inference)"
  key_innovation: "Diagnoses a VL-to-A 'visual representation accessibility' bottleneck in dual-system VLAs (frozen-feature probes: depth MAE 0.015 on VLM features vs 0.071 on GR00T Action DiT features; seg mIoU 0.665 vs 0.290). Fixes it by appending learnable Spatial and Semantic Query tokens to the VLM input under a tailored causal mask, supervising them with training-only depth (smooth-L1 + abs-rel + top-k hard-patch) and segmentation (CE + Dice) heads, and injecting them asymmetrically into the Action DiT. Adds only 1.58 ms latency (43.21 -> 44.79 ms)."

training:
  base_model: "GR00T N1.6 3B"
  method: "Fine-tuning with L = L_flow + 0.1 L_depth + 0.002 L_seg; warm-up of VLM LoRA + queries + heads, then joint optimization; AdamW lr 1e-4, cosine decay, BF16, DeepSpeed ZeRO-2"
  data: "LIBERO standard demos (80k steps, batch 160, 2x5x5 query tokens, 16-step chunks); RoboTwin 2.0 6 tasks x 50 demos (120k steps, batch 128, 3x5x5 queries, 15-step chunks); 100 teleoperated demos per AGIBOT A3 Ultra task. Depth/segmentation GT used only in training (real robot: Lingbot-Depth completion + GroundingDINO/SAM3 pseudo-labels)"
  hardware: "4x NVIDIA H100"

