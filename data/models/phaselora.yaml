# Paper: PhaseLoRA: Control-Regime-Conditioned Low-Rank Adaptation for Continuous-Action Vision-Language-Action Policies
# arXiv: 2608.15285

name: PhaseLoRA
full_name: "PhaseLoRA: Control-Regime-Conditioned Low-Rank Adaptation for Continuous-Action Vision-Language-Action Policies"
organization: "Tsinghua University"
date: "2026-08-15"
paper_url: https://arxiv.org/abs/2608.15285
code_url: https://github.com/Grinffin/PhaseLoRA
venue: arXiv preprint
open_source: true
model_type: vla

architecture:
  backbone: "pi0.5 (public openpi pi05_base checkpoint); VLM = gemma_2b_lora variant (PaliGemma/SigLIP), action expert = gemma_300m_lora variant"
  llm: "Gemma 2B (inside pi0.5)"
  action_head: "pi0.5 flow-matching action expert (action chunk dim 32, horizon H=10 on LIBERO, H=50 on real robot). PhaseLoRA replaces the static LoRA update in the action expert with Delta W_t = B_t A, where B_t = B_0 + P_t B_P + E_t B_E + (P_t E_t) B_PE is conditioned on two router-predicted descriptors (fine-control tendency P, event/boundary intensity E); VLM-side LoRA stays standard."
  action_head_category: flow_matching
  action_space: continuous
  parameters: "pi0.5 backbone largely frozen; trainable PhaseLoRA params = 4.41% of pi0.5 (VLM LoRA rank 48, action-expert LoRA rank 96) plus a GRU router (hidden 128)"
  key_innovation: "Within-trajectory, control-regime-conditioned PEFT: a lightweight GRU router predicts fine-control tendency P_t and event/boundary intensity E_t at every action-chunk query from a visual-language prefix summary and 30 steps of action/gripper history; these descriptors modulate the LoRA left factor so the low-rank update direction (not only its scale) varies over the rollout while staying rank <= r. Router is weakly supervised by offline proxy targets from trajectory statistics (sigmoid of MAD-normalized motion magnitude and action jerk) with Huber + BCE losses; no manual phase labels."

training:
  method: "PEFT fine-tuning of pi0.5 per LIBERO suite; joint loss = flow-matching policy loss + 0.5 Huber(P) + 0.2 BCE(E) + 1e-5 Frobenius regularizer on B_P, B_E, B_PE"
  optimizer: "AdamW, weight decay 1e-10, grad clip 1.0, LR warmup 10k steps to 5e-5 then constant, batch 32, 30k steps, bf16"
  compute: "Single RTX 5090 per run, ~24 GPU-hours per suite run; ~2160 GPU-hours for all reported LIBERO runs"
  real_world_data: "AgileX Piper arm, 4 tabletop tasks x 100 demonstrations, LeRobot framework"

