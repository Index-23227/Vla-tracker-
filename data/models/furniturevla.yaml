name: FurnitureVLA
full_name: "FurnitureVLA: Learning Long-Horizon Bimanual Furniture Assembly with Vision-Language-Action Model"
organization: "Mitsubishi Electric Research Laboratories (MERL); University of Oxford; UNC Chapel Hill"
date: "2026-07-01"
paper_url: https://arxiv.org/abs/2607.01212
code_url: null
venue: null
open_source: false
model_type: vla
inference_hz: 10

architecture:
  backbone: "PaliGemma-2B (SigLIP So400m/14 vision encoder, input resolution upscaled 224 -> 448 with bicubic positional-embedding interpolation)"
  llm: "Gemma-2B (within PaliGemma) + Gemma-300M action expert"
  action_head: "flow matching (pi0.5 backbone); action expert decodes chunks of H=50 actions, action dim extended 14 -> 15 to jointly predict a continuous subtask progress signal"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "2.6B"
  key_innovation: >
    First systematic study of real-scale bimanual furniture assembly (IKEA LACK / KALLAX / IVAR,
    up to 7 subtasks and 1550 control steps) with VLAs. Progress-enhanced VLA: each assembly is
    decomposed into semantically grounded subtasks with continuous progress labels derived from
    action primitives (pick/place/retreat), and the policy jointly predicts 14-dim bimanual actions
    plus a scalar progress signal that triggers automatic subtask transitions at inference
    (threshold tau_p=0.95 with a spike filter). Subtask boundaries are placed at contact-free
    post-retreat states to reduce cross-subtask distribution shift. Includes a scalable Isaac Gym
    simulation pipeline (motion-planned expert demos, magnet-based pose-reset attachment) and a
    Quest 3 VR teleoperation system for single-operator dual Kinova Gen3 control, plus a design
    factor study (temporal ensembling lambda=-0.1, action horizon, rear camera, 448px resolution)
    worth an additional +21% average success.

training:
  dataset: >
    Simulation: 500 motion-planned expert demonstrations per furniture (LACK, KALLAX, IVAR) in
    Isaac Gym extending the FurnitureBench codebase; a single model trained across all furniture.
    Real world: 100 VR-teleoperated demonstrations of the IVAR chair on a dual Kinova Gen3
    platform, recorded at 10 Hz with DROID-style no-op filtering.
  method: >
    Full finetuning (no LoRA) of pi0.5 (pi05_base checkpoint) via flow matching on augmented
    15-dim action chunks (14 robot + 1 progress), conditioned on the current subtask instruction.
    4 RGB views (front, rear, 2 wrist) at 448x448; proprioception discretized and inlined into
    the language prompt; no observation history.
  num_trajectories: 1500
  compute: "8x NVIDIA L40S (48GB), 40K steps, effective batch size 64, LR 2.5e-5 cosine decay; inference on a single L40S with 10 flow-matching denoising steps"

benchmarks:
  real_world:
    ivar_full_assembly_sr: 40.0
    ivar_per_part_avg_sr: 78.1
    source: "FurnitureVLA paper Table IV, real dual Kinova Gen3, IVAR chair, 15 rollouts (full assembly) / 15 rollouts per subtask (per-part)"
    date_reported: "2026-07-01"
    eval_condition: "finetuned on 100 real VR-teleoperated demos; magnets in screw holes"

eval_conditions:
  real_world: "pi0.5 fully finetuned on 100 real IVAR demos; subtask-decomposed instructions with progress-triggered transitions"

tags:
  - bimanual
  - furniture-assembly
  - long-horizon
  - progress-prediction
  - subtask-decomposition
  - flow-matching
  - pi0.5
  - vr-teleoperation
