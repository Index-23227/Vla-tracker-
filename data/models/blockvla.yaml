  parameters: "TODO: not stated in abstract"
  key_innovation: "Adapts pretrained autoregressive VLA backbones into an efficient discrete diffusion policy via a block diffusion paradigm: autoregressive dependencies are kept at the block level while denoising is parallelised within each block. This enables prefix KV-cache reuse across completed blocks, reduces iterative denoising cost, and provides a smooth transition from AR pretraining to diffusion-based policy fine-tuning."

