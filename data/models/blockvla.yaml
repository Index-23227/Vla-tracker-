# Paper: BlockVLA: Accelerating Autoregressive VLA via Block Diffusion Finetuning
# arXiv: 2605.13382

name: BlockVLA
full_name: "BlockVLA: Accelerating Autoregressive VLA via Block Diffusion Finetuning"
organization: "Xi'an Jiaotong University"
date: "2026-05-13"
paper_url: https://arxiv.org/abs/2605.13382
code_url: null
venue: null
open_source: false

architecture:
  action_head: "discrete block diffusion (AR dependency across blocks, parallel denoising within blocks)"
  action_head_category: discrete_diffusion
  parameters: "Prismatic-7B backbone (~7B); SigLIP + DINOv2 vision; 256-bin action tokenization (7 tokens/timestep: 3 trans + 3 rot + 1 gripper); exact trainable count not stated"
  key_innovation: "Adapts a pretrained autoregressive VLA backbone (Prismatic-7B + SigLIP/DINOv2) into a discrete block diffusion policy. Token sequence is split into blocks of size B (e.g., B=14); inter-block dependencies remain autoregressive (block-wise causal mask) while intra-block tokens are denoised in parallel (bidirectional attention within block). This (i) enables prefix KV-cache reuse across completed blocks, (ii) reduces denoising-NFE cost vs full-sequence dLLM, (iii) gives smooth AR-pretraining → diffusion fine-tuning transition. Compares Teacher Forcing vs Diffusion Forcing training objectives; removes token shift for better convergence."

