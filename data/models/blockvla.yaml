    widowx_put_carrot_on_plate: 16.7   # 4/24
    widowx_put_spoon_on_towel: 50.0    # 12/24
    widowx_stack_green_on_yellow: 12.5 # 3/24
    widowx_put_eggplant_in_basket: 62.5 # 15/24
