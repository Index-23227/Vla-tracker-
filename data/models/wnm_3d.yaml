name: WNM-3D
full_name: 'WNM-3D: A World Navigation Model with 3D Scene Conditioning for Closed-Loop
  VLN'
organization: Institute of Artificial Intelligence (China Telecom) / Zhejiang University
  / Tongji University / Shanghai Jiao Tong University
date: '2026-08-07'
paper_url: https://arxiv.org/abs/2608.07267
code_url: null
venue: arXiv preprint
open_source: false
model_type: navigation
tags:
- navigation
- vln
- world-model
- world-action-model
- flow-matching
- diffusion-transformer
- 3d-scene-conditioning
- vggt
- dagger
- grpo
- closed-loop
architecture:
  backbone: Wan2.2-TI2V-5B world-action DiT (frozen video VAE) + frozen VGGT-Omega
    geometry encoder
  llm: Wan2.2-TI2V-5B native language/current-frame cross-attention encoder
  action_head: joint video-action flow matching over a shared Diffusion Transformer
    with block-causal attention (3-DoF dx/dy/dpsi increments, 4 blocks x 8 actions)
  action_space: continuous
  parameters: 5B
  action_head_category: flow_matching
  key_innovation: 3D Scene-to-Token Adapter (23.97M trainable params) turns frozen
    VGGT-Omega features from a 33-frame monocular RGB history into a fixed 450-token
    geometry-aware clean prefix that conditions both future-view and action generation
training:
  dataset: 16K A*-generated instruction-conditioned demonstrations; Stage-II DAgger
    set of ~633K chunks (WNM-3D); Stage-III ~96K policy-generated simulation records
  method: three-stage curriculum - Stage I offline A* SFT (20 epochs), Stage II closed-loop
    DAgger-SFT (5 epochs), Stage III closed-loop DanceGRPO with visual/navigation/stopping
    reward streams (1,500 updates)
  compute: 16x NVIDIA H100, global batch 192 (Stage I/II)
