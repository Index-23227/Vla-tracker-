  libero:
    libero_spatial: 98.5
    libero_object: 99.4
    libero_goal: 97.7
    libero_long: 97.0
    libero_avg: 98.2
    libero_plus_camera: 51.5
    libero_plus_robot: 73.4
    libero_plus_language: 81.8
    libero_plus_light: 96.4
    libero_plus_background: 87.8
    libero_plus_noise: 52.3
    libero_plus_layout: 81.7
    libero_plus_total: 73.0
    source: "Paper Table 1 (TFGCA full) and Table 2 (TFGCA ours, 30k)"
    date_reported: "2026-09-09"
    eval_condition: "Standard LIBERO 4 suites; LIBERO-Plus zero-shot from the LIBERO-trained model"

  libero_ablation:
    pi05_reported_avg: 96.9
    pi05_reproduced_avg: 96.7
    wo_swt_avg: 97.7
    wo_geometry_avg: 97.8
    wo_alignment_avg: 97.1
