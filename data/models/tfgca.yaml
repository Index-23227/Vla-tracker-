    eval_condition: "baseline: pi0.5, same data and steps"

eval_conditions:
  libero: "standard 4 suites; chunk/exec length 10; SWT 1 level"
  libero_plus: "zero-shot from LIBERO checkpoint, 7 perturbation families"
  robotwin_v2: "6-task subset, clean training only, 100 evals per task, clean and randomized"
  real_world: "AgiBot A2, 3 tasks x 20 trials"

tags: [wavelet, frequency, geometric-attention, wedge-product, action-chunking, pi0.5, flow-matching, libero, libero-plus, robotwin_v2, real-robot, agibot]
