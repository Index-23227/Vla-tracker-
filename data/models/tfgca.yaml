# Paper: Time-Frequency Geometric Cross-Attention for Chunked Vision-Language-Action Models
# arXiv: 2609.09925

name: TFGCA
full_name: "Time-Frequency Geometric Cross-Attention for Chunked Vision-Language-Action Models"
organization: "Not stated in the paper (no affiliations printed)"
date: "2026-09-09"
paper_url: https://arxiv.org/abs/2609.09925
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (lerobot/pi05_base, ~4B)"
  llm: "PaliGemma (Gemma-2B) as in pi0.5"
  action_head: "pi0.5 flow-matching action expert with a TFGCA module (~4.23M params) inserted between the transformer's action-token outputs and the linear velocity head"
  action_head_category: flow_matching
  parameters: "~4B + 4.23M (TFGCA)"
  key_innovation: "Drop-in time-frequency geometric cross-attention: hidden action tokens are projected to action space (with an auxiliary alignment loss), decomposed per dimension by a learnable stationary wavelet transform (db2 init) into time-frequency tokens, and each time token cross-attends to them using a learnable blend of dot-product softmax and wedge-product-magnitude softmax (sensitive to near-orthogonal directions). Zero-initialized output projection makes it identity at attachment."

training:
  base_model: "pi0.5 (lerobot/pi05_base)"
  method: "Joint fine-tuning of pi0.5 + TFGCA with L = L_FM + lambda * L_align; AdamW lr 2.5e-5 cosine to 2.5e-6, 30k steps, global batch 64, bf16"
  data: "lerobot/libero; lerobot/robotwin_unified (clean demos only, 30k steps per task); in-house AgiBot A2 data for 3 real tasks"
  hardware: "2x NVIDIA A800 80GB (~26 h LIBERO, ~28 h RoboTwin per job)"

