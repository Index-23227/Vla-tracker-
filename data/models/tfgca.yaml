  robotwin_v2_6task_pi05_baseline:
    clean_avg: 61.3
    randomized_avg: 14.2
    source: "Paper Table 3, pi0.5 column"
    eval_condition: "baseline: pi0.5 under identical protocol"

  real_world:
    soap_into_box_successes_of_20: 6
    plush_toys_into_basket_successes_of_20: 19
    pull_a_tissue_successes_of_20: 12
    real_world_avg: 61.67
