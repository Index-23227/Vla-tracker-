# Paper: DyGRO-VLA: Cross-Task Scaling of Vision-Language-Action Models via Dynamic Grouped Residual Optimization
# arXiv: 2605.17486

name: DyGRO-VLA
full_name: "DyGRO-VLA: Cross-Task Scaling of Vision-Language-Action Models via Dynamic Grouped Residual Optimization"
organization: "Affiliations from Shenzhen and Guangdong institutions (specific institutions not enumerated in arXiv abstract page; authors: Sixu Lin, Yunpeng Qing, Litao Liu, Ming Zhou, Ruixing Jin, Xiaoyi Fan, Guiliang Liu)"
date: "2026-05-17"
paper_url: https://arxiv.org/abs/2605.17486
code_url: null
venue: null
open_source: false

architecture:
  action_head: "Two-stage cross-task RL framework. Stage 1 (offline pre-training): Information Bottleneck objective max I(Z;A) - lambda_IB * I(Z;O), implemented via variational lower bound L_base = E[-log pi(a|z)] + lambda_IB * MINE-style term. Stage 2 (online fine-tuning): Mixture-of-RL-Residuals (MoRR) — Delta_a = sum omega_i(z_T) * a_tilde_i, with routing omega over expert residual policies guided by task embeddings learned via contrastive loss. RL optimizer is a Soft Actor-Critic variant with h-step action chunking."
  action_head_category: other
  backbone: "DINOv2 vision encoder + SigLIP language model + Qwen2.5-0.5B LLM"
  parameters: "0.5B+ (Qwen2.5-0.5B core LLM; total with vision/language modules not stated explicitly)"
  key_innovation: "DyGRO-VLA addresses the common pitfall where RL fine-tuning collapses generalist VLAs into narrow task-specific policies. The framework decouples representation learning (Stage 1, IB objective + contrastive task embeddings) from policy optimization (Stage 2, Mixture-of-RL-Residuals). Eight expert residuals dynamically route based on task embeddings, predicting policy adjustments rather than modifying the base policy directly. Achieves LIBERO 97.1% avg (+4.4 over offline base), RoboTwin2 79.2% (4 task subset), and Sim2Real 57.5% across 4 real-world tasks."

