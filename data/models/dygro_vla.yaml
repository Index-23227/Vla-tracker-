    notes: "Strongest baseline pi0 reports 94.4% avg (Spatial 98.0/Object 96.8/Goal 94.4/Long 88.4). DyGRO-VLA (SFT) reports 92.6%, (Offline) 92.7%, full DyGRO-VLA RL 97.1%."
