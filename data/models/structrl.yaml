name: StructRL
full_name: "StructRL: Structured Action-Space Exploration for Flow-Based VLAs"
organization: "Fudan University / Singapore Management University / Shanghai AI Laboratory"
date: "2026-08-15"
paper_url: https://arxiv.org/abs/2608.15139
code_url: null
venue: null
open_source: false
model_type: "RL post-training framework for flow-based VLAs"

architecture:
  backbone: "Applied to three flow-based VLAs: GR00T N1.5, pi0, pi0.5 (few-shot SFT checkpoints from piRL)"
  llm: "Inherits host VLA's VLM (PaliGemma for pi0/pi0.5, Eagle for GR00T N1.5)"
  action_head: "Host flow-matching action decoder run as deterministic ODE + structured action-space noise head (lightweight MLP predicting group-wise scales, AR(1) temporal correlation)"
  action_head_category: flow_matching
  parameters: "Host VLA + small MLP noise-scale head"
  key_innovation: "Identifies Structured Noise Dilution (in-chain noise is filtered by remaining denoising steps). Relocates policy stochasticity to the action space: deterministic ODE decoder, AR(1)-correlated noise with separate position/rotation/gripper scales injected after denoising, and last-step replay so policy-gradient updates reach the flow decoder via the final Euler step without chain-level likelihoods."

training:
  dataset: "Few-shot SFT checkpoints (from piRL) fine-tuned online in LIBERO, ManiSkill, CALVIN simulation; real-world Franka FR3 tasks initialized from SFT on 10 demos"
  method: "Online RL: PPO in simulation (action-space likelihood via last-step replay); asynchronous off-policy AWAC with expectile value function and human interventions on the real robot (T=1 ODE step)"
  compute: "4x NVIDIA A800 GPUs (simulation); 1 rollout GPU + 4 learner GPUs (real robot)"

inference_hz: null

