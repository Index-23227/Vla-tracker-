# Paper: Large Discrete Policy: Advancing Explicit Behavior Modeling with Stochastic Iterative Scoring
# arXiv: 2609.07049

name: LDiP
full_name: "Large Discrete Policy: Advancing Explicit Behavior Modeling with Stochastic Iterative Scoring"
organization: "Fudan University / NVIDIA"
date: "2026-09-07"
paper_url: https://arxiv.org/abs/2609.07049
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "LDiP-VLA: Qwen3-VL-2B (frozen, two-system design following GR00T-N1) feeding a separate action decoder; end-to-end planning variants use ResNet34 / ViT-L / V2-99 image backbones"
  action_head: "Fully discrete scorer: K-Means action vocabulary (16,384 4-s trajectories for driving; 6,666-16,384 chunks for manipulation) tokenized by a 1D-conv tokenizer, cross-attention-only Transformer decoder + MLP scoring heads; iterative TopK pruning (16,384 -> 512 -> 16 -> argmax) with Gumbel score perturbation"
  action_head_category: other
  parameters: "Qwen3-VL-2B + action decoder (LDiP-VLA)"
  key_innovation: "Stochastic iterative scoring over a fixed, physically plausible action vocabulary: candidates are re-scored and pruned over several stages by a weight-shared decoder, and exploration is injected by Gumbel noise on scores (not on actions) during training; soft-label cross-entropy imitation (Hydra-MDP style) plus driving-metric heads."

training:
  method: "Imitation learning with distance-based soft-label cross-entropy at every scoring stage; driving adds BCE heads for PDM sub-metrics"
  data: "NAVSIM navtrain (103K scenes); Robomimic Lift/Can/ToolHang and PushT"
  hardware: "8x A100, 8 epochs (VLA); 24x A100, 20 epochs (end-to-end planning)"

