architecture:
  action_head: "pi_0 foundation model action head augmented with a Hyperbolic Autoencoder (HAE) memory module — MLP encoder/decoder mapping VLA hidden states into a 513-dim Lorentz manifold; entailment-constrained Cone Tree retrieval with beam width k=3; background consolidation via geometric interpolation and structural splitting (virtual memory synthesis). Memory injected as a residual into the suffix embedding: E'_suffix = E_suffix + proj(alpha_t * (v_prior - h_last)), with injection strength alpha_0 = 0.03."
  action_head_category: other
  parameters: "Lightweight HAE MLP on top of pi_0; pi_0 parameter count unchanged. Latent dim n+1 with n=512."
  key_innovation: "Continuous hierarchical memory in the Lorentz hyperbolic space. A hyperbolic autoencoder maps pi_0 hidden states onto a Lorentz manifold where entailment penalties enforce parent-child semantics, building a tree organized by Cone Tree retrieval. A background consolidation thread continuously interpolates and splits nodes (virtual memory synthesis), giving plug-and-play long-horizon memory: +12.78% absolute on LIBERO-Long over vanilla pi_0 and +11.7 avg on real-world tabletop tasks."

