  key_innovation: "ECHO (Experience Consolidation and Hierarchical Organization) is a memory framework that maps VLA hidden states into a Continuous Hierarchical Space via a hyperbolic autoencoder. Hyperbolic metrics and entailment constraints organize experience vectors into a semantic memory tree supporting efficient top-down retrieval, while a background consolidation mechanism continually refines the tree through geometric interpolation and structural splitting (virtual memory synthesis). Integrated into pi_0, it improves long-horizon and compositional generalization."

