name: ECHO
full_name: "ECHO: Experience Consolidation and Hierarchical Organization — Continuous Hierarchical Memory for Vision-Language-Action Models"
organization: "Xi'an Jiaotong University (School of Software; School of Artificial Intelligence; State Key Laboratory of Human-Machine Hybrid Augmented Intelligence)"
date: "2026-05-09"
