training:
  dataset: "RLBench (CoppeliaSim, OMPL expert demos): 6 tasks x 13 training viewpoints (15-deg intervals) x 100 demos. Real-world: Franka Research 3 + RealSense D435i, 5 tasks x 5 training camera views x 100 demos"
  method: "End-to-end joint objective L = L_act + 0.1 * L_ext; L_act inherits base VLA action loss (flow matching for pi0), L_ext is MSE on hand-eye translation and axis-angle rotation. Ground-truth hand-eye matrices used only as training supervision; no extrinsics at deployment"
  hardware: "8x NVIDIA H100 80GB"

