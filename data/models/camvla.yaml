architecture:
  backbone: "Base VLA backbones: instantiated on pi0 (PaliGemma VLM + flow-matching action expert) and GR00T N1.7; single third-person monocular RGB (224x224), no wrist camera, no depth"
  action_head: "Two parallel heads on top of the base VLA: (1) Action Head (base VLA's action expert, e.g. pi0 flow matching) predicting camera-centric delta 6-DoF end-effector actions (axis-angle rotation) in the local camera frame; (2) auxiliary Geometric Head (3-layer MLP, GELU, hidden dim 1024, +6.30M params) regressing the 6-DoF hand-eye matrix (translation + axis-angle rotation) from mean-pooled image-encoder visual tokens. A deterministic geometric transformation composes them into base-frame actions (delta actions depend only on the rotation Rt)"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "3244.4M (pi0-based; +6.30M / 0.19% overhead over pi0's 3238.1M)"
  key_innovation: "Calibration-free, depth-free, single-view viewpoint-robust VLA. Decouples the policy into camera-centric action generation ('how should I move?') and camera-perspective geometric grounding ('where am I looking from?'): the policy self-predicts the hand-eye matrix from monocular RGB instead of requiring known extrinsics (unlike OC-VLA, 4D-VLA, AnyCamVLA). Delta actions transform as free vectors (dp_b = R*dp_c), so execution is mathematically independent of the predicted translation, confining viewpoint errors to rotation only (1.41 deg mean error in sim). On RLBench unseen viewpoints: pi0 33.2 -> 51.4% (+18.2), GR00T N1.7 28.4 -> 38.4% (+10.0); real-world 15-deg camera offset: pi0 16.0 -> 29.3%, GR00T 14.7 -> 33.0%. Only +1 ms inference latency (62 vs 61 ms on RTX 4090)"

