# Paper: StreamPI: Streaming Multimodal Temporal Modeling for Vision-Language-Action Models
# arXiv: 2608.26067

name: StreamPI
full_name: "StreamPI: Streaming Multimodal Temporal Modeling for Vision-Language-Action Models"
organization: "The University of Hong Kong / ACE Robotics"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.26067
code_url: https://happinesslz.github.io/projects/StreamPI
venue: arXiv
open_source: false

architecture:
  backbone: "pi0.5 (PaliGemma VLM + action expert), all pretrained weights inherited; no new parameters"
  action_head: "pi0.5 flow-matching action expert, conditioned on streaming multi-frame context via KV cache"
  action_head_category: flow_matching
  parameters: "Same as pi0.5 (zero additional parameters)"
  key_innovation: "Parameter-free temporal extension of pi0.5 by restructuring the attention mask: each (multi-view observation, language instruction) pair is an atomic temporal unit with bidirectional intra-pair attention and causal inter-pair attention, so the instruction is re-anchored at every frame and past units are reused from a KV cache at inference. Random-interval streaming training samples inter-frame gaps delta ~ U[3,7] plus temporal masking of the earliest k frames, bridging synchronous training and asynchronous deployment. Relies on LLM length extrapolation; supports T=1/3/5 inference from one model. 5-frame streaming adds 9.2 ms over single-frame (103.6 vs 94.4 ms on RTX 4090)."

training:
  base_model: "pi0.5"
  method: "Full fine-tuning of pi0.5 with streaming frames T=3/5 and random intervals; same optimizer and LR schedule as pi0.5"
  data: "LIBERO (batch 256, 30k iterations); 100 teleoperated demos per real task at 30 FPS (batch 128, 50k iterations)"
  hardware: "8x NVIDIA H100"

