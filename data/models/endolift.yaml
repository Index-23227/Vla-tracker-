eval_conditions:
  real_world: "Robotic flexible endoscope (feeding unit + 2-axis bending), 480x480 RGB tip camera, 20 Hz control; colon phantom seen, lung/stomach phantoms unseen; ex-vivo porcine trachea"
  notes: "Medical endoscopy VLA; not a manipulation benchmark"

