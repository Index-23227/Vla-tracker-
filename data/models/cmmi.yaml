# Paper: A Collaborative Multi-Modality Interaction for VLA-based End-to-End Autonomous Driving
# arXiv: 2608.20890

name: CMMI
full_name: "A Collaborative Multi-Modality Interaction for VLA-based End-to-End Autonomous Driving"
organization: "National University of Singapore (Show Lab) / Hunan University / The University of Western Australia"
date: "2026-08-21"
paper_url: https://arxiv.org/abs/2608.20890
code_url: https://github.com/S-JingTao/CMMI
venue: arXiv preprint
open_source: true
model_type: vla

architecture:
  backbone: "Janus-1.5B VLA backbone (following WAM-Flow); camera + LiDAR inputs; image 384x384 -> 576 visual tokens, 196 LiDAR BEV tokens; Janus tokenizer extended with 20,001 numerically grounded tokens; camera-LiDAR interaction via Affinity-Guided Optimal Transport + Distribution-Consistent Modality Transfer"
  llm: "Janus-1.5B"
  action_head: "Discrete Flow Matching (DFM) multi-trajectory planner over numeric waypoint tokens (WAM-Flow-style), 5 candidate trajectories x 8 waypoints, trained with match + diversity + consistency losses; followed by training-free Perception-Oriented Trajectory Refinement (CHOMP-inspired optimization with prior, detection/semantic risk cost maps and smoothness cost)"
  action_head_category: discrete_diffusion
  action_space: discrete
  parameters: "1.5B (Janus-1.5B backbone)"
  key_innovation: "Optimal-transport-based two-way main-auxiliary modality interaction (camera <-> LiDAR) and distribution-consistent modality transfer inside a VLA driving model, jointly trained for 3D detection, BEV map segmentation and trajectory planning; multi-trajectory DFM planning refined at inference by a perception-derived driving risk cost map without additional policy training."

training:
  dataset: "nuScenes (perception pretraining), NAVSIM (planning fine-tuning), Bench2Drive, Argoverse 2 Sensor"
  method: "Two-stage: (1) multi-modal interactive model trained for 3D detection + BEV segmentation (20 epochs perception pretraining on nuScenes); (2) fine-tuned for language-guided trajectory prediction with auxiliary perception supervision; four sequential training phases for planning; AdamW, weight decay 0.01"
  compute: "8x NVIDIA A6000 48GB"

