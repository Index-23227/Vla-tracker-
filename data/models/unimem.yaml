name: UniMem
full_name: "UniMem: Unifying Multimodal Memory and Control for Vision-Language-Action Models"
organization: "Stanford University"
date: "2026-08-24"
paper_url: https://arxiv.org/abs/2608.22869
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "pi0.5 (PaliGemma VLM backbone + Gemma action expert); SigLIP vision encoder modified into a keyframe encoder with interleaved causal temporal self-attention that reuses each layer's own Q/K/V and layer-norm weights"
  action_head: "pi0.5 flow-matching action expert (objective unchanged), conditioned on textual event memory and cached keyframe hidden states; an MLP event-classifier head on the backbone final-layer latent z_t triggers memory updates"
  action_head_category: flow_matching
  parameters: "pi0.5 backbone (size not stated in paper) + MLP event classifier head"
  key_innovation: "Unifies memory and control in one VLA: an event classifier head on the backbone latent detects sparse task-critical milestones, appending the event text to a textual history M_t and the corresponding multi-view frames to a keyframe memory H_t (up to 3-4 keyframes); keyframe hidden states are cached before temporal attention so historical frames are not re-encoded, keeping ~90 ms single-frame inference. Trained end-to-end (LoRA) with flow-matching loss + 0.1 x class-weighted event cross-entropy (w_null=0.02); event labels generated by an LLM-written labeling script."

benchmarks:
  robosuite_memory:
    updown: 100
    updown3times: 96
    occludedtap: 96
    updownspatial: 79
    platerecall: 96
    avg: 93.4
    source: "Paper Table I, Ours column"
    eval_condition: "robosuite 7-DoF Franka Panda, 5 non-Markovian memory tasks, N=25 per task; UpDown3Times is mean subtask success, UpDownSpatial is a continuous spatial-accuracy score"

  robosuite_memory_video_encoder_baseline:
    updown: 84
    updown3times: 16
    occludedtap: 96
    updownspatial: 49
    platerecall: 96
    avg: 68.2
    source: "Paper Table I, pi0.5 + V.E. column"
    eval_condition: "baseline: pi0.5 with video encoder over frames sampled at fixed 6-second intervals (|K|=4)"

  robosuite_memory_no_memory_ablation:
    updown: 52
    updown3times: 22
    occludedtap: 60
    updownspatial: 6
    platerecall: 8
    avg: 29.6
    source: "Paper Table I, N.M. column"
    eval_condition: "ablation: no memory (vanilla pi0.5, trained with auxiliary classifier supervision)"

  robosuite_memory_text_only_ablation:
    updown: 96
    updown3times: 93
    occludedtap: 88
    updownspatial: 30
    platerecall: 20
    avg: 65.4
    source: "Paper Table I, T.O. column"
    eval_condition: "ablation: text memory only (current images only)"

  robosuite_memory_keyframe_only_ablation:
    updown: 92
    updown3times: 23
    occludedtap: 100
    updownspatial: 52
    platerecall: 96
    avg: 72.6
    source: "Paper Table I, K.O. column"
    eval_condition: "ablation: keyframe memory only (no textual memory)"

  real_world:
    hammermeasure: 87
    beanscoop: 93
    tableclean: 80
    tapscooppour: 60
    avg: 80.0
    source: "Paper Table II, Ours column"
    eval_condition: "UFactory xArm6, wrist + external cameras, ~10 Hz with real-time chunking, 4 non-Markovian tasks, N=15 per task, |K|=4 keyframes"

  real_world_memer_baseline:
    hammermeasure: 87
    beanscoop: 67
    tableclean: 13
    tapscooppour: 7
    avg: 43.5
    source: "Paper Table II, MemER column"
    eval_condition: "baseline: MemER hierarchical memory with pi0.5 low-level policy"

  real_world_no_memory_ablation:
    hammermeasure: 13
    beanscoop: 0
    tableclean: 0
    tapscooppour: 7
    avg: 5.0
    source: "Paper Table II, N.M. column"
    eval_condition: "ablation: no memory"

  real_world_text_only_ablation:
    hammermeasure: 53
    beanscoop: 27
    tableclean: 0
    tapscooppour: 7
    avg: 21.8
    source: "Paper Table II, T.O. column"
    eval_condition: "ablation: text memory only"

  real_world_keyframe_only_ablation:
    hammermeasure: 53
    beanscoop: 20
    tableclean: 47
    tapscooppour: 27
    avg: 36.8
    source: "Paper Table II, K.O. column"
    eval_condition: "ablation: keyframe memory only"

training:
  datasets: ["Human-teleoperated demonstrations in robosuite (10 Hz)", "Human-teleoperated xArm6 demonstrations (20 Hz)"]
  method: "LoRA fine-tuning of pi0.5 end-to-end with L = L_flow + 0.1 * L_event (class-weighted CE, w_null=0.02); keyframe encoder trained end-to-end during fine-tuning without separate pretraining; event labels produced by a Claude-generated labeling script with partial human verification; decisive moments upsampled ~4x for BeanScoop and TapScoopPour"

eval_conditions:
  robosuite_memory: "5 simulated non-Markovian memory tasks (UpDown, UpDown3Times, OccludedTap, UpDownSpatial, PlateRecall), N=25, human-judged binary subtask success"
  real_world: "4 xArm6 hardware memory tasks (HammerMeasure, BeanScoop, TableClean, TapScoopPour), N=15, human-judged"

tags: [memory, non_markovian, event_detection, keyframe_memory, textual_memory, pi0_5, flow_matching, lora, long_horizon, real_robot, robosuite]
