    libero_plus_light: 93.6
    libero_plus_background: 93.5
    libero_plus_noise: 76.8
    libero_plus_layout: 80.9
    libero_plus_total: 74.1
    libero_avg: 74.1
    source: "Paper Table 1 (LIBERO-plus 7 perturbation categories, ProbeAct on top of OpenVLA-OFT baseline)"
    date_reported: "2026-06-08"
    eval_condition: "LIBERO-plus benchmark; baseline OpenVLA-OFT 69.6% total -> ProbeAct 74.1% total (+4.5 points)"

eval_conditions:
  libero_plus_main: "ProbeAct vs 7 SOTA VLAs on LIBERO-plus: OpenVLA 15.6, NORA 39.0, WorldVLA 25.0, UniVLA 43.9, pi0 53.6, pi0-Fast 61.6, RIPT-VLA 68.4, OpenVLA-OFT 69.6, ProbeAct 74.1 (highest overall)"
  mixdata_generalization: "OpenVLA-OFT-mixdata + ProbeAct on Robot Initial States category across LIBERO 4 suites: Spatial 30.6->32.6 (+2.0), Object 23.9->30.7 (+6.8), Goal 20.8->25.7 (+4.9), Long-10 36.6->39.7 (+3.1); avg 28.0->32.2"
  action_drift_analysis: "On 300 LIBERO-plus Object Layout episodes, ground-truth object position error: probe 6.9 cm vs action endpoint 23.6 cm overall; on failure episodes probe 10.4 cm vs endpoint 34.9 cm — empirical evidence that hidden state retains spatial info while action head collapses"
  probe_layer_ablation: "Layer 8 + img-spatial pooling = R^2 0.968 (best); deeper layers decay (layer 28: 0.934). Spatial pooling beats img-mean / last-token / lang-mean at every layer."
  step_efficiency: "On 1643 tasks both succeed: ProbeAct adds only +6 steps (114->120, ~5% overhead). On 151 tasks rescued from baseline failure: 197 steps vs 600 timeout (-403 steps). Across all 2591 tasks: ProbeAct avg 255 steps vs baseline 275 (-20 net)."
  hardware: "2x NVIDIA RTX PRO 6000 (Blackwell) GPUs"

