name: Remember-Smarter
full_name: "Remember Smarter: Visual History Compressor and Hyperbolic Experience Space for Robotic Memory"
organization: "Xidian University"
date: "2026-08-15"
paper_url: https://arxiv.org/abs/2608.15269
code_url: null
venue: arXiv
open_source: false

architecture:
  backbone: "pi0 (PaliGemma VLM with SigLIP encoder + flow-matching action expert), initialized from the official pi0-LIBERO checkpoint via openpi"
  action_head: "pi0 flow-matching action expert; a residual history cross-attention reader (4 heads, gamma=0.05) injects Mamba visual-history memory into suffix_out before action_out_proj at every flow step; four geodesic experience tokens + a [MEM_QUERY] token are inserted into the VLM prompt"
  action_head_category: flow_matching
  parameters: "pi0 backbone (size not stated in paper) + visual Mamba compressor (d=256, state 16) + history reader + P-VAE experience modules"
  key_innovation: "Two complementary memory branches added to a pretrained VLA. (1) Visual Mamba Compressor: frozen SigLIP patches of 3 views -> adapter -> bidirectional serpentine spatial Mamba + learned-query pooling per frame -> two causal temporal Mamba layers per view (64-frame history at 1 FPS, state-passing TBPTT of 16 in training, fixed-shape recurrent state at inference). (2) Hyperbolic experience space: final-layer hidden states of successful demonstrations embedded by a Poincare VAE, organized by a HypHC-inspired binary tree with Karcher-mean prototypes and entailment-cone calibration; a non-blocking beam search retrieves up to 8 leaves, and 4 points on the geodesic from the query to their lowest common ancestor are decoded into prompt tokens."

