    libero_plus_robot: 45.8
    libero_plus_language: 65.3
    libero_plus_light: 92.1
    libero_plus_background: 94.0
    libero_plus_noise: 81.2
    libero_plus_layout: 78.0
    libero_plus_total: 70.6
    source: "LIBERO-Plus: Paper Table 1, pi0+RS row (Total over all 10,030 instances). Standard LIBERO: Section 5.3 text (Long 94.2, four-suite overall 96.2, mean of 5 runs); Spatial/Object/Goal appear only in Figure 5 and are omitted"
    eval_condition: "pi0+RS adapted from the official pi0-LIBERO checkpoint using only original LIBERO demonstrations; LIBERO-Plus evaluated zero-shot (no LIBERO-Plus training), each instance once; standard LIBERO component study trains per suite"

