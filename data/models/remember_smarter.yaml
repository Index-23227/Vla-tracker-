  real_world_pi0_baseline:
    press_2: 64
    press_4: 20
    press_6: 0
    order: 20
    occluded_placement: 72
    chenchen_simple: 64
    chenchen_hard: 20
    source: "Paper Table 2, pi0 row"
    eval_condition: "baseline: pi0 under the same real-robot protocol"

training:
  datasets: ["LIBERO original demonstrations", "real-robot demonstrations for Press-2, Order, Occluded placement, Chenchen-simple"]
  method: "Initialized from released pi0 checkpoint; Stage A 5k steps training RS adapter, visual Mamba compressor and history reader; Stage B 25k steps training RS modules and action-side parameters with the PaliGemma prefix frozen; global batch 32, 4-device FSDP, grouped AdamW, EMA 0.999; P-VAE / hierarchy built from successful episodes after policy training"

eval_conditions:
  libero: "LIBERO-Plus zero-shot robustness (7 perturbation dimensions, 10,030 instances) plus standard LIBERO four-suite component study"
  real_world: "strict success: every subgoal in order; wrong object/order, extra press, safety stop, timeout or intervention counts as failure"

tags: [memory, visual_history, mamba, state_space_model, hyperbolic_embedding, experience_retrieval, long_horizon, pi0, flow_matching, libero_plus, real_robot]
