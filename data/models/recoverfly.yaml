training:
  datasets: ["TravelUAV (UAV-Need-Help task): 7,922 training trajectories; long-tailed scene distribution"]
  method: "Online RL post-training initialized from the AerialVLA checkpoint. Only the LoRA adapter and the added value head are optimized; objective L = -J_PPO^token + c_v * L_V + beta * L_KL with GAE advantages. Two stages: Stage I samples scenes by empirical frequency and regularizes toward the initial VLA policy; Stage II uses equal per-scene quotas and regularizes toward the final Stage I policy. Dynamic failure replay samples fresh and failed task instances at replay ratio eta; entries unsolved after N_max attempts are dropped. Implemented on RLinf with AirSim, the TravelUAV environment, and the AerialVLA action-token pipeline."
  compute: "8x NVIDIA A100 (80GB), approximately 21 hours; total rollout budget (including failure replays) about 30% of the training-set size"

eval_conditions:
  travel_uav: "closed-loop AirSim / TravelUAV simulation only; no physical UAV deployment. Baseline numbers are quoted from the original publications on the same splits."

