name: RecoverFly
full_name: "RecoverFly: A Failure-Aware Reinforcement Learning Post-Training Framework for Aerial Vision-Language Navigation"
organization: "Jilin University / Tsinghua University / Beihang University / Zhongguancun Academy"
date: "2026-08-10"
paper_url: https://arxiv.org/abs/2608.09467
code_url: null
venue: null
open_source: false
model_type: aerial_vln

architecture:
  backbone: "AerialVLA (OpenVLA-7B backbone with LoRA adapter) used as the initial policy; an added value head enables actor-critic optimization"
  llm: "OpenVLA-7B (Llama-2 7B based VLA), inherited via AerialVLA"
  action_head: "Grammar-constrained autoregressive action-token decoding: three numerical control tokens plus an optional LAND token, each control dimension uniformly quantized into 99 bins over [0,5] (forward), [-5,5] (vertical), and [-pi,pi] (yaw); a deterministic detokenizer maps valid sequences to continuous 3-DoF commands, and unparseable sequences map to a safe no-op with an invalid-action penalty"
  action_head_category: autoregressive
  parameters: 7B
  key_innovation: "Failure-aware online RL post-training of an end-to-end UAV-VLA policy, combining (1) token-level PPO that applies the clipped surrogate separately to each valid action token while sharing the action-level GAE advantage, with a value head and event-aware reward (clipped distance progress plus success/collision/stuck/away/early-stop/timeout events); (2) dynamic failure replay that stores unresolved task initializations (not stale trajectories) with active/solved/dropped states and regenerates each rollout under the current policy, preserving on-policy PPO; (3) a two-stage long-tail scene curriculum (Stage I samples scenes by empirical frequency, Stage II uses equal per-scene quotas); (4) stage-wise frozen reference-policy KL regularization (Stage I anchors to the initial VLA policy, Stage II to the final Stage I policy)."

