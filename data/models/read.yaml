    dac: 98.0
    ttc: 95.4
    comfort: 100.0
    ep: 85.5
    source: "Paper Table I, READ (VLA setting) row"
    date_reported: "2026-09-11"
    eval_condition: "NAVSIM v1 navtest, open-loop PDMS; Qwen3-VL-2B VLA with front-view image"

  navsim_v1_e2e_read:
