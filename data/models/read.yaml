# Paper: READ: Learning Risk-Informed Fields for End-to-End Autonomous Driving
# arXiv: 2609.12371

name: READ
full_name: "READ: Learning Risk-Informed Fields for End-to-End Autonomous Driving"
organization: "School of Vehicle and Mobility, Tsinghua University"
date: "2026-09-11"  # arXiv stamp on the PDF (2609.12371v1, 11 Sep 2026)
paper_url: https://arxiv.org/abs/2609.12371
code_url: null  # Not stated in the paper
venue: "Not stated in the paper"
open_source: false  # code/weights release not stated in the paper
model_type: driving_vla

architecture:
  backbone: "Qwen3-VL-2B fine-tuned (VLA setting): front-view image + navigation text + learnable risk latent tokens + trajectory queries; E2E variants use TransFuser ResNet or a Drive-JEPA-initialized ViT with BEV queries"
  llm: "Qwen3-VL-2B"
  action_head: "Query-based trajectory decoder: trajectory queries attend to context tokens and risk-token states, then predict waypoints and scores"
  action_head_category: regression
  parameters: "2B-class VLM (Qwen3-VL-2B); exact count not stated in the paper"
  key_innovation: "Learned continuous spatiotemporal Gaussian risk field (80 m x 64 m, 1 m resolution, 8 slices over 4 s) supervised only by partial constraints: non-drivable map cells, future agent boxes, global sparsity, low risk along the expert path, and a kinematic-residual (constant-velocity) query; used as auxiliary loss (L_traj + beta*L_field) through risk latents in the VLA, and optionally as a differentiable post-hoc trajectory refiner"

training:
  base_model: "Qwen3-VL-2B (VLA); TransFuser / Drive-JEPA ViT (E2E)"
  method: "Joint trajectory + risk-field supervision; VLA fine-tuned 20 epochs on 8x A100; E2E trained 40 epochs on 2x A100"
  data: "NAVSIM"

