    libero_object: 98.4
    libero_goal: 96.2
    libero_long: 89.8
    libero_avg: 95.8
    libero_5_suite_avg: 95.8
    source: "AffordanceVLA paper Table 1 (full model), 50 rollouts per suite"
    date_reported: "2026-04-10"
    eval_condition: "fine-tuned (Stage III post-training on LIBERO)"
  calvin:
    calvin_abc_d_1: 96.8
    calvin_abc_d_2: 92.0
    calvin_abc_d_3: 87.5
    calvin_abc_d_4: 80.8
    calvin_abc_d_5: 75.9
    calvin_abc_d_avg_len: 4.33
    calvin_avg: 4.33
    source: "AffordanceVLA paper Table 2 (full model), 1000 rollouts on ABC->D"
    date_reported: "2026-04-10"
    eval_condition: "fine-tuned (Stage III post-training on CALVIN), zero-shot OOD ABC->D protocol"
  real_world:
    basic_tasks_avg: 88.3
    complex_tasks_avg: 82.9
    source: "AffordanceVLA paper Table 5, 15 trials per task on 8 basic + 3 complex tasks"
    date_reported: "2026-04-10"
    eval_condition: "fine-tuned with DROID pre-training + in-house demonstrations"

eval_conditions:
  libero: "fine-tuned, three-stage progressive training (Stage I + II + III)"
  calvin: "fine-tuned on ABC->D, zero-shot OOD on D"
  real_world: "DROID pre-trained + in-house fine-tuned"

