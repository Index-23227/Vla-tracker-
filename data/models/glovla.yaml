# Paper: GloVLA: Let Geometry Move and Local VLA Interact for Robust Object-Centric Manipulation in Unstructured Environments
# arXiv: 2609.06256

name: GloVLA
full_name: "GloVLA: Let Geometry Move and Local VLA Interact for Robust Object-Centric Manipulation in Unstructured Environments"
organization: "VinRobotics; Austrian Institute of Technology; Hanoi University of Science and Technology; VinUniversity; DFKI; University of Stuttgart; University of Arkansas"
date: "2026-09-05"
paper_url: https://arxiv.org/abs/2609.06256
code_url: https://glovla-project.github.io/
venue: arXiv preprint (submitted to IEEE)
open_source: false
model_type: vla

architecture:
  backbone: "Model-agnostic; instantiated with pi0, pi0.5, GR00T N1.6 and GR00T N1.7 (GR00T N1.6 used for the robustness / real-robot study)"
  action_head: "Backbone's native action head (GR00T N1.6 flow-matching DiT in the main study) inside two local policies (grasp, place), combined with a proportional Cartesian transport controller that moves the end-effector to object-centric handoff positions"
  action_head_category: hybrid
  action_space: "LIBERO 7-D OSC pose; chunks at backbone-native horizon (50 for GR00T N1.6, 40 for N1.7, 10 for pi0/pi0.5), 8 actions executed per query"
  key_innovation: >
    Factorizes object-centric pick-and-place into geometric transport and local VLA interaction.
    Sphere-conditioned demo extraction carves grasp and place clips (within radius r_o / r_b of the
    object / basket centre) out of the same source demos; two local policies are fine-tuned
    separately on these clips with fixed phase instructions. At run time a clipped P-controller drives
    the end-effector to a handoff position (object centre + fixed offset), then the local VLA takes
    over. Object centres come from simulator state in sim and SAM 3 segmentation on the real robot.

training:
  method: "Two independently fine-tuned local policies (grasp / place) on extracted demo clips, no extra demonstrations; FullVLA baseline trained on complete trajectories from the same demos"
  optimizer: "Adam, LR 1e-4"
  hardware: "8x NVIDIA A100 80GB (training); RTX 5090 (evaluation)"

