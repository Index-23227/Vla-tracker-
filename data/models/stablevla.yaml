    libero_long: 93.6
    libero_avg: 96.65
    source: "arXiv:2605.18287 Table 1 (clean evaluation)"
    date_reported: "2026-05-18"
    eval_condition: "fine-tuned; clean evaluation; per-suite averages over 3 seeds"
    notes: "Under high-severity corruption (ImageNet-C levels 3-5) the model maintains substantially higher robustness than 7B baselines such as OpenPi-0.5; corruption-averaged scores reported separately in the paper."
  calvin:
    calvin_abc_d_avg_len: 4.17
    calvin_avg: 4.17
    source: "arXiv:2605.18287"
    date_reported: "2026-05-18"
    eval_condition: "fine-tuned; clean ABC->D long-horizon chain (average completed tasks out of 5); 2.13 under high-severity corruption"

eval_conditions:
  visual_robustness: "ImageNet-C 19 corruption types at severity levels 3-5; zero-shot (no corruption training)"
  long_horizon: "LIBERO-Long 93.6% clean; CALVIN 4.17 avg-len clean; degradation under corruption is substantially smaller than 7B baselines"
  real_world: "Astribot S1; 4 tasks (Pick and Place, Throw Basketball, Pour Water, Pack Doll); -14 to -18pp drop under corruption vs -25 to -49pp for VLA-Adapter and -30 to -42pp for OpenPi-0.5"

