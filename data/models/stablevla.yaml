# Paper: StableVLA: Towards Robust Vision-Language-Action Models without Extra Data
# arXiv: 2605.18287

name: StableVLA
full_name: "StableVLA: Towards Robust Vision-Language-Action Models without Extra Data"
organization: "Peking University, Tsinghua University, Astribot, Nanjing University, Nankai University"
date: "2026-05-18"
paper_url: https://arxiv.org/abs/2605.18287
code_url: https://github.com/DAGroup-PKU/HumanNet/tree/main/src/model/StableVLA
venue: "ICML 2026"
open_source: true

architecture:
  action_head: "Fused Information Bottleneck Adapter (Fused IB-Adapter) on top of a Prismatic-style VLA. Combines a standard MLP pathway with an IB pathway that uses subspace covariance (Gram-matrix) modeling + sigmoid gating + GELU MLP to filter noise from vision-language features. Output Z = MLP(X) + tanh(lambda)*IB-Adapter(X) with stochastic pathway dropout p_drop."
  action_head_category: other
  backbone: "Qwen2.5-0.5B LLM + DINO-SigLIP (224px) vision encoder (frozen)"
  parameters: "0.5B (Qwen2.5-0.5B backbone) + <10M (Fused IB-Adapter overhead)"
  key_innovation: "Information Bottleneck Adapter (IB-Adapter) is a lightweight (<10M params) information-theoretic adapter that selectively filters noise from visual inputs to improve VLA robustness under unseen real-world visual disturbances without requiring extra data or augmentation. The Fused IB-Adapter uses subspace covariance modeling with sigmoid gating and a dual-pathway design (MLP + IB). Despite a 14x smaller 0.5B backbone trained without Open X-Embodiment pre-training, StableVLA matches the robustness of 7B-scale state-of-the-art VLAs and surpasses OpenPi-0.5 under synthetic (ImageNet-C 19 corruption types) and physical visual corruptions."

benchmarks:
