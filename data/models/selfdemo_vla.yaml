    tnc_avg: 14.0
    overall_avg: 56.8
    source: "Paper Table 5 (row Multi-Task ES+SS (Ours))"
    date_reported: "2026-08-19"
    eval_condition: "Authors' custom RoboTwin 2.0 continual post-training benchmark (ALOHA-AgileX): TSS = 10 mid-training tasks retained via self-demos, TES = 2 new stacking tasks, TNO = novel objects, TNC = novel compositions; 50 seeds per task. Not the standard RoboTwin 2.0 leaderboard protocol"

  robotwin2_continual_baseline_multitask_es:
    tss_avg: 16.6
