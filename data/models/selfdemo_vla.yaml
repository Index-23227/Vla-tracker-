    overall_avg: 43.3
    source: "Paper Table 5 (row Multi-Task ES)"
    date_reported: "2026-08-19"
    eval_condition: "Expert-only full fine-tuning baseline, same custom RoboTwin protocol"

  robotwin2_continual_oracle_rehearsal:
    tss_avg: 85.6
    tes_avg: 97.0
    tno_avg: 30.0
    tnc_avg: 15.3
    overall_avg: 57.0
    source: "Paper Table 5 (row Rehearsal, frame sampling (Oracle))"
    date_reported: "2026-08-19"
    eval_condition: "Oracle with access to stored mid-training data, same custom RoboTwin protocol"

  robotwin2_continual_tss_per_task:
    place_dual_shoes: 42
    beat_block_hammer: 82
    pick_dual_bottles: 48
    place_container_plate: 92
    handover_mic: 62
    place_empty_cup: 92
    place_bread_basket: 58
    lift_pot: 86
    open_microwave: 66
    put_bottles_dustbin: 78
    tss_avg: 70.6
    source: "Paper Table 11 (row Multi-Task ES+SS (Ours))"
    date_reported: "2026-08-19"
    eval_condition: "Per-task retention on the 10 self-supervised (mid-training) RoboTwin tasks after stage-2 post-training, 50 seeds per task"

eval_conditions:
  real_world: "Stationary ALOHA-1 (ViperX 300 arms), top + two wrist RealSense D435 cameras, 30-50 Hz control; IF = instruction following, SR = success rate"
  robotwin2_continual: "RoboTwin 2.0 ALOHA-AgileX with customized D435 camera profile; base policy mid-trained on 10 tasks (90.8% avg) before post-training"

