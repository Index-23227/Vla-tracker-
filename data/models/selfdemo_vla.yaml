    tno_novel_colors_sr: 0
    source: "Paper Table 3 (row pi0.5 Multi-Task ES)"
    date_reported: "2026-08-19"
    eval_condition: "Expert-only fine-tuning baseline, same gear-insertion protocol"

  real_world_heldout_push:
    if_correct_object: 85
    push_motion: 70
    picks_instead: 10
    sr_push_correct_object: 60
    source: "Paper Table 7 (row pi0.5 MT ES+SS (Ours))"
    date_reported: "2026-08-19"
    eval_condition: "Zero-shot evaluation on held-out 'push objects' skill family absent from both fine-tuning mixtures, 20 trials (picks_instead: lower is better)"

  robotwin2_continual:
    tss_avg: 70.6
