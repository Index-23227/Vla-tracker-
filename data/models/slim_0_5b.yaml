name: SLIM-0.5B
full_name: "SLIM-0.5B: Learning Action-Grounded Predictive Latents for Robot Manipulation"
organization: "Fudan University; Beijing Academy of Artificial Intelligence (BAAI); Tsinghua University; Renmin University of China"
date: "2026-08-10"
paper_url: https://arxiv.org/abs/2608.09771
code_url: https://kzz1031.github.io/slim-project-page/
venue: "arXiv preprint"
open_source: false
model_type: vla
inference_hz: 16.5

architecture:
  backbone: "DINOv2-B/14 visual encoder (86.58M, fine-tuned jointly with the policy), two RGB views (workspace + wrist) at 224x224"
  llm: "T5-small language encoder (frozen; embeddings cached, excluded from the reported 0.47B trainable count)"
  action_head: "Flow matching (conditional flow matching velocity field) over continuous action tokens, decoded by a 16-layer Mixture-of-Transformers (MoT) interaction trunk (d=768) with joint observation-action attention and per-stream language cross-attention; 4 flow-sampling steps at inference"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "0.47B (472.14M trainable policy parameters; 558.72M instantiated during Stage 1 including the frozen EMA target encoder)"
  key_innovation: "SLIM (Self-supervised Latent Interaction Model) moves the main control computation out of a large VLM backbone and into a compact MoT that models interactions between observation latents and continuous action tokens. Stage 1 learns action-grounded predictive latents via bidirectional masked trajectory prediction: an inverse-dynamics branch reconstructs the flow-noised action chunk from current and future observation latents, and a forward-dynamics branch predicts masked future observation latents (supervised by a stop-gradient EMA target encoder, JEPA-style) from the current latent plus the clean action chunk. Stage 2 trains the deployable flow-matching policy with no future latent as input, so no pixel decoder, no video rollout, and no explicit future generation is needed at inference."

