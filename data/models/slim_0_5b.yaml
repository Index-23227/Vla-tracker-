    date_reported: "2026-08-10"
    eval_condition: "Five multi-task real-robot manipulation tasks (carrot into bowl, stack three plates, take toast out of toaster, stack blocks, wipe whiteboard), 150 demos each (750 total), trained as a single multi-task policy; 10 trials per task-condition pair; score is 100x mean task-dependent partial-credit progress"
    notes: "pi0.5 baseline average 56.8 (72.0/54.0/47.0/54.0); Fast-WAM average 40.0 (71.0/39.0/48.0/2.0). SLIM leads on nominal, distractor, and lighting; under background shift SLIM 49 vs pi0.5 54."

training:
  datasets: ["LIBERO: Stage 1 mixes LIBERO-90 with the four target suites; Stage 2 uses only LIBERO-10/Object/Spatial/Goal", "CALVIN: language-annotated ABC training split (both stages)", "Real-world: 750 teleoperated demonstrations across five tasks (150 each)"]
  method: "Two stages sharing one MoT backbone. Stage 1 = action-grounded masked trajectory prediction with lambda_IDM=0.125, lambda_FDM=1, EMA momentum 0.999, 3 epochs, 2,000-step warmup. Stage 2 = flow-matching policy only, initialized from the Stage-1 checkpoint, 40 epochs (20 for the real-world policy), EMA target encoder discarded. AdamW (beta1=0.9, beta2=0.95, eps=1e-8, weight decay 0.01), gradient clipping 1.0, cosine decay to 1e-6; LR 1e-4 for the action model, 1e-5 for the visual encoder, 2.5e-5 base for remaining parameters. Global batch size 128 (LIBERO) / 256 (CALVIN). Actions normalized with per-dataset 1st/99th percentile statistics. No additional embodied pretraining (P.T. = x)."
  compute: "8 x NVIDIA H100 80GB, BF16"

eval_conditions:
  libero: "fine-tuned"
  libero_plus: "zero-shot (LIBERO-trained checkpoint, no adaptation)"
  calvin: "zero-shot environment transfer (trained on ABC, evaluated on D)"
  real_world: "fine-tuned (multi-task, trained from 750 physical demonstrations)"

