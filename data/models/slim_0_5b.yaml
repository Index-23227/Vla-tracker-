    libero_goal: 96.8
    libero_avg: 97.5
    libero_plus_camera: 70.73
    libero_plus_robot: 36.90
    libero_plus_language: 87.57
    libero_plus_light: 94.75
    libero_plus_background: 92.01
    libero_plus_noise: 86.07
    libero_plus_layout: 83.21
    libero_plus_overall: 77.45
    source: "arXiv:2608.09771 Table 1 (LIBERO-Plus) and Appendix Table 5 (original LIBERO suites)"
    date_reported: "2026-08-10"
    eval_condition: "Trained only on original LIBERO data; 50 rollouts per task (2,000 rollouts over the four suites). LIBERO-Plus is zero-shot: the same LIBERO-trained checkpoint is evaluated on all 10,030 perturbation cases without adaptation. Action horizon 8, 4 flow-sampling steps."
    notes: "LIBERO-Plus overall 77.45 vs VLA-JEPA 79.5, OpenVLA-OFT 69.6, pi0 69.3, RIPT-VLA 68.4, Fast-WAM 50.0, UnifiedVLA 42.9, NORA 39.0, WorldVLA 25.0, OpenVLA 15.6. SLIM is weakest on the robot-initial-state perturbation (36.90). Original-LIBERO overall 97.5 matches RIPT-VLA (7B) with 0.47B parameters; Fast-WAM 97.6, VLA-JEPA 97.2, OpenVLA-OFT 97.1."
