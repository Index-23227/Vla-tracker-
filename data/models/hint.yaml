# Paper: HINT: Human-Intent Inception for Long-Horizon Robot Manipulation
# arXiv: 2609.02653

name: HINT
full_name: "HINT: Human-Intent Inception for Long-Horizon Robot Manipulation"
organization: "Zhejiang University / Shanghai Jiao Tong University / Noematrix / EndlessAI"
date: "2026-09-02"
paper_url: https://arxiv.org/abs/2609.02653
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (main) or Wall-OSS-0.5 action policy, fine-tuned on highlighted observations; Qwen3-VL Task Manager; Grounding DINO / Qwen semantic grounder; SAM2 tracker; ResNet-18 + GRU Pattern Router"
  action_head: "Backbone's native action expert (pi0.5 flow matching), with a parameter-free token-level attention prior added to visual-encoder and action-to-vision attention logits"
  action_head_category: flow_matching
  parameters: "pi0.5 backbone (no extra trainable parameters in the action model) + lightweight Pattern Router"
  key_innovation: "Agentic intent injection: a Pattern Router classifies four manipulation patterns (free move, pre-contact, transport contact, dexterous contact) to decide which camera views to route and when to re-reason; a VLM Task Manager resolves the subtask and target only at pattern transitions; SAM2 tracks the committed target between transitions; the target is injected into the policy via pixel-level mask highlighting (opacity 0.32) and a head-shared additive attention bias from fractional patch coverage, used identically at training and deployment."

training:
  base_model: "pi0.5 (pi05_base) and Wall-OSS-0.5"
  method: "Action-policy fine-tuning on observations rendered with ground-truth target highlighting and attention priors (train-test symmetric); Pattern Router trained jointly on pattern annotations from all three tasks (CE + 0.5 * progress MSE)"
  data: "Teleoperated demos on dual AgileX PiPER arms at 30 Hz: 50 (fruit-vegetable sorting), 80 (word spelling), 150 (peg-in-hole)"
  hyperparameters: "pi0.5: AdamW, LR 2e-5 -> 2e-7 cosine, 5k warm-up, EMA 0.999, batch 32, 50k/80k/80k steps (sort/spell/peg)"

