ablations:
  libero_plus_total:
    no_choice_e2e: 61.9
    no_cot: 70.8
    no_choice_plus_knowledge_insulation: 76.5
    choice_no_knowledge_truncation: 84.7
    full_ervla: 86.9
    source: "ERVLA paper Table 3 (gray rows)"
    notes: "Demonstrates that BOTH the choice-policy branch AND knowledge truncation contribute substantially; removing choice drops 25 pts, removing knowledge-truncation drops 2.2 pts."
  vlabench_avg_sr:
    no_choice_e2e: 39.2
    no_cot: 40.9
    no_choice_plus_knowledge_insulation: 42.6
    choice_no_knowledge_truncation: 47.2
    full_ervla: 53.2
    source: "ERVLA paper Table 4 (gray rows)"

