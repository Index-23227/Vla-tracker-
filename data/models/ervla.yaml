    libero_plus_spatial: 96.2
    libero_plus_object: 89.6
    libero_plus_goal: 79.6
    libero_plus_long: 82.1
    libero_plus_camera: 77.2
    libero_plus_robot: 75.3
    libero_plus_language: 87.1
    libero_plus_light: 95.1
    libero_plus_background: 94.7
    libero_plus_noise: 92.3
    libero_plus_layout: 86.4
    libero_plus_avg: 86.9
    source: "ERVLA paper Table 3 (LIBERO-Plus zero-shot transfer; post-trained on LIBERO only)"
    date_reported: "2026-06-03"
    eval_condition: "post-trained on LIBERO-10/Spatial/Object/Goal, zero-shot evaluation on the LIBERO-Plus perturbation suite (camera, state, language, background, layout, lighting, noise, robot shifts)"
    notes: "LIBERO-Plus average 86.9 surpasses pi0.5 (85.5), PokeVLA (79.3), OpenVLA-OFT (69.6), pi0-FAST (61.6), pi0 (53.6); 100% on background and lighting variations of Spatial track."
  real_world:
    basic_sr: 96.0
    basic_ps: 97.0
    distractor_sr: 44.0
    distractor_ps: 58.0
    semantic_sr: 42.0
    semantic_ps: 58.0
    long_horizon_sr: 38.0
    long_horizon_ps: 55.0
    avg_sr: 55.0
    avg_ps: 67.0
    source: "ERVLA paper Table 14 (real-robot 20 tasks across 4 difficulty tiers, 5 trials/task, third-person + wrist camera)"
    date_reported: "2026-06-03"
    eval_condition: "Real-robot drawer-placing + table-clearing across Basic/Distractor/Semantic/Long-horizon tiers; outperforms pi0.5 (53/60), UniVLA (37/50), WorldVLA (34/47), ECoT (24/35)."

