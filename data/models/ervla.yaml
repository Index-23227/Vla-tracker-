# Paper: Revisiting Embodied Chain-of-Thought for Generalizable Robot Manipulation
# arXiv: 2606.03784

name: ERVLA
full_name: "Revisiting Embodied Chain-of-Thought for Generalizable Robot Manipulation"
organization: "Tsinghua University; Xiaomi Robotics; Peking University; CASIA; HKUST(GZ); Zhejiang University; Fudan University; Wuhan University; Shanghai Innovation Institute"
date: "2026-06-03"
paper_url: https://arxiv.org/abs/2606.03784
code_url: https://taoshuaiz.github.io/ERVLA/
venue: arXiv preprint
open_source: true

model_type: vla

architecture:
  backbone: "Qwen3-VL-4B-Instruct (vision-language reasoning backbone)"
  llm: "Qwen3-VL-4B"
  action_head: "Mixture-of-Transformers: 36-layer Diffusion Transformer (DiT) policy with flow-matching for continuous action generation. DiT conditions only on the knowledge-truncated semantic-prefix KV cache from the VLM (state token, projected state, noisy action tokens with AdaLN-injected diffusion timestep). An auxiliary 'choice policy' branch reads action-query hidden states inside the VLM to predict N=5 candidate action chunks plus scalar scores via L1+score loss; the DiT loss back-propagates through the VLM only via the semantic prefix (knowledge truncation) so synthetic control-query tokens cannot leak into action conditioning."
  action_head_category: flow_matching
  action_space: "continuous; 60-dim padded action vector supporting single-arm and dual-arm; pre-train action horizon 30, LIBERO horizon 10, VLABench horizon 10"
  parameters: "~4B VLM (Qwen3-VL-4B) + 36-layer DiT action head"
  key_innovation: >
    Reframes embodied CoT as a *training signal* that reshapes the VLA representation space rather
    than a mandatory autoregressive prefix. Three core ingredients: (1) reasoning dropout (p_cot=0.5)
    that randomly replaces the explicit CoT span with an empty <cot></cot> token while still
    supervising the same action outputs, bypassing autoregressive compounding errors at inference,
    (2) auxiliary choice-policy branch on the VLM backbone that supervises N=5 candidate
    continuous-action chunks via action-query tokens, injecting action-level discrimination into the
    VLM, and (3) knowledge-truncated KV conditioning: DiT only attends to the semantic-prefix KV
    cache, never to action-query or state-query control tokens, preventing shortcut copying.
    Identifies a 'CoT contamination' failure mode where jittery dense grounding labels degrade
    control and shows it is mitigated by sparse supervision plus reasoning dropout. Curates the
    largest embodied-CoT corpus to date: 978,743 trajectories, 226.3M samples, 2592.5 hours.

training:
  dataset: "Pre-training corpus: 978.7K trajectories / 226.3M samples / 2592.5 hours mixed from AgiBot (765.6K traj, weight 0.518), DROID (74.7K, 0.180), Fractal (86.7K, 0.120), BridgeData V2 (43.8K, 0.100), MolmoAct (7.9K, 0.082). Post-training: LIBERO-10/Spatial/Object/Goal (500 traj each, 138K+63K+74K+62K samples) and VLABench (5,000 traj, 575K samples). All annotated with structured CoT (Understanding, Grounding, Planning, Acting) including multi-view object grounding."
  method: "Two-stage: (1) large-scale embodied-CoT pre-training with end-to-end joint optimization of flow-matching diffusion loss, choice/score loss, and CoT next-token-prediction loss, p_cot=0.5 reasoning dropout; (2) benchmark-specific post-training on LIBERO (10K steps) or VLABench (20K steps). Zero-shot LIBERO-to-LIBERO-Plus transfer for the headline LIBERO-Plus number."
  pretrain_steps: 120000
  batch_size: 64
  optimizer: "DeepSpeed FusedAdam (betas (0.9, 0.95), wd 0.1)"
  learning_rate: "5e-5 with 2,000-step warmup and cosine decay; bfloat16 mixed precision; gradient clip 1.0"
  token_packing: "Enabled, max packed length 17,600 tokens"
  hardware: "Not specified in the paper; DeepSpeed distributed training"

benchmarks:
