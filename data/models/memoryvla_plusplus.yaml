# Paper: MemoryVLA++: Temporal Modeling via Memory and Imagination in Vision-Language-Action Models
# arXiv: 2606.09827

name: MemoryVLA++
full_name: "MemoryVLA++: Temporal Modeling via Memory and Imagination in Vision-Language-Action Models"
organization: "Tsinghua University; HKU; Dexmal; StepFun"
date: "2026-06-08"
paper_url: https://arxiv.org/abs/2606.09827
code_url: https://shihao1895.github.io/MemoryVLA-PP-Web
venue: arXiv preprint
open_source: false

architecture:
  backbone: "PrismaticVLM 7B (parallel DINOv2 + SigLIP visual encoders) — same VLM as MemoryVLA"
  llm: "LLaMA-7B (default); ablation also uses Qwen2.5 + Dexbotic pretraining"
  action_head: "Full temporal-aware diffusion action expert (DiT with DDIM, 10 sampling steps, CFG=1.5). Cognition-attention layer attends over [cognitive token + noisy actions], then perception-attention injects fine-grained perceptual details. Predicts continuous 7-DoF action sequence; ~300M parameters."
  action_head_category: diffusion
  action_space: "continuous 7-DoF (delta translation + Euler rotation + binary gripper); action chunk length 16; dual-arm = concatenation of two arm vectors"
  parameters: "7B VLM + ~300M diffusion action expert + 1.5B SVD world model (frozen at policy training); world model used only for latent imagination, not pixel decoding"
  key_innovation: >
    Full temporal modeling = past memory + present perception + future imagination. Extends MemoryVLA's
    Perceptual-Cognitive Memory Bank (PCMB) with a Stable Video Diffusion (SVD) 1.5B world model that
    performs PARTIAL denoising to extract multi-scale latent future tokens (no pixel reconstruction).
    An Imagination Former with learnable queries + spatial/temporal attention compresses these into
    K imagined future steps. A memory-guided integration module uses memory-augmented perceptual
    tokens as queries to cross-attend the imagined latents and adaptively fuse them via a sigmoid
    gate, suppressing decision-irrelevant predictions. Full temporal tokens {memory-fused perception,
    cognitive token} then condition a diffusion DiT action expert. PCMB retains MemoryVLA's
    redundancy-aware consolidation (merge most-similar adjacent entries when capacity L is hit).

training:
  datasets:
    libero: "50 demos/task across Spatial/Object/Goal/Long-10/Long-90; jointly train first 4 suites 60k steps, Long-90 separately 30k steps"
    simpler_env: "BridgeData-v2 (~60k WidowX teleop trajectories), 50k steps; world model 40k steps"
    mikasa_robo: "250 demos/task across 5 memory-dependent tasks, jointly 20k steps; world model 20k steps"
    calvin: "ABC->D zero-shot, 60k steps; world model follows VPP"
    libero_plus: "zero-shot (trained on 4 standard suites) and SFT (Libero-Plus in mixed training); 60k steps"
    real_robot: "Franka / WidowX / Dual-ARX5; 50-150 demos for general tasks, 200-300 for long-horizon; world model 20k steps"
  method: "Two-stage. (1) Manipulation-oriented world-model adaptation: SVD fine-tuned with denoising MSE on (current frame, instruction-via-CLIP-cross-attn) -> future video. (2) End-to-end VLA training with frozen world model; diffusion MSE on action sequence."
  optimizer: "global batch 208-256 (26-32/GPU); LR 2e-5; PyTorch FSDP"
  hardware: "8x NVIDIA A100 or H20 GPUs"
  inference: "DDIM 10 steps + CFG scale 1.5; action chunk length 16; single-step world-model denoising sufficient (Tab. VIII(a) ablation)"

