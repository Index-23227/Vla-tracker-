real_robot:
  general_manipulation:
    description: "6 short-horizon tasks: Insert Circle, Egg in Pan, Egg in Oven, Stack Cups, Stack Blocks, Pick Diverse Fruits (5 trials x 5 variants for Fruits; 15 trials for others)"
    memoryvla_avg_succ: 85
    note: "Table VI(a). MemoryVLA++ NOT evaluated on this category — only MemoryVLA (85, +9 over CogACT 76). MemoryVLA++ evaluated only on imagination-dependent tasks."
  long_horizon_memory:
    description: "6 memory-dependent tasks: Push Buttons, Change Food, Guess Where, Clean Table & Count, Pick Place Order, Clean Restaurant Table"
    memoryvla_avg_succ: 83
    note: "Table VI(b). MemoryVLA reaches 83 (+26 over CogACT 57)."
  long_horizon_imagination:
    description: "5 imagination-dependent tasks: Conveyor Pick-Low/Mid/High, Conveyor Scan-Pick, Bag Pack & Zip"
    memoryvla_plusplus_avg_succ: 77
    note: "Table VI(c) per abstract: +28 over baseline. MemoryVLA++ is the model evaluated here because future imagination is explicitly required."
  source: "MemoryVLA++ paper Table VI and Section IV.E"

