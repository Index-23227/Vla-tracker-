architecture:
  backbone: "Backbone-agnostic wrapper. Reported backbones: Diffusion Policy (low-level visuomotor control), UniAct-0.5B, UniVLA-8.5B, and pi0.5-3.3B. SkillMemo adds ~0.1-0.4B parameters (e.g. UniAct 0.5B -> 0.6B, UniVLA 8.5B -> 8.9B, pi0.5 3.3B -> 3.6B)."
  action_head: "Inherited from the host backbone (DP denoising head / pi0.5 flow-matching action expert / UniAct universal-action head), but the head's Mixture-of-Experts gating distribution g(h_t) is refined at inference by fusion with retrieved memory gating profiles: g'(q_t) = lambda*g(q_t) + (1-lambda)*mean_n(v_n[t'])"
  action_head_category: hybrid
  action_space: continuous
  parameters: "backbone-dependent; best configuration pi0.5-SkillMemo = 3.6B (vs 3.3B pi0.5 baseline)"
  key_innovation: >-
    Two coupled modules. (1) Expert-Guided Trajectory Segmentation (EGTS): instead of explicit
    fixed-chunk segmentation, a Mixture-of-Experts layer y_t = sum_i g_i(h_t) * E_i(h_t) implicitly
    partitions long-horizon demonstrations into latent atomic skills, where the gating network defines
    temporal skill boundaries. Experts are specialized via a synergy-based Partial Information
    Decomposition loss L_PID = -(I({A,B};G) - I(A;G) - I(B;G)), plus load-balancing losses and top-k
    routing to prevent expert collapse. (2) Skill-Level Memory Architecture (SLMA): an episodic
    key-value memory bank M = {(k_m, v_m)} where the key k_m = (1/L) * sum_t h_t is the temporally
    aggregated centroid feature of a skill segment and the value v_m = {g(h_t)} is the full sequence
    of gating weights over that segment. At inference, cosine similarity s(q_t, k_m) retrieves the
    top-N entries; a reliability check against threshold delta gates the fusion, and retrieved gating
    profiles are averaged into the current gating distribution. A dynamic pruning policy (oldest
    timestamps, never-retrieved entries, entries repeatedly below delta) keeps the bank within M_max.

training:
  data: "LIBERO (Goal / Spatial / Object / Long, 10 tasks per suite); Push-T, UR3 Block Push, Franka Kitchen for the DP backbone; 50 expert demonstrations per task collected by kinesthetic teaching for real-world UR5e tasks"
  compute: "8x NVIDIA A6000 GPUs, PyTorch; 32 samples per GPU (global batch 256); AdamW, learning rate 2e-5; single unified policy across all LIBERO tasks trained for 30k steps following the pi0.5 protocol"
  inputs_outputs: "Single RGB image observation + language instruction -> 7-dimensional continuous action (6-DoF end-effector pose + gripper command)"
  hyperparameters: "N=5 MoE experts by default (chosen over N=1/2/3/8/10 for the accuracy/latency trade-off); memory bank capacity M_max=1000 skill entries"

