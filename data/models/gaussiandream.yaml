  key_innovation: "Feed-forward 3D Gaussian world-model plug-in for VLA policies. Learnable GaussianDream Queries in the encoder capture current-frame 3D structure and short-horizon future evolution; during training two auxiliary heads (static reconstruction, future prediction) supervise the prefix with RGB, depth and pseudo 3D scene-flow signals. At inference all auxiliary heads are discarded and only the learned prefix conditions action generation, giving 3D geometric grounding without test-time Gaussian reconstruction or future prediction."

