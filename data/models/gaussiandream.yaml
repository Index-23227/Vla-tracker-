# Paper: GaussianDream: A Feed-Forward 3D Gaussian World Model for Robotic Manipulation
# arXiv: 2605.20752

name: GaussianDream
full_name: "GaussianDream: A Feed-Forward 3D Gaussian World Model for Robotic Manipulation"
organization: "Tuojing Intelligence; UCAS; Institute of Automation, CAS; Tsinghua University; Zhejiang University; Beihang University; CMU; University of Hong Kong"
date: "2026-05-20"
paper_url: https://arxiv.org/abs/2605.20752
code_url: https://github.com/TuojingAI/GaussianDream
venue: null
open_source: true

architecture:
  action_head: "flow-matching action expert with GaussianDream prefix conditioning"
  action_head_category: flow_matching
  parameters: "1024 GaussianDream query tokens (2048-d VLM space); TGE module with 12 attention blocks × 8 heads; 256×256 Gaussian centers per frame; total VLA parameter count not stated"
  key_innovation: "Feed-forward 3D Gaussian world-model plug-in for VLA. Learnable GaussianDream Queries inserted into the encoder produce a compact prefix that captures current-frame 3D structure and short-horizon (t+1...t+5) future evolution via the Temporal Gaussian Evolution (TGE) module. During training two auxiliary heads supervise the prefix: a current-reconstruction head outputs 256x256 Gaussian centers from depth unprojection (depth + RGB rendering loss) and a future-prediction head predicts horizon-conditioned center displacements (depth + RGB + pseudo 3D scene-flow loss). Pseudo depth from Depth Anything V2, pseudo flow from RAFT. At inference all auxiliary heads are discarded — only the learned prefix conditions flow-matching action generation, avoiding Gaussian decoding/rendering/video rollout at test time."

