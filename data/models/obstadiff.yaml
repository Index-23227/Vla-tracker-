# Paper: ObstaDiff: Generalizable Diffusion Policy Learning via Obstacle-aware Representations
# arXiv: 2609.10918

name: ObstaDiff
full_name: "ObstaDiff: Generalizable Diffusion Policy Learning via Obstacle-aware Representations"
organization: "University of California, Los Angeles"
date: "2026-09-10"
paper_url: https://arxiv.org/abs/2609.10918
code_url: null
venue: arXiv
open_source: false
model_type: visuomotor_policy

architecture:
  backbone: "Lightweight StructuredObsEncoder: semantic branch (bg/obstacle/target masks) and depth branch, each 4x Conv-GroupNorm-ReLU + spatial softmax (64-D + 32-D keypoint coordinates) concatenated with 7-D EEF pose (103-D per step, 206-D for 2 obs steps); TOB masks from fine-tuned YOLOv8s-Worldv2 + MobileSAM"
  llm: null
  action_head: "Conditional diffusion U-Net (DDIM, squared-cosine schedule, epsilon-prediction, K=100 steps) predicting 16-step 7-D Cartesian EEF pose sequences, executing 8; alignment stage only, followed by nearest-neighbour replay of demonstrated interaction trajectories at a target-centred bottleneck"
  action_head_category: diffusion
  parameters: "not stated"
  key_innovation: "Target-obstacle-background (TOB) four-channel observation (three semantic masks + normalized depth) encoded by a structure-aware lightweight encoder instead of a ResNet-18 image backbone, conditioning a diffusion policy for obstacle-aware approach in cluttered greenhouse scenes; manipulation decomposed into learned alignment to a bottleneck pose and replay-based interaction selected by a gated nearest-neighbour switching rule."

training:
  base_model: null
  method: "Imitation learning from scratch (diffusion policy), 250 epochs, AdamW lr 1e-4, batch 32, EMA, lowest-validation-loss checkpoint"
  data: "90 expert alignment demonstrations via Sawyer gravity-compensation teaching (purple pepper, 3 obstacle configurations x 30), plus 26-trajectory interaction replay library"

benchmarks:
  real_world:
    tpg_success: 75.00
    olg_success: 71.43
    tag_success: 80.00
    real_world_avg: 75.41
    source: "Paper Table 1, ObstaDiff row, TSR (%)"
    date_reported: "2026-09-10"
    eval_condition: "7-DoF Sawyer with eye-in-hand RealSense D455 in indoor greenhouse; pepper-reaching with plant obstacles; 61 trials (TPG n=20, OLG n=21, TAG n=20, TAG uses unseen green peppers); mean pooled over 61 trials"

  real_world_collision_rate:
