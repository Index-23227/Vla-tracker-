# Paper: Reflex: Real-Time VLA Control through Streaming Inference
# arXiv: 2607.14695

name: Reflex
full_name: "Reflex: Real-Time Vision-Language-Action Control through Streaming Inference"
organization: "Beijing University of Posts and Telecommunications"
date: "2026-07-16"
paper_url: https://arxiv.org/abs/2607.14695
code_url: https://github.com/9yc/Reflex
venue: "ICML2026"
open_source: true

architecture:
  action_head: "flow matching"
  action_head_category: flow_matching
  parameters: "2.3B (Pi0.5 base) / 3.1B (Pi0 base)"
  key_innovation: "A streaming inference framework for flow-matching VLAs that exploits the Timestep-Invariance Property of perception encoders to partition attention into static/sliding/dynamic zones, enabling O(1) cache updates. Adds AdaRMSNorm for BFloat16 stability and an asynchronous vision/policy pipeline with future-state prediction, achieving 2.58x speedup and stable 50Hz streaming without performance degradation."

benchmarks:
  libero:
    libero_spatial: 83.2
    libero_object: 80.4
    libero_goal: 82.0
    libero_long: 72.4
    source: "Table 3 (Pi0.5 + Reflex), arXiv:2607.14695"

eval_conditions:
  libero:
    setting: "fine-tuned"
    base_model: "Pi0.5 (2.3B)"
    note: "Reflex is a streaming inference framework; scores are Pi0.5 with Reflex, maintaining parity with the synchronous baseline"

tags: [flow-matching, libero, streaming-inference, kv-cache, ICML2026]
