    shifted_history_tcp_rmse_mm: 19.41
    matched_history_joint_rmse_rad: 0.0349
    matched_history_tcp_rmse_mm: 15.27
    source: "Paper Table IV"
    eval_condition: "matched force-route ablation on 50 Plug/Vase trials within one checkpoint; suffix-length weighted RMSE, lower is better"

  planner_boundary_accuracy:
    vase_next_subtask_within_5_queries: 94.6
    plug_next_subtask_within_5_queries: 92.4
    source: "Paper Sec. IV-B text"
    eval_condition: "Qwen3.5-4B without task-specific SFT, 500 boundaries each; boundary-level, not end-to-end"

eval_conditions:
  real_world: "CR1 dual-arm platform, 4 task families, 50 trials per task, normalized task progress"
  atomic_steering: "offline counterfactual prompt interventions with fixed images/state"

tags: [language-steering, atomic-motion, forward-kinematics, codebook, force-adaptation, contact-rich, bimanual, pi0.5, flow-matching, real-time-chunking, hierarchical, qwen3.5, real-robot]
