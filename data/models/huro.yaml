# Paper: HuRo: Robotizing Human Videos for Scalable VLA Pretraining
# arXiv: 2609.10706

name: HuRo
full_name: "HuRo: Robotizing Human Videos for Scalable VLA Pretraining"
organization: "RLWRLD / Yonsei University"
date: "2026-09-09"
paper_url: https://arxiv.org/abs/2609.10706
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "GR00T-N1.6-3B architecture (VLM backbone initialized from the official GR00T-N1.6-3B checkpoint)"
  action_head: "DiT flow-matching action head trained from scratch; predicts H=40 action chunk of relative wrist poses (3D translation + 6D rotation) and absolute hand-joint targets for both hands"
  action_head_category: flow_matching
  parameters: "~3B"
  key_innovation: "Robotization pipeline that converts heterogeneous egocentric human videos (Ego4D, EPIC-Kitchens, EgoDex, EgoVerse, Ego10K) into robot-aligned episodes: camera/hand estimation, PyRoKi retargeting of hand motion to robot joints (actions a_t = s_{t+1}), human-arm removal (SAM2 + ProPainter) and Isaac Sim robot overlay. Yields ~630K episodes / 142M frames (~1,317 h) used for end-to-end VLA pretraining with retargeted actions."

training:
  base_model: "GR00T-N1.6-3B (VLM only; action head from scratch)"
  method: "Flow-matching pretraining on HuRo robotized episodes (80k steps, global batch 2048, AdamW lr 1e-4, visual encoder jointly fine-tuned), then downstream fine-tuning 30k steps, batch 128, cosine lr 1e-4"
  data: "HuRo dataset: ~630K robotized episodes, 142.2M frames from five egocentric human-video sources, targeted at the ALLEX bimanual dexterous robot; downstream: 16-43 teleop demos per real task"

benchmarks:
  real_world:
    allex_id_avg: 88.4
    allex_ood_avg: 72.2
    real_world_avg: 80.3
    source: "Paper Appendix Table 2, Ours (100% PT) row"
    date_reported: "2026-09-09"
    eval_condition: "ALLEX bimanual dexterous robot, 4 real tasks (Apple Pick-and-Place, Cup Stacking, Cup-Noodle Handover, Microwave Loading); completion score %; overall = unweighted mean of ID avg and OOD avg"

  real_world_allex_per_task:
    apple_pick_place_id: 83.3
    apple_pick_place_ood: 50.0
    cup_stacking_id: 87.5
    cup_stacking_ood: 79.2
    cup_noodle_handover_id: 94.4
    cup_noodle_handover_ood: 86.1
    microwave_loading_ood: 73.3
    source: "Paper Appendix Table 2, Ours (100% PT) row"
    eval_condition: "per-task breakdown of the headline 100% PT model; Microwave Loading evaluated OOD only"

  real_world_allex_baselines:
