name: VisualThink-VLA
full_name: "VisualThink-VLA: Visual Intermediate Reasoning for Effective and Low-Latency Vision-Language-Action Policies"
organization: "Zhejiang University / Cornell University / National University of Singapore / Xidian University"
date: '2026-05-28'
paper_url: https://arxiv.org/abs/2605.30011
code_url: https://github.com/DCDmllm/VisualThink-VLA
venue: null
open_source: true
architecture:
  backbone: "OpenVLA-7B (primary); also evaluated on Octo and SmolVLA"
  llm: "Llama-2-7B (via OpenVLA)"
  action_head: >-
    OpenVLA's discrete autoregressive action tokens; the VLA backbone
    is *frozen* and conditioned on a compact set of routed visual
    evidence tokens produced upstream.
  action_head_category: autoregressive
  parameters: "7B (OpenVLA backbone)"
  visual_evidence_interface: >-
    A "compact visual-evidence interface" with six candidate channels
    (bbox, edge, motion, relation, depth, segment); a task-adaptive
    router predicts channel probabilities and applies a hardening
    operator that converts soft scores to binary masks. Four operational
    channels are activated per decision step. Training uses
    soft-hard collaborative masks with blending coefficient alpha=0.35.
  key_innovation: >-
    VisualThink-VLA replaces textual chain-of-thought reasoning (slow,
    noisy) with *visual* intermediate reasoning: a routed set of
    compact evidence vectors (bbox / edge / motion / relation / depth /
    segment) that condition a frozen base VLA. The selective routing
    keeps spatial accuracy without decoding latency, dropping
    BridgeData V2 latency from 8.377s (textual CoT) to 0.367s
    (22.8x speedup) while raising success from 75.37% to 89.49%.
training:
  dataset: >-
    VisualEvidence-Kit (VisualEvidence-Set, 754.7k VLA instructions),
    BridgeData V2, Fractal, RoboTurk, LIBERO, UT Austin MUTEX
  hardware: "not disclosed in paper"
  epochs: "not disclosed"
benchmarks:
  libero:
    libero_spatial: 96.69
    libero_object: 97.74
    libero_goal: 97.05
    libero_long: 95.87
    libero_avg: 96.84
    libero_spatial_latency_s: 0.356
    libero_object_latency_s: 0.385
    libero_goal_latency_s: 0.345
    libero_long_latency_s: 0.421
    source: "Tables in VisualThink-VLA paper"
    date_reported: '2026-05-28'
    eval_condition: "frozen OpenVLA + VisualThink routing, fine-tuned per suite"
  bridge_v2:
    success: 89.49
    latency_s: 0.367
    baseline_openvla_success: 75.37
    baseline_openvla_latency_s: 0.345
    source: "VisualThink-VLA paper"
    date_reported: '2026-05-28'
    eval_condition: "BridgeData V2"
