name: Ego2Robot
full_name: "Ego2Robot: Scalable Robot Data Synthesis from Egocentric Human Data"
organization: "AIM3 Lab, Renmin University of China; Qwen Team, Alibaba Inc.; ShanghaiTech University; Beijing Institute for General Artificial Intelligence (BIGAI); Beijing University of Aeronautics and Astronautics"
date: "2026-08-03"
paper_url: https://arxiv.org/abs/2608.02580
code_url: https://www-ye.github.io/ego2robot_blog/
venue: null
open_source: false
model_type: vla

architecture:
  backbone: "Qwen3.5-4B vision-language backbone processing 2-3 RGB views per timestep plus a structured text prompt (embodiment / instruction fields); camera intrinsics K and extrinsics T_wc injected into visual features via mRoPE positional encodings"
  llm: "Qwen3.5-4B"
  action_head: >
    Diffusion Transformer (DiT) action head conditioned on backbone hidden states H via
    cross-attention. A context generator compresses H into conditioning features C using 8
    learnable query tokens; DiT layers attend to C to predict 32-step action chunks. Trained with
    a flow-matching objective L = E ||v_theta(a_t, t, c) - (eps - a_0)||^2 on a_t = (1-t)a_0 + t*eps;
    8 training steps / 4 Euler inference steps (dt = 1/4). Each action step is 7-dim:
    3D position delta, 3D rotation-vector delta, 1D gripper, expressed as camera-frame relative EEF.
  action_head_category: flow_matching
  action_space: continuous
  parameters: "~4B backbone (Qwen3.5-4B) + DiT action head (head size not disclosed)"
  key_innovation: >
    An end-to-end ego-to-robot synthesis pipeline plus a disentangled generalization benchmark.
    (1) Action alignment: 21 hand keypoints are retargeted to a parallel-gripper frame via a virtual
    fingertip p_vf = 0.7*p_index + 0.3*p_middle, TCP = (p_thumb + p_vf)/2, width = ||p_thumb - p_vf||,
    with a handedness-consistent orthonormal grasp frame; Savitzky-Golay smoothing on positions/widths
    and Gaussian-weighted SLERP on orientations; per-source frame subsampling to match robot action speed.
    (2) Visual alignment: SAM 3 arm segmentation, ProPainter inpainting for hand removal, robot base
    pose search over SE(3) maximizing IK feasibility (mink/MuJoCo) with a reach penalty encouraging
    operation at 65% of max reach, frame-by-frame IK, and depth-aware compositing (Depth Anything V3
    scene depth vs MuJoCo render depth) separating arm-body and gripper masks.
    (3) Three-level quality curation: L1 pipeline-internal (IK error, self-collision, visibility),
    L2 statistical (Q1/Q99 outliers, residual/acceleration/jerk sudden-change, >60% invalid-frame
    episode drop), L3 VLM consistency audit with Qwen3.5 at 4 fps.
    Path A consumes annotated ego datasets; Path B estimates hand poses from raw video via WiLoR +
    DynHaMR and segments long videos into subtasks with Qwen3.5. Camera-frame relative EEF actions
    unify sources with unknown, diverse camera placements without per-video calibration.
    The result is 18,561 h of synthetic robot data across 15 morphologies from ~1,940 h of ego video
    (~9.6x amplification), the largest ego-to-robot dataset reported.

training:
  dataset: >
    Ego sources (~1,940 h before processing): ANT (7 h, in-house pick-and-place with hand pose
    annotations), EgoDex (732 h), ViTRA (249 h), EgoVerse (954 h). Rendered across 15 morphologies
    (Panda, UR5e, ARX-L5, xArm7, Sawyer, Kinova Gen3, IIWA, Jaco, FR3, UR10e, ViperX, WidowX, Piper,
    YAM, Aloha-Agilex) yielding 18,561 h after curation. Robot data (~6,565 h): DROID (~511 h),
    AgibotWorld (~2,404 h), InternData (~3,650 h). Four pretraining configurations compared:
    robot-only and Ego2R:Robot at 1:3, 3:1, 1:1 (implemented as per-source sampling weights).
    Action speed alignment subsamples ANT/EgoDex to 60%, EgoVerse to 45%, ViTRA to 25% of frame rate.
  method: >
    Flow matching over 32-step action chunks in camera-frame relative EEF. Structured prompt with
    embodiment field (robot_aloha / h2r_arx / human_ego) dropped to "None" with 15% probability;
    instruction never dropped. All pretraining configurations process an identical number of frames
    (~19.2M) so dataset-size effects are controlled.
  steps: "Pretraining 200K steps (~19.2M frames); finetuning 50K steps from pretrained weights"
  hardware: "8x A100 GPUs, batch 12/GPU, backbone lr 1e-5 -> 1e-6 cosine (5K warmup), action head lr 10x (1e-4 -> 1e-5), AdamW (beta1 0.9, beta2 0.95), bf16, ZeRO-1 (pretrain) / ZeRO-2 (finetune); no image augmentation during pretraining, ColorJitter during finetuning"

