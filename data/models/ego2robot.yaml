  real_world_arx_acone:
    put_blocks_delta_vs_robot_only: 14.0
    insert_screw_delta_vs_robot_only: 13.0
    source: "Ego2Robot paper Section 5.4 and Figure 4; only the two largest deltas are stated numerically in the text, absolute per-task success rates appear in the bar chart only"
    date_reported: "2026-08-03"
    eval_condition: "ARX ACone dual-arm platform (6-DOF/arm, parallel gripper, head + two wrist RGB cameras, 15 Hz control, replan every 32 steps), 5 long-horizon tasks (Put Fruits, Put Blocks, Fold Towel, Sweep Trash, Insert Screw), 20 teleop demos/task + ~35 min ego play video processed via Path B into 675 ACone synthetic episodes; sub-step partial scoring out of 100, 20 trials/task; 'Mix + Ego2R Play' (1:1 teleop-to-Ego2R finetuning mix) best on all five tasks"

eval_conditions:
  robotwin_v2: "fine-tuned on RoboTwin 2.0's 50 clean tasks (50 demos/task, 2,500 episodes), evaluated at 50 episodes/task with binary success; aggregates are Visual = mean(BG, Light, Robot Color), Scene = mean(Height, Clutter, Camera), Embodiment = mean(ARX, UR5, Franka), Task = mean(Obj, Lang)"
  robotwin_v2_baseline_robot_only: "same protocol, robot-only pretraining (DROID + AgibotWorld + InternData)"
  robotwin_v2_mixing_ratio_ablation: "same protocol, Ego2R:Robot pretraining ratios of 1:3 and 3:1"
  robotwin_v2_perturbation_breakdown: "11 independently controlled perturbation settings decoupled from RoboTwin 2.0's bundled randomization, plus 4 newly introduced axes (robot color, camera offset, unseen objects, paraphrased language) and 3 zero-shot cross-embodiment settings"
  robotwin_v2_perturbation_breakdown_baseline_robot_only: "identical perturbation protocol with robot-only pretraining"
  robotwin_v2_perturbation_breakdown_mixing_ratio_ablation: "identical perturbation protocol at 1:3 and 3:1 pretraining ratios"
  robotwin_v2_morphology_scaling_ablation: "ego-only pretraining (no robot data) to isolate the pipeline's contribution; success rate on RoboTwin Randomized"
  ebench: "fine-tuned separately on EBench Table Top training set, chunk 32"
  ebench_pretraining_ablation: "identical EBench finetuning across all four pretraining configurations"
  real_world_arx_acone: "real-robot deployment, sub-step partial scoring, 20 trials per task; absolute values are chart-only so only text-stated deltas are recorded"

