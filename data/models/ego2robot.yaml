    date_reported: "2026-08-03"
    eval_condition: "RoboTwin 2.0 extended with 11 independent perturbation settings; pretrained on Ego2R:Robot = 1:1, finetuned on RoboTwin's 50 clean-setting tasks (50 demos/task), chunk 20, replan every 16"

