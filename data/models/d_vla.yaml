architecture:
  action_head: "Framework-level work; agnostic to specific action head. Validated on pi0.5 (diffusion / flow-matching) and OpenVLA-OFT (autoregressive Transformer + PEFT)."
  action_head_category: other
  parameters: "Framework supports billion-parameter VLAs (pi0.5 ~3B, OpenVLA-OFT ~7B); trillion-parameter scalability claimed without specific trained model"
  key_innovation: "Distributed asynchronous RL system co-designed for VLA training, addressing resource conflict between high-fidelity physics simulation and the VRAM/bandwidth demands of large deep-learning models. Four pillars: (1) Plane Decoupling that physically separates high-frequency Data Plane (env trajectories) from low-frequency Weight Control Plane (param sync); the Control Plane is offloaded to a CPU-based Gloo channel to avoid CUDA stream contention with PhysX. (2) Four-thread asynchronous 'Swimlane' pipeline that overlaps sampling, inference, gradient computation, and parameter distribution. (3) Dual-pool VRAM management (Model Computation Pool via Torch caching allocator + Environment Auxiliary Pool for simulator temporaries) prevents fragmentation. (4) Topology-aware local replication keeps the sampling-inference closed loop inside a node and uses FSDP for global gradient reduction. RL algorithm is GRPO."

