# Paper: Gripper-aware Vision Language Action Models
# arXiv: 2608.24603

name: GVLA
full_name: "Gripper-aware Vision Language Action Models"
organization: "University of Liverpool; MBZUAI; Indian Institute of Science; The University of Tokyo; ZHAW; University of Arkansas; Physical Intelligence; Huazhong University of Science and Technology"
date: "2026-08-25"
paper_url: https://arxiv.org/abs/2608.24603
code_url: null
venue: null
open_source: false
model_type: vla

architecture:
  backbone: "pi0.5 (also pi0 variant)"
  llm: "pi0.5 pre-trained VLM"
  action_head: >
    pi0.5 flow-matching action expert extended with (i) a multi-gripper tokenizer: three levels of
    learnable soft-prompt tokens (platform, gripper type, gripper instance) prepended to observation
    tokens, and (ii) a dual Mixture-of-Adapters at the final action-expert layer, with a platform router
    and a gripper router selecting top-k bottleneck adapters added residually. Trained with conditional
    flow-matching action loss + auxiliary gripper-type classification loss + load-balance loss.
  action_head_category: flow_matching
  parameters: "Not stated"
  key_innovation: >
    Gripper-conditioned VLA: hierarchical gripper soft-prompt tokenization and gripper/platform-routed
    Mixture-of-Adapters so a single policy learns gripper-specific grasp strategies; introduces MiGA,
    a 103K-demonstration dataset over 5 gripper types (parallel-jaw, 3-finger, soft, suction, dexterous hand).

training:
  data: "MiGA: 103,000 demonstrations, 36 tasks, 5 gripper types, sim (Isaac Lab) + real (xArm7, Franka, UR5)"
  method: "fine-tuned from pi0.5 / pi0 backbones on MiGA"

