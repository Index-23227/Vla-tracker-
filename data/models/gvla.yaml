    stacked: 76.00
    constrained: 62.50
    semantic: 72.50
    miga_sim_avg: 66.00
    source: "Paper Table 2 (GVLA pi0.5 backbone row)"
    date_reported: "2026-08-25"
    eval_condition: "MiGA simulation, success rate (%) across four task categories and gripper types"
  miga_sim_pi0_backbone:
