training:
  dataset: "RoboCerebra / LIBERO target data; selector: 6,660 demonstration records + 5,630 policy-rollout records (2,034,310 decision samples); real: 50 demos per task"
  method: "Planner and executor independently fine-tuned from pi0.5; planner supervised for subtask-command generation (2,000 steps); then base branches frozen and selector (LoRA + anchor/pruning/scoring modules) trained 20,000 steps with ranking + stop-aware BCE losses"
  compute: "4x NVIDIA A100 80GB (selector training)"

eval_conditions:
  libero: "fine-tuned; 100 episodes per task"
  robocerebra: "600 episodes over 6 conditions"
  real_world: "50 rollouts per task, matched initial states"

tags: [hierarchical, long_horizon, adaptive_action_chunking, subtask_termination, pi05, flow_matching, token_pruning, libero, robocerebra, real_robot]
