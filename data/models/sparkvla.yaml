# Paper: SparkVLA: Stop-Aware Hierarchical VLA with Adaptive Action Chunking for Long-Horizon Manipulation
# arXiv: 2608.16172

name: SparkVLA
full_name: "SparkVLA: Stop-Aware Hierarchical VLA with Adaptive Action Chunking for Long-Horizon Manipulation"
organization: "Beijing Institute of Technology; Tsinghua University"
date: "2026-08-17"
paper_url: https://arxiv.org/abs/2608.16172
code_url: null
venue: arXiv
open_source: false
model_type: vla

architecture:
  backbone: "Two branches derived from pi0.5 (frozen SigLIP vision encoder)"
  llm: "pi0.5 VLM backbone (high-level planner branch, LoRA rank 16 on layers 1-8 for the selector)"
  action_head: "Low-level branch is the full pi0.5 VLA with its flow-matching action expert (H=50 chunks); a stop-aware selector (2-layer, 8-head transformer) on the planner branch ranks Stop against every action-prefix length 1..H"
  action_head_category: flow_matching
  action_space: "continuous (action chunks, adaptive executed prefix length)"
  parameters: "pi0.5 x2"
  key_innovation: "Unifies subtask termination and execution-horizon selection into one ranking over {Stop, prefix 1..H}, trained from offline ordinal preferences (pairwise ranking + stop-aware auxiliary loss); history-aware subtask anchor from the planner's penultimate layer guides differentiable grid-sample visual-token pruning (32 tokens/camera)."

