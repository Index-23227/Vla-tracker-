# Paper: LM-X: Explainable Vision-Language-Action Modeling via Progress, Event, and Uncertainty Prediction
# arXiv: 2608.25757

name: LM-X
full_name: "LM-X: Explainable Vision-Language-Action Modeling via Progress, Event, and Uncertainty Prediction"
organization: "Humanoid Robot (Shanghai) Co., Ltd.; E-surfing Digital Life Technology Co., Ltd., China Telecom"
date: "2026-08-26"
paper_url: https://arxiv.org/abs/2608.25757
code_url: null
venue: arXiv preprint
open_source: false
model_type: vla

architecture:
  backbone: "Cosmos-Reason2-2B vision-language backbone (Qwen-VL front end); hidden tokens from the 16th layer form the shared representation"
  llm: "Cosmos-Reason2-2B"
  action_head: "Three-stage predictive hierarchy: 2-layer Transformer RTG (return-to-go) expert over 128 ordered bins; 32-layer DiT event expert (flow matching) predicting the 60-step event-to-go action chunk up to the next semantic event; 32-layer DiT action expert (flow matching, H=30) conditioned on VL tokens, proprioception, RTG and event hidden state, with mean-velocity and heteroscedastic log-variance projections propagated to action-space variance"
  action_head_category: flow_matching
  action_space: continuous
  parameters: "~6B total"
  key_innovation: "Jointly pretrains action generation with three directly supervised explanatory signals (RTG progress/state quality, ETG next-event action chunk, native heteroscedastic action-flow uncertainty) that are emitted online and condition control, rather than being attached post hoc; pretraining data include >1,000 hours of failed rollouts to supervise regression-aware progress."

training:
  pretraining_data: ">20,000 hours of heterogeneous real-robot trajectories (15+ embodiments incl. 10+ humanoids), including >1,000 hours of failed policy rollouts; OXE and AgiBot World sampled with 10% probability"
  method: "Pretraining from Cosmos-Reason2-2B with L = 0.1*L_RTG + L_event + L_action-U for two epochs (~700k steps, global batch 3,072, 64 B200 GPUs, ~20 days); failure minibatches update only the RTG branch; 20% event-embedding dropout; task-specific post-training (full model) on successful episodes"

