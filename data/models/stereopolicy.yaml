  key_innovation: "StereoPolicy is a visuomotor policy learning framework that directly leverages synchronized stereo image pairs to strengthen geometric reasoning, without requiring explicit 3D reconstruction or camera calibration. Pretrained 2D vision encoders process each view independently and a Stereo Transformer fuses the representations, implicitly capturing spatial correspondence and disparity. The module plugs into diffusion-based and pretrained VLA policies and consistently outperforms RGB, RGB-D, point cloud, and multi-view baselines."

