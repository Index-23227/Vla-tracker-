# Paper: StereoPolicy: Improving Robotic Manipulation Policies via Stereo Perception
# arXiv: 2605.09989

name: StereoPolicy
full_name: "StereoPolicy: Improving Robotic Manipulation Policies via Stereo Perception"
organization: "Stanford University, Northwestern University, Lambda Inc."
date: "2026-05-11"
paper_url: https://arxiv.org/abs/2605.09989
code_url: https://stereopolicy.github.io/
venue: null
open_source: false

architecture:
  action_head: "Per-view 2D vision encoder (ResNet18 default; also DINOv2 / OpenCLIP-B/16 / SigLIP-SO400M/14 / EdgeNeXt-S evaluated) + 2-layer, 8-head Stereo Transformer with 2D RoPE producing a 128-dim fused latent; plugs into Diffusion Policy heads (StereoPolicy-DP) and into VLA action heads such as GR00T-N1.5 and pi_0.5 (StereoPolicy-VLA)"
  action_head_category: other
  parameters: "Not explicitly reported; Stereo Transformer module is 2 layers, 8 heads, 128-d latent"
  key_innovation: "Calibration-free, reconstruction-free stereo fusion: two pretrained 2D encoders process synchronized left/right images and a Stereo Transformer with 2D RoPE cross-attends across views, implicitly capturing disparity and spatial correspondence. The module is a plug-in for both diffusion policies and pretrained VLAs and consistently beats RGB, RGB-D, point cloud, and multi-view baselines across RoboMimic, RoboCasa, OmniGibson and real-world tabletop / bimanual mobile manipulation."

benchmarks:
  robocasa:
    robocasa_toolhang_100: 94.1
    robocasa_toolhang_200: 57.1
    source: "StereoPolicy paper Table 2 (StereoPolicy-DP, simulation)"
    date_reported: "2026-05-11"
    eval_condition: "Diffusion Policy head with stereo input; per-task best of RGB / RGB-D / RGBD-3DDA / PCD-PointNet / PCD-DP3 / Multi-View baselines"

real_world:
  tabletop_avg_success_rate: 59.0
  baselines_avg:
    rgb: 42.0
    rgb_d: 41.0
    rgbd_3dda: 45.0
    pcd_pointnet: 14.0
    pcd_dp3: 27.0
    multi_view: 44.0
  notes: "5-task tabletop suite (Banana PnP, Toast Insert, Plastic / Steel / Glass Cup) with 20 trials per task — StereoPolicy-DP 59% vs best baseline 45% (RGBD-3DDA). StereoPolicy-VLA on pi_0.5 mobile manipulation: 74.40% at 300 demos vs 70.31% RGB; 51.72% at 30 demos vs 48.71% RGB."

eval_conditions:
  robocasa: "StereoPolicy-DP fine-tuned per task with 100-300 demos; consistently outperforms RGB, RGB-D, point cloud, and multi-view baselines across RoboMimic / RoboCasa / OmniGibson tasks."
  vla: "StereoPolicy-VLA trained on 8x H100; GR00T-N1.5 backbone for 60K steps (LR 1e-4), pi_0.5 backbone for 80K steps (global batch 128, LR 2.5e-5)."

tags: [robocasa, stereo, plug-in, diffusion-policy, vla]
